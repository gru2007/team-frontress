# Central node. The original tf2pickup app integrates with GC and its existing MongoDB.
services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GC_HOST: "${GC_HOST:?Set the public GC hostname}"
      PORTAL_HOST: "${PORTAL_HOST:?Set the public portal hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontress-gc:
        condition: service_started

  pickup-portal:
    build:
      context: ${TF2PICKUP_SOURCE:-../../../tf2pickup-frontress}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      WEBSITE_URL: "https://${PORTAL_HOST:?Set the public portal hostname}"
      WEBSITE_NAME: Team Frontress
      MONGODB_URI: "${MONGODB_URI:?Use the existing tf2pickup MongoDB connection string}"
      STEAM_API_KEY: "${PORTAL_STEAM_API_KEY:?Set the Steam user API key for player profiles}"
      SUPER_USER: "${SUPER_USER:?Set the existing tf2pickup super-user SteamID64}"
      KEY_STORE_PASSPHRASE: "${KEY_STORE_PASSPHRASE:?Use the existing tf2pickup key-store passphrase}"
      GAME_SERVER_SECRET: "${TF2PICKUP_GAME_SERVER_SECRET:?Use the existing tf2pickup game server secret}"
      LOG_RELAY_ADDRESS: "${LOG_RELAY_ADDRESS:-localhost}"
      LOG_RELAY_PORT: "${LOG_RELAY_PORT:-9871}"
      TELEMETRY_DISABLED: "true"
      FRONTRESS_GC_URL: http://frontress-gc:27100
      GC_ADMIN_KEY: "${GC_ADMIN_KEY:?Set an independent GC admin key}"
      FRONTRESS_ADMIN_STEAM_IDS: "${FRONTRESS_ADMIN_STEAM_IDS:-}"
    depends_on:
      frontress-gc:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
