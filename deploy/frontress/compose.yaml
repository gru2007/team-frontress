# The Frontress game coordinator. Run from this directory:
#
#   docker compose up -d --build
#
# Game servers are not started from here: every server that should host
# matches connects to the GC with a server key and joins its pool (see
# README.md).

services:
  frontress-gc:
    build:
      context: ../../services/gc
    image: frontress-gc:local
    restart: unless-stopped
    environment:
      STEAM_API_KEY: "${STEAM_API_KEY:-}"
      # A server key game servers can present (in addition to gc.json's).
      GC_SERVER_KEY: "${FRONTRESS_COORDINATOR_SECRET:-}"
    volumes:
      - ${FRONTRESS_GC_CONFIG:-./gc.json}:/app/gc.json:ro
      - frontress_gc_data:/data
    ports:
      - "${FRONTRESS_GC_BIND:-0.0.0.0}:${FRONTRESS_GC_PORT:-27100}:27100"

volumes:
  frontress_gc_data:
