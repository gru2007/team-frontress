services:
  recruiting-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/recruiting-bot.db
      LISTEN_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - recruiting-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s

volumes:
  recruiting-data:
