name: Integrate SM3 diagnostics once
on:
  push:
    branches: [feature/sm3-diagnostics-compatibility]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Add temporary branch integration workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate patch tool
        run: python3 -m py_compile tools/apply_sm3_diagnostics.py
      - name: Integrate diagnostics with existing client code
        run: |
          python3 tools/apply_sm3_diagnostics.py
          python3 tools/apply_sm3_diagnostics.py
          git diff --check
          grep -q 'Frontress_HandleMissingShaderModel3' src/game/client/tf/clientmode_tf.cpp
      - name: Commit isolated source edit to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/client/tf/clientmode_tf.cpp
          git diff --cached --quiet || (git commit -m 'Integrate SM3 diagnostics into TF client initialization' && git push)
