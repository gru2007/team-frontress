name: Build & publish (demo)

# This is the demo branch's workflow. It builds the same client as main and
# publishes it to one app only: Team Frontress Demo (5260620), for Steam Next
# Fest. It never touches the playtest, the main app or the dedicated Tool --
# a release/* tag on a demo commit runs this file and does nothing, because
# demo builds are published with demo/* tags.

on:
  push:
    tags:
      - "demo/*"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the previous build's caches and compile from cold"
        type: boolean
        default: false
      publish:
        description: "Upload the build to the demo app (5260620) after it succeeds"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not :latest. ccache hashes the compiler, so the day Valve rebuilds
  # the sniper SDK is the day every cached object becomes a miss. Bump this
  # deliberately; the tag list is at
  # registry.gitlab.steamos.cloud/v2/steamrt/sniper/sdk/tags/list.
  SNIPER_SDK_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768

jobs:
  # The demo's campaign runs in the menu page, not in the engine, so its rules
  # are tested here without building anything: every battlefield is a map the
  # bots can play, both sides fight the same maps, the war can be won.
  demo-ui:
    name: Demo UI / rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the page's modules parse
        run: |
          set -euo pipefail
          for f in $(find game/tc2/loose/resource/html/frontress/js -name '*.js') tools/frontress-demo-mock-game.mjs; do
            node --input-type=module --check < "$f"
          done

      - name: Campaign rules
        run: node --test tools/test-frontress-demo.mjs

      # The page talks to the game through a handful of names; a rename on
      # either side would leave the demo's menu unable to launch a battle.
      - name: Page and game agree on the contract
        run: |
          set -euo pipefail
          for name in frontress_demo_deploy frontress_demo_clear /v1/demo/state /v1/demo/battle getlanguage; do
            grep -rq -- "$name" game/tc2/loose/resource/html/frontress/js || { echo "::error::page does not use $name"; exit 1; }
            grep -rq -- "$name" src/game/client/tf/frontress/tf_frontress_demo.cpp src/game/shared/gamestate/gamestate.cpp \
              || { echo "::error::game does not provide $name"; exit 1; }
          done
          grep -q 'ui/frontress/index.html' src/game/client/tf/frontress/tf_frontress_demo.cpp
          test -f game/tc2/cfg/frontress_demo.cfg

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Linux lane, not two. The dedicated payload is cut out of the
          # client payload by copy_server.sh -- a packaging step over game_dist,
          # not a second compile -- so a separate dedicated job meant a second
          # full engine build, a second 1.4 GB SDK image pull and a second
          # writer competing for the same ccache, to produce files the client
          # lane already had on disk.
          - target: linux
            name: Game / Linux (client + dedicated)
            os: ubuntu-latest
          - target: windows
            name: Client / Windows
            os: windows-2025-vs2026

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      # To find and download the previous build's ccache artifact.
      actions: read
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # Bootstrap the restore script into a subdirectory of its own, because the
      # workspace root has to stay clear for the cached tree and its .git.
      #
      # Only the restore step below may use this copy. The repository checkout
      # that follows deletes the contents of the workspace whenever it does not
      # find a matching .git there -- which is exactly what happens on a cold or
      # a `fresh` run -- and .ci-bootstrap goes with them. Every step after that
      # checkout uses the script from the checked-out tree instead.
      - name: Checkout the CI scripts (Windows)
        if: matrix.target == 'windows'
        uses: actions/checkout@v6
        with:
          path: .ci-bootstrap
          sparse-checkout: |
            .github/scripts
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false

      # See .github/scripts/artifact-cache.sh for why this is not actions/cache.
      # Keeping .git means the checkout below rewrites only files changed since
      # the cached build instead of making every source newer than every object.
      - name: Restore the MSBuild workspace from the previous build
        if: ${{ matrix.target == 'windows' && github.event.inputs.fresh != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .ci-bootstrap/.github/scripts/artifact-cache.sh restore msbuild-windows-v2 .

      - name: Checkout repository (Windows)
        if: matrix.target == 'windows'
        uses: actions/checkout@v6
        with:
          clean: false
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      - name: Checkout repository (Linux)
        if: matrix.target == 'linux'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      - name: Free disk space
        if: matrix.target == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      # See .github/scripts/artifact-cache.sh for why this is not actions/cache.
      - name: Restore ccache from the previous build
        if: ${{ matrix.target == 'linux' && github.event.inputs.fresh != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/artifact-cache.sh restore ccache-linux "$CCACHE_DIR"

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          # This travels in the config file next to the cache rather than in
          # the environment, so it applies identically to a developer running
          # buildallprojects by hand. Sloppiness is not here -- buildallprojects
          # exports CCACHE_SLOPPINESS, and the environment beats the file.
          cat > "$CCACHE_DIR/ccache.conf" <<'CONF'
          # Bounded on purpose: this cache is uploaded and downloaded once per
          # run, so its size is build time. One full build's objects are well
          # under this; the headroom absorbs churn between releases.
          max_size = 1500M
          compression = true
          # zstd-1 costs a few percent of size for a much cheaper pack/unpack.
          compression_level = 1
          CONF
          ./src/buildallprojects

      - name: Package the Linux client
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          ./game_clean/copy.sh
          test -f game_dist/tc2/bin/linux64/client.so
          test -f game_dist/tc2/bin/linux64/server.so
          touch game_dist/STEAM_READY

      # Packaging only: copy_server.sh derives game_server_dist from the
      # game_dist the step above just produced.
      - name: Package the Linux dedicated server
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          PACK_TARBALL=1 ./game_clean/copy_server.sh
          # The payload runs as the game, not as the Tool it ships in, and the
          # two files that say which game have to agree -- whichever app this
          # build is for.
          test "$(tr -d '\r\n ' < game_server_dist/steam_appid.txt)" \
             = "$(sed -n 's/^appID=//p' game_server_dist/tc2/steam.inf | tr -d '\r')"
          test -f game_server_dist/tc2/bin/linux64/server.so
          test ! -f game_server_dist/tc2/bin/linux64/client.so
          test -s game_server_dist/VERSION
          test -s frontress-dedicated-linux.tar.gz
          touch game_server_dist/STEAM_READY

      # Ahead of the dist uploads: a failure there must not cost the next
      # release its cache. always(), because the objects a failed build did
      # produce are just as valid as the ones a successful build produced.
      - name: Pack ccache
        id: packccache
        if: ${{ always() && matrix.target == 'linux' }}
        continue-on-error: true
        run: bash .github/scripts/artifact-cache.sh pack ccache.tar "$CCACHE_DIR"

      - name: Upload ccache for the next build
        if: ${{ always() && matrix.target == 'linux' && steps.packccache.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-linux
          path: ccache.tar
          # The script already compressed it.
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Add MSBuild
        if: matrix.target == 'windows'
        uses: microsoft/setup-msbuild@v3

      - name: Prepare Windows project solution
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/src
        run: .\createallprojects.bat

      # VCPKG_ROOT lives beside the workspace, so the workspace archive does not
      # cover it, and without this every run re-clones vcpkg, re-bootstraps it
      # and rebuilds crow.
      - name: Restore vcpkg from the previous build
        id: vcpkg
        if: ${{ matrix.target == 'windows' && github.event.inputs.fresh != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/artifact-cache.sh restore vcpkg-windows "$(cd .. && pwd)/vcpkg"

      - name: Install Windows dependencies
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Set-Location ..
          if (-not (Test-Path vcpkg/.vcpkg-root)) {
            # A half-restored cache would make git refuse to clone into it.
            if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
            git clone --depth=1 https://github.com/microsoft/vcpkg.git
          }
          Set-Location vcpkg
          if (-not (Test-Path vcpkg.exe)) {
            .\bootstrap-vcpkg.bat
          }
          .\vcpkg integrate install
          .\vcpkg install crow

      # Only when it was not restored: the port set is fixed, so a warm vcpkg
      # is byte-identical to the one already stored. The long retention is what
      # keeps it warm without a re-upload every release.
      - name: Pack vcpkg
        id: packvcpkg
        if: ${{ matrix.target == 'windows' && steps.vcpkg.outputs.restored != '1' }}
        shell: bash
        continue-on-error: true
        run: bash .github/scripts/artifact-cache.sh pack vcpkg.tar "$(cd .. && pwd)/vcpkg" ./buildtrees ./packages

      - name: Upload vcpkg for the next build
        if: ${{ matrix.target == 'windows' && steps.packvcpkg.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-windows
          path: vcpkg.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn

      - name: Build Windows solution
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/src
        run: msbuild everything.sln /p:Platform="win64" /p:Configuration="Release"

      # success() and not always(), unlike ccache: this is a tree of build
      # state, not content-addressed entries. A tree left behind by a broken
      # build would be handed to every release after it.
      - name: Pack the MSBuild workspace
        id: packws
        if: ${{ success() && matrix.target == 'windows' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git gc --auto --quiet || true

          # Preserve .git and tracked files so the next checkout can retain
          # their mtimes. Exclude only generated payloads and temporary archives
          # -- .ci-bootstrap among them, since it is re-checked-out every run and
          # survives into this step only when the cache was already warm.
          bash .github/scripts/artifact-cache.sh pack workspace.tar . \
            ./workspace.tar ./vcpkg.tar ./.ci-bootstrap \
            ./game_dist ./game_dist_debug ./steam_build \
            './game/tc2/pak1*.vpk'

      - name: Upload the MSBuild workspace for the next build
        if: ${{ matrix.target == 'windows' && steps.packws.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          # v1 archives did not include .git and cannot warm an incremental build.
          name: msbuild-windows-v2
          path: workspace.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Package the Windows client
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./game/tc2/pak1*.vpk
          ./game_clean/copy.sh
          test -f game_dist/tc2/bin/x64/client.dll
          test -f game_dist/tc2/bin/x64/server.dll
          touch game_dist/STEAM_READY

      # compression-level 1 throughout: the payloads are already-compressed vpk
      # and stripped binaries, so the default level 6 buys almost nothing and
      # costs minutes on a multi-gigabyte dist.
      - name: Upload the Linux client
        if: ${{ always() && matrix.target == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-linux
          path: game_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload the Linux dedicated payload
        if: ${{ always() && matrix.target == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-dedicated-linux
          path: game_server_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload the dedicated tarball
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: frontress-dedicated-tarball
          path: |
            frontress-dedicated-linux.tar.gz
            frontress-dedicated-linux.tar.gz.sha256
          # Already gzip.
          compression-level: 0
          if-no-files-found: error

      - name: Upload the Windows client
        if: ${{ always() && matrix.target == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-windows
          path: game_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload client debug info
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-client-${{ matrix.target }}
          path: game_dist_debug
          compression-level: 1
          if-no-files-found: warn

      - name: Cleanup Linux game workspace
        if: ${{ always() && matrix.target == 'linux' }}
        continue-on-error: true
        run: |
          rm -rf game_dist game_dist_debug game_server_dist steam_build steam_build_server
          rm -f frontress-dedicated-linux.tar.gz frontress-dedicated-linux.tar.gz.sha256 ccache.tar
          git clean -xfd -- game src

  publish-demo:
    name: Steam / Demo (5260620)
    needs: [build, demo-ui]
    if: >-
      ${{ !cancelled() && needs.demo-ui.result == 'success' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/demo/')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: team-frontress-demo-steam-publish
      cancel-in-progress: false
    env:
      # The demo is its own app with its own depots: Windows = AppID + 1 and
      # Linux = AppID + 2 unless the repository variables say otherwise.
      STEAM_APPID: 5260620
      STEAM_DEPOT_WIN: ${{ vars.STEAM_DEMO_DEPOT_WIN }}
      STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEMO_DEPOT_LINUX }}
      STEAM_BRANCH: ${{ vars.STEAM_DEMO_BRANCH || 'prerelease' }}
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the clients
        uses: actions/download-artifact@v7
        with:
          pattern: "steam-client-*"
          path: publish-artifacts

      - name: Install SteamPipe prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip

      # Both platforms or neither: a demo that installs on one OS and not the
      # other is worse than yesterday's demo.
      - name: Stage the client content
        run: |
          set -euo pipefail
          WIN_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-windows"
          LINUX_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-linux"

          if [ ! -f "${WIN_DIR}/STEAM_READY" ] || [ ! -f "${LINUX_DIR}/STEAM_READY" ]; then
            echo "::error::Demo not published: both the Windows and the Linux client must build."
            exit 1
          fi

          rm -f "${WIN_DIR}/STEAM_READY" "${LINUX_DIR}/STEAM_READY"
          chmod +x "${LINUX_DIR}"/*.sh "${LINUX_DIR}/tc2_linux64" 2>/dev/null || true

          {
            echo "WIN_DIR=${WIN_DIR}"
            echo "LINUX_DIR=${LINUX_DIR}"
          } >> "${GITHUB_ENV}"

      # The content already says 5260620 on this branch; stamping again makes
      # sure of it, and the checks below prove the demo page is in the build.
      - name: Check the content is the demo
        run: |
          set -euo pipefail
          for DIR in "${WIN_DIR}" "${LINUX_DIR}"; do
            ./game_clean/retarget_appid.sh "${DIR}" "${STEAM_APPID}"
            test -f "${DIR}/tc2/loose/resource/html/frontress/index.html"
            test -f "${DIR}/tc2/cfg/frontress_demo.cfg"
            test ! -f "${DIR}/steam_appid.txt"
          done

      - name: Publish to the demo app
        run: |
          set -euo pipefail
          if [ "${STEAM_BRANCH}" = "none" ]; then STEAM_BRANCH=""; fi
          STEAM_WIN_DIR="${WIN_DIR}" \
          STEAM_LINUX_DIR="${LINUX_DIR}" \
            ./game_clean/steampipe.sh
