name: Build & publish

on:
  push:
    # branches:
    #  - "**"
    tags:
      - "release/*"
      - "private/*"
  # pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the previous build's caches and compile from cold"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not :latest. ccache hashes the compiler, so the day Valve rebuilds
  # the sniper SDK is the day every cached object becomes a miss. Bump this
  # deliberately; the tag list is at
  # registry.gitlab.steamos.cloud/v2/steamrt/sniper/sdk/tags/list.
  SNIPER_SDK_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768

jobs:
  # The coordinator is Go and builds in seconds. It runs first and on its own:
  # a game build should not wait for it, and a broken coordinator should not
  # stop a game release.
  coordinator:
    name: Coordinator / Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/coordinator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/coordinator/go.mod
          cache-dependency-path: services/coordinator/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=2 ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          # The agent ships with the coordinator: it is the half that runs next
          # to a game server, and a coordinator release without one is a
          # deployment where no match ever reports its result.
          for cmd in coordinator greyline-agent; do
            for target in linux/amd64 linux/arm64 windows/amd64; do
              os="${target%%/*}"
              arch="${target##*/}"
              out="dist/${cmd}-${os}-${arch}"
              [ "$os" = "windows" ] && out="${out}.exe"
              echo "building ${out}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w -X main.version=${version}" \
                -o "$out" "./cmd/${cmd}"
            done
          done
          cp coordinator.example.json theater.example.json README.md dist/

      - name: Upload coordinator
        uses: actions/upload-artifact@v7
        with:
          name: coordinator
          path: services/coordinator/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Linux lane, not two. The dedicated payload is cut out of the
          # client payload by copy_server.sh -- a packaging step over game_dist,
          # not a second compile -- so a separate dedicated job meant a second
          # full engine build, a second 1.4 GB SDK image pull and a second
          # writer competing for the same ccache, to produce files the client
          # lane already had on disk.
          - target: linux
            name: Game / Linux (client + dedicated)
            os: ubuntu-latest
          - target: windows
            name: Client / Windows
            os: windows-2025-vs2026

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      # To find and download the previous build's ccache artifact.
      actions: read
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # Windows keeps its incremental workspace cache. Do the sparse checkout
      # first so the cache action itself is available before the full checkout.
      - name: Checkout actions (Windows)
        if: matrix.target == 'windows'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false

      # See .github/scripts/artifact-cache.sh for why this is not actions/cache.
      - name: Restore the MSBuild workspace from the previous build
        if: ${{ matrix.target == 'windows' && github.event.inputs.fresh != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/artifact-cache.sh restore msbuild-windows .

      - name: Checkout repository (Windows)
        if: matrix.target == 'windows'
        uses: actions/checkout@v6
        with:
          clean: false
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      - name: Checkout repository (Linux)
        if: matrix.target == 'linux'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      # See .github/scripts/artifact-cache.sh for why this is not actions/cache.
      - name: Restore ccache from the previous build
        if: ${{ matrix.target == 'linux' && github.event.inputs.fresh != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/artifact-cache.sh restore ccache-linux "$CCACHE_DIR"

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          # This travels in the config file next to the cache rather than in
          # the environment, so it applies identically to a developer running
          # buildallprojects by hand. Sloppiness is not here -- buildallprojects
          # exports CCACHE_SLOPPINESS, and the environment beats the file.
          cat > "$CCACHE_DIR/ccache.conf" <<'CONF'
          # Bounded on purpose: this cache is uploaded and downloaded once per
          # run, so its size is build time. One full build's objects are well
          # under this; the headroom absorbs churn between releases.
          max_size = 1500M
          compression = true
          # zstd-1 costs a few percent of size for a much cheaper pack/unpack.
          compression_level = 1
          CONF
          ./src/buildallprojects

      - name: Package the Linux client
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          ./game_clean/copy.sh
          test -f game_dist/tc2/bin/linux64/client.so
          test -f game_dist/tc2/bin/linux64/server.so
          touch game_dist/STEAM_READY

      # Packaging only: copy_server.sh derives game_server_dist from the
      # game_dist the step above just produced.
      - name: Package the Linux dedicated server
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          PACK_TARBALL=1 ./game_clean/copy_server.sh
          # The payload runs as the game, not as the Tool it ships in, and the
          # two files that say which game have to agree -- whichever app this
          # build is for.
          test "$(tr -d '\r\n ' < game_server_dist/steam_appid.txt)" \
             = "$(sed -n 's/^appID=//p' game_server_dist/tc2/steam.inf | tr -d '\r')"
          test -f game_server_dist/tc2/bin/linux64/server.so
          test ! -f game_server_dist/tc2/bin/linux64/client.so
          test -s game_server_dist/VERSION
          test -s frontress-dedicated-linux.tar.gz
          touch game_server_dist/STEAM_READY

      # Ahead of the dist uploads: a failure there must not cost the next
      # release its cache. always(), because the objects a failed build did
      # produce are just as valid as the ones a successful build produced.
      - name: Pack ccache
        id: packccache
        if: ${{ always() && matrix.target == 'linux' }}
        continue-on-error: true
        run: bash .github/scripts/artifact-cache.sh pack ccache.tar "$CCACHE_DIR"

      - name: Upload ccache for the next build
        if: ${{ always() && matrix.target == 'linux' && steps.packccache.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-linux
          path: ccache.tar
          # The script already compressed it.
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Add MSBuild
        if: matrix.target == 'windows'
        uses: microsoft/setup-msbuild@v3

      - name: Prepare Windows project solution
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/src
        run: .\createallprojects.bat

      # VCPKG_ROOT lives beside the workspace, so the workspace archive does not
      # cover it, and without this every run re-clones vcpkg, re-bootstraps it
      # and rebuilds crow.
      - name: Restore vcpkg from the previous build
        id: vcpkg
        if: ${{ matrix.target == 'windows' && github.event.inputs.fresh != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/artifact-cache.sh restore vcpkg-windows "$(cd .. && pwd)/vcpkg"

      - name: Install Windows dependencies
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Set-Location ..
          if (-not (Test-Path vcpkg/.vcpkg-root)) {
            # A half-restored cache would make git refuse to clone into it.
            if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
            git clone --depth=1 https://github.com/microsoft/vcpkg.git
          }
          Set-Location vcpkg
          if (-not (Test-Path vcpkg.exe)) {
            .\bootstrap-vcpkg.bat
          }
          .\vcpkg integrate install
          .\vcpkg install crow

      # Only when it was not restored: the port set is fixed, so a warm vcpkg
      # is byte-identical to the one already stored. The long retention is what
      # keeps it warm without a re-upload every release.
      - name: Pack vcpkg
        id: packvcpkg
        if: ${{ matrix.target == 'windows' && steps.vcpkg.outputs.restored != '1' }}
        shell: bash
        continue-on-error: true
        run: bash .github/scripts/artifact-cache.sh pack vcpkg.tar "$(cd .. && pwd)/vcpkg" ./buildtrees ./packages

      - name: Upload vcpkg for the next build
        if: ${{ matrix.target == 'windows' && steps.packvcpkg.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-windows
          path: vcpkg.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn

      - name: Build Windows solution
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/src
        run: msbuild everything.sln /p:Platform="win64" /p:Configuration="Release"

      # success() and not always(), unlike ccache: this is a tree of build
      # state, not content-addressed entries. A tree left behind by a broken
      # build would be handed to every release after it.
      - name: Pack the MSBuild workspace
        id: packws
        if: ${{ success() && matrix.target == 'windows' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          # Everything checkout puts back on its own is left out, and so are the
          # two archives this job writes into the workspace.
          bash .github/scripts/artifact-cache.sh pack workspace.tar . \
            ./workspace.tar ./vcpkg.tar \
            ./.git ./.github ./.vscode ./game_clean \
            ./game_dist ./game_dist_debug ./steam_build \
            './game/tc2/pak1*.vpk' \
            ./.gitattributes ./.gitignore ./CONTRIBUTING ./LICENSE \
            ./README.md ./thirdpartylegalnotices.txt

      - name: Upload the MSBuild workspace for the next build
        if: ${{ matrix.target == 'windows' && steps.packws.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-windows
          path: workspace.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Package the Windows client
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./game/tc2/pak1*.vpk
          ./game_clean/copy.sh
          test -f game_dist/tc2/bin/x64/client.dll
          test -f game_dist/tc2/bin/x64/server.dll
          touch game_dist/STEAM_READY

      # compression-level 1 throughout: the payloads are already-compressed vpk
      # and stripped binaries, so the default level 6 buys almost nothing and
      # costs minutes on a multi-gigabyte dist.
      - name: Upload the Linux client
        if: ${{ always() && matrix.target == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-linux
          path: game_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload the Linux dedicated payload
        if: ${{ always() && matrix.target == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-dedicated-linux
          path: game_server_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload the dedicated tarball
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: frontress-dedicated-tarball
          path: |
            frontress-dedicated-linux.tar.gz
            frontress-dedicated-linux.tar.gz.sha256
          # Already gzip.
          compression-level: 0
          if-no-files-found: error

      - name: Upload the Windows client
        if: ${{ always() && matrix.target == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-windows
          path: game_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload client debug info
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-client-${{ matrix.target }}
          path: game_dist_debug
          compression-level: 1
          if-no-files-found: warn

      - name: Cleanup Linux game workspace
        if: ${{ always() && matrix.target == 'linux' }}
        continue-on-error: true
        run: |
          rm -rf game_dist game_dist_debug game_server_dist steam_build steam_build_server
          rm -f frontress-dedicated-linux.tar.gz frontress-dedicated-linux.tar.gz.sha256 ccache.tar
          git clean -xfd -- game src

  # The bridge is generated from the Steamworks SDK description already in this
  # repository and needs nothing but mingw-w64, so it is built on every run
  # rather than only on a release. It also carries the two checks a bridge
  # cannot be correct without: that both toolchains lay out every params struct
  # identically, and that the DLL exports everything the game imports.
  steam-bridge:
    name: Steam bridge / macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: brew install mingw-w64

      - name: Build the bridge
        run: ./tools/macos-port/steam-bridge/build.sh

      - name: Check that both toolchains agree on every struct
        run: ./tools/macos-port/steam-bridge/verify-layout.sh

      - name: Upload the bridge
        uses: actions/upload-artifact@v7
        with:
          name: steam-bridge-macos
          path: tools/macos-port/steam-bridge/dist
          if-no-files-found: error

  # The app bundle wraps the Windows client, so this waits on the Windows lane.
  # The Wine runtime, D9MT and Valve's macOS Steamworks library are binaries
  # this repository cannot carry: point the three variables below at them to
  # turn the lane on. Without them the job reports what is missing and finishes
  # green, because a macOS depot that cannot be built is not a reason to hold
  # up a Windows and Linux release.
  macos:
    name: Client / macOS
    needs: [build, steam-bridge]
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Wine and D9MT default to the builds tools/macos-port/fetch-runtimes.sh
      # names; set the variables only to pin something else.
      MACOS_WINE_URL: ${{ vars.MACOS_WINE_URL }}
      MACOS_D9MT_URL: ${{ vars.MACOS_D9MT_URL }}
      # No default is possible: the Steamworks SDK is under the Steamworks SDK
      # Access Agreement. The secret may hold either the SDK zip or the bare
      # macOS libsteam_api.dylib.
      STEAMWORKS_REDIST_URL: ${{ secrets.STEAMWORKS_REDIST_URL }}
      # Only a release tag carries a version; a branch name is not one.
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/release/') && github.ref_name || '' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the runtime inputs
        id: inputs
        run: |
          set -euo pipefail
          if [ -z "${STEAMWORKS_REDIST_URL}" ]; then
            echo "::warning::macOS depot skipped: the STEAMWORKS_REDIST_URL secret is not set."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      # Tolerated, not required: the Windows lane can fail while this job is
      # still allowed to start, and a missing client is reported below rather
      # than as an artifact-download failure.
      - name: Download the Windows client
        if: steps.inputs.outputs.ready == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: steam-client-windows
          path: publish-artifacts/steam-client-windows

      # One gate for the rest of the job: the runtimes are configured and a
      # Windows client actually arrived.
      - name: Decide whether the depot can be built
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ steps.inputs.outputs.ready }}" != "1" ]; then
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f publish-artifacts/steam-client-windows/tc2_win64.exe ]; then
            echo "::warning::macOS depot skipped: the Windows lane produced no client to wrap."
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Download the bridge
        if: steps.gate.outputs.ready == '1'
        uses: actions/download-artifact@v7
        with:
          name: steam-bridge-macos
          path: publish-artifacts/steam-bridge

      # For tools/macos-port/wine-compat: the PE half of D9MT's Metal unixlib is
      # rebuilt here against upstream Wine's ntdll, and that needs a cross
      # compiler the runner does not ship.
      - name: Install mingw-w64
        if: steps.gate.outputs.ready == '1'
        run: brew install mingw-w64

      - name: Fetch the Wine runtime, D9MT and the Steamworks library
        if: steps.gate.outputs.ready == '1'
        run: ./tools/macos-port/fetch-runtimes.sh runtime

      - name: Build the macOS depot
        if: steps.gate.outputs.ready == '1'
        run: |
          set -euo pipefail
          # The bridge came out of its own job; do not rebuild it here.
          STEAM_BRIDGE_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-bridge" \
          TC2_WINDOWS_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-windows" \
          WINE_RUNTIME_DIR="${GITHUB_WORKSPACE}/runtime/wine" \
          WINE_LICENSE_FILE="${GITHUB_WORKSPACE}/runtime/wine/COPYING.LIB" \
          D9MT_DIST_DIR="${GITHUB_WORKSPACE}/runtime/d9mt" \
          STEAMWORKS_REDIST_DYLIB="${GITHUB_WORKSPACE}/runtime/steam/libsteam_api.dylib" \
            ./tools/macos-port/build-depot.sh

      # The checks that cannot be made on a Linux runner and are not worth
      # finding out about from a player: the bundle is signed and sealed, its
      # executable is runnable, and nothing in it is a symlink SteamPipe would
      # deliver as something else.
      - name: Verify the app bundle
        if: steps.gate.outputs.ready == '1'
        run: |
          set -euo pipefail
          APP="game_dist_macos/Team Frontress.app"
          test -d "${APP}"
          test -x "${APP}/Contents/MacOS/team-frontress"
          codesign --verify --deep --strict "${APP}"
          links="$(find "${APP}" -type l | head -n 5)"
          if [ -n "${links}" ]; then
            echo "::error::the bundle still contains symlinks, which SteamPipe does not deliver:"
            echo "${links}"
            exit 1
          fi
          echo "wine:  $(file -b "${APP}/Contents/Resources/wine/bin/wine64" 2>/dev/null || file -b "${APP}/Contents/Resources/wine/bin/wine")"
          echo "d9mt:  $(file -b "${APP}/Contents/Resources/wine/lib/wine/x86_64-unix/d9mtmetal.so")"
          echo "steam: $(file -b "${APP}/Contents/Resources/steam/libsteam_api.dylib")"
          du -sh "${APP}"

      # A tar, not the directory itself: executable bits are not kept by an
      # artifact upload of loose files, and an .app that lost them does not
      # launch.
      - name: Pack the app bundle
        if: steps.gate.outputs.ready == '1'
        run: |
          set -euo pipefail
          tar -cf frontress-macos.tar -C game_dist_macos .
          ls -la frontress-macos.tar

      - name: Upload the macOS client
        if: steps.gate.outputs.ready == '1'
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-macos
          path: frontress-macos.tar
          compression-level: 1
          if-no-files-found: error

  publish-steam:
    name: Steam / default
    needs: [build, coordinator, macos]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: team-frontress-steam-publish
      cancel-in-progress: false
    env:
      STEAM_APPID: ${{ vars.STEAM_APPID }}
      STEAM_DEPOT_WIN: ${{ vars.STEAM_DEPOT_WIN }}
      STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
      STEAM_DEPOT_MAC: ${{ vars.STEAM_DEPOT_MAC || '5147523' }}
      # The same build also ships under the main app. Only the AppID it is
      # stamped and published with differs; retarget_appid.sh does the stamping.
      # Set STEAM_MAIN_APPID to 'none' to publish the playtest alone, and
      # STEAM_MAIN_BRANCH to 'none' to upload without setting anything live.
      STEAM_MAIN_APPID: ${{ vars.STEAM_MAIN_APPID || '5147380' }}
      STEAM_MAIN_DEPOT_WIN: ${{ vars.STEAM_MAIN_DEPOT_WIN || '5147381' }}
      STEAM_MAIN_DEPOT_LINUX: ${{ vars.STEAM_MAIN_DEPOT_LINUX || '5147382' }}
      STEAM_MAIN_DEPOT_MAC: ${{ vars.STEAM_MAIN_DEPOT_MAC || '5147383' }}
      STEAM_MAIN_BRANCH: ${{ vars.STEAM_MAIN_BRANCH || 'prerelease' }}
      # The dedicated server ships under its own Tool, unchanged by any of that.
      STEAM_DS_APPID: 5150320
      STEAM_DS_DEPOT_LINUX: 5150321
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Named, not everything. The unfiltered download also pulled the debug
      # symbols this job never opens and, now, the ccache tarball.
      - name: Download what gets published
        uses: actions/download-artifact@v7
        with:
          pattern: "{steam-client-*,steam-dedicated-*,coordinator}"
          path: publish-artifacts

      - name: Stage the coordinator next to the release
        run: |
          set -euo pipefail
          COORD_DIR="${GITHUB_WORKSPACE}/publish-artifacts/coordinator"
          if [ -d "${COORD_DIR}" ]; then
            echo "Coordinator build published with this release:"
            ls -la "${COORD_DIR}"
          else
            echo "::warning::No coordinator build in this release. Servers will need one built by hand."
          fi

      - name: Install SteamPipe prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip

      # Both apps are published from these same directories, so the checks, the
      # unpacking and the executable bits happen once, here, and each publish
      # step is then only a stamp and an upload.
      - name: Stage the client content
        run: |
          set -euo pipefail
          WIN_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-windows"
          LINUX_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-linux"
          MAC_TAR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-macos/frontress-macos.tar"
          MAC_DIR="${GITHUB_WORKSPACE}/publish-artifacts/macos"

          if [ ! -f "${WIN_DIR}/STEAM_READY" ] || [ ! -f "${LINUX_DIR}/STEAM_READY" ]; then
            echo "::warning::Client Steam publish skipped: both Windows and Linux must finish successfully before default is changed."
            echo "CLIENT_READY=0" >> "${GITHUB_ENV}"
            exit 0
          fi

          rm -f "${WIN_DIR}/STEAM_READY" "${LINUX_DIR}/STEAM_READY"
          chmod +x "${LINUX_DIR}"/*.sh "${LINUX_DIR}/tc2_linux64" "${LINUX_DIR}/srcds_run_64" 2>/dev/null || true

          # macOS is optional. It rides along when the lane produced a bundle
          # and is left at its previous content when it did not, rather than
          # holding up the two platforms that did build.
          MAC_ARGS=""
          if [ -f "${MAC_TAR}" ]; then
            mkdir -p "${MAC_DIR}"
            # -p to keep the executable bits the .app needs to launch.
            tar -xpf "${MAC_TAR}" -C "${MAC_DIR}"
            if [ -f "${MAC_DIR}/STEAM_READY" ]; then
              rm -f "${MAC_DIR}/STEAM_READY"
              MAC_ARGS="${MAC_DIR}"
              echo "Publishing the macOS depot ${STEAM_DEPOT_MAC} from ${MAC_DIR}"
            fi
          fi
          if [ -z "${MAC_ARGS}" ]; then
            echo "::warning::No macOS bundle in this release; depot ${STEAM_DEPOT_MAC} is left unchanged."
          fi

          {
            echo "CLIENT_READY=1"
            echo "WIN_DIR=${WIN_DIR}"
            echo "LINUX_DIR=${LINUX_DIR}"
            echo "MAC_CONTENT_DIR=${MAC_ARGS}"
          } >> "${GITHUB_ENV}"

      - name: Publish client depots to the playtest app
        if: env.CLIENT_READY == '1'
        env:
          STEAM_BRANCH: prerelease
        run: |
          set -euo pipefail
          # The content was packaged with the playtest AppID in it, so nothing
          # is stamped here; the main app is the one that needs retargeting.
          STEAM_WIN_DIR="${WIN_DIR}" \
          STEAM_LINUX_DIR="${LINUX_DIR}" \
          STEAM_MAC_DIR="${MAC_CONTENT_DIR:-}" \
            ./game_clean/steampipe.sh

      # The AppID is inside the content as well as in the build script -- in
      # steam.inf and in both gameinfo files -- so the same directories are
      # re-stamped for the main app and uploaded again. Windows and Linux are
      # plain directories and are stamped in place. The macOS bundle is signed
      # and cannot be, and does not have to be: its launcher stamps the copy it
      # stages out of the bundle with the AppID Steam launched it with, so one
      # bundle serves both apps.
      - name: Publish client depots to the main app
        if: env.CLIENT_READY == '1'
        run: |
          set -euo pipefail

          if [ -z "${STEAM_MAIN_APPID}" ] || [ "${STEAM_MAIN_APPID}" = "none" ]; then
            echo "::notice::STEAM_MAIN_APPID is not set; this release goes to the playtest app only."
            exit 0
          fi

          ./game_clean/retarget_appid.sh "${WIN_DIR}" "${STEAM_MAIN_APPID}"
          ./game_clean/retarget_appid.sh "${LINUX_DIR}" "${STEAM_MAIN_APPID}"

          MAC_ARGS="${MAC_CONTENT_DIR:-}"
          if [ -z "${STEAM_MAIN_DEPOT_MAC}" ] || [ "${STEAM_MAIN_DEPOT_MAC}" = "none" ]; then
            MAC_ARGS=""
            echo "::warning::No macOS depot configured for AppID ${STEAM_MAIN_APPID}; the bundle goes to the playtest only."
          fi

          BRANCH="${STEAM_MAIN_BRANCH}"
          if [ "${BRANCH}" = "none" ]; then
            BRANCH=""
          fi

          STEAM_APPID="${STEAM_MAIN_APPID}" \
          STEAM_DEPOT_WIN="${STEAM_MAIN_DEPOT_WIN}" \
          STEAM_DEPOT_LINUX="${STEAM_MAIN_DEPOT_LINUX}" \
          STEAM_DEPOT_MAC="${STEAM_MAIN_DEPOT_MAC}" \
          STEAM_BRANCH="${BRANCH}" \
          STEAM_WIN_DIR="${WIN_DIR}" \
          STEAM_LINUX_DIR="${LINUX_DIR}" \
          STEAM_MAC_DIR="${MAC_ARGS}" \
            ./game_clean/steampipe.sh

      - name: Publish Linux dedicated server to default
        env:
          STEAM_DS_BRANCH: prerelease
        run: |
          set -euo pipefail
          DS_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-dedicated-linux"

          if [ ! -f "${DS_DIR}/STEAM_READY" ]; then
            echo "::warning::Dedicated Steam publish skipped: the Linux dedicated lane did not finish successfully."
            exit 0
          fi

          if [ -z "${STEAM_DS_DEPOT_LINUX:-}" ]; then
            echo "STEAM_DS_DEPOT_LINUX repository variable is required to publish Tool AppID ${STEAM_DS_APPID}." >&2
            exit 1
          fi

          rm -f "${DS_DIR}/STEAM_READY"
          chmod +x "${DS_DIR}"/*.sh "${DS_DIR}/tc2_linux64" "${DS_DIR}/srcds_run_64" 2>/dev/null || true
          ./game_clean/steampipe_server.sh "${DS_DIR}"

  # The artifacts a server operator needs, on a release tag and nowhere else.
  # Steam ships the game; this ships the things that are not the game: the
  # dedicated payload the docker image is built from, the coordinator, and the
  # agent that reports match results from inside a container.
  release-artifacts:
    name: Release artifacts
    needs: [build, coordinator]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download what gets released
        uses: actions/download-artifact@v7
        with:
          pattern: "{frontress-*,coordinator}"
          path: artifacts

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          TARBALL="artifacts/frontress-dedicated-tarball/frontress-dedicated-linux.tar.gz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::No dedicated server tarball in this release; the docker image has nothing to build from."
            exit 1
          fi
          cp "${TARBALL}" "${TARBALL}.sha256" release/
          # The coordinator lane can fail without stopping a game release, so
          # its binaries are optional here rather than required.
          cp artifacts/coordinator/coordinator-* release/ 2>/dev/null || true
          cp artifacts/coordinator/greyline-agent-* release/ 2>/dev/null || true
          cp artifacts/coordinator/coordinator.example.json release/ 2>/dev/null || true
          ls -la release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
