name: Build & publish

on:
  push:
    # branches:
    #  - "**"
    tags:
      - "release/*"
      - "private/*"
  # pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the previous build's caches and compile from cold"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not :latest. ccache hashes the compiler, so the day Valve rebuilds
  # the sniper SDK is the day every cached object becomes a miss. Bump this
  # deliberately; the tag list is at
  # registry.gitlab.steamos.cloud/v2/steamrt/sniper/sdk/tags/list.
  SNIPER_SDK_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260805.254768

jobs:
  # The game coordinator is Go and builds in seconds. It runs first and on its
  # own: a game build should not wait for it, and a broken GC should not stop a
  # game release.
  coordinator:
    name: Game coordinator / Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/gc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/gc/go.mod
          cache-dependency-path: services/gc/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # The GC and the game must agree on every message. internal/gcpb is
      # generated from the game's own .proto files; regenerate it and fail if
      # anybody changed one side without the other.
      - name: Protocol matches the game
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          PATH="$(go env GOPATH)/bin:$PATH" ./proto/gen.sh
          # Git's POSIX regex does not interpret \t as a tab. Ignore only
          # the compiler version comment, which varies between installations.
          if ! git diff --exit-code -I '^//[[:space:]]*protoc[[:space:]]' -- internal/gcpb; then
            echo "::error::internal/gcpb is out of date with the game's .proto files; run services/gc/proto/gen.sh"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=2 ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%%/*}"
            arch="${target##*/}"
            out="dist/frontress-gc-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "building ${out}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/frontress-gc
          done
          cp gc.example.json theater.example.json README.md dist/

      - name: Upload game coordinator
        uses: actions/upload-artifact@v7
        with:
          name: coordinator
          path: services/gc/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Linux lane, not two. The dedicated payload is cut out of the
          # client payload by copy_server.sh -- a packaging step over game_dist,
          # not a second compile -- so a separate dedicated job meant a second
          # full engine build, a second 1.4 GB SDK image pull and a second
          # writer competing for the same ccache, to produce files the client
          # lane already had on disk.
          - target: linux
            name: Game / Linux (client + dedicated)
            os: ubuntu-latest
          - target: windows
            name: Client / Windows
            os: windows-2025-vs2026

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      # To find and download the previous build's ccache artifact.
      actions: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # Bootstrap the restore script into a subdirectory of its own, because the
      # workspace root has to stay clear for the cached tree and its .git.
      #
      # Only the restore step below may use this copy. The repository checkout
      # that follows deletes the contents of the workspace whenever it does not
      # find a matching .git there -- which is exactly what happens on a cold or
      # a `fresh` run -- and .ci-bootstrap goes with them. Every step after that
      # checkout uses the script from the checked-out tree instead.
      - name: Checkout the CI scripts (Windows)
        if: matrix.target == 'windows'
        uses: actions/checkout@v6
        with:
          path: .ci-bootstrap
          sparse-checkout: |
            .github/scripts
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout repository (Windows)
        if: matrix.target == 'windows'
        uses: actions/checkout@v6
        with:
          clean: false
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      - name: Checkout repository (Linux)
        if: matrix.target == 'linux'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      # Easy Anti-Cheat. The EOS SDK is Epic's licensed software and never in
      # this public repository: it is staged from a private location when the
      # secrets are set (tools/eac/README.md). A release must be protected;
      # vars.EAC_REQUIRED=false is the escape hatch.
      - name: Stage the EOS SDK (Easy Anti-Cheat)
        id: eac
        shell: bash
        env:
          EOS_SDK_URL: ${{ secrets.EOS_SDK_URL }}
          EOS_SDK_TOKEN: ${{ secrets.EOS_SDK_TOKEN }}
          EOS_SDK_SHA256: ${{ vars.EOS_SDK_SHA256 }}
          FRONTRESS_EOS_PRODUCT_ID: ${{ vars.EOS_PRODUCT_ID || 'a626b6da0c3747dcb4481023976760d6' }}
          FRONTRESS_EOS_SANDBOX_ID: ${{ vars.EOS_SANDBOX_ID }}
          FRONTRESS_EOS_DEPLOYMENT_ID: ${{ vars.EOS_DEPLOYMENT_ID }}
          FRONTRESS_EOS_CLIENT_ID: ${{ vars.EOS_CLIENT_ID }}
          FRONTRESS_EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
          EAC_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/release/') && vars.EAC_REQUIRED != 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${EOS_SDK_URL}" ]; then
            if [ "${EAC_REQUIRED}" = "true" ]; then
              echo "::error::A release must ship with Easy Anti-Cheat: set the EOS_SDK_URL secret (or vars.EAC_REQUIRED=false)."
              exit 1
            fi
            echo "::warning::EOS_SDK_URL is not set: this build has no Easy Anti-Cheat, and protected servers will refuse it."
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash tools/eac/stage_eos_sdk.sh
          echo "enabled=1" >> "$GITHUB_OUTPUT"
          # Read by buildallprojects (Linux) and createallprojects.bat (Windows).
          echo "VPC_EXTRA_ARGS=/define:FRONTRESS_EAC" >> "$GITHUB_ENV"
          echo "VPC_NINJA_EXTRA_SUFFIX=eac_" >> "$GITHUB_ENV"

      - name: Free disk space
        if: matrix.target == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          # This travels in the config file next to the cache rather than in
          # the environment, so it applies identically to a developer running
          # buildallprojects by hand. Sloppiness is not here -- buildallprojects
          # exports CCACHE_SLOPPINESS, and the environment beats the file.
          mkdir -p "$CCACHE_DIR"
          cat > "$CCACHE_DIR/ccache.conf" <<'CONF'
          # Bounded on purpose: this cache is uploaded and downloaded once per
          # run, so its size is build time. One full build's objects are well
          # under this; the headroom absorbs churn between releases.
          max_size = 1500M
          compression = true
          # zstd-1 costs a few percent of size for a much cheaper pack/unpack.
          compression_level = 1
          CONF
          ./src/buildallprojects

      - name: Package the Linux client
        if: matrix.target == 'linux'
        env:
          # dlpak.sh falls back to the GitHub API when a release link fails.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./game_clean/copy.sh
          test -f game_dist/tc2/bin/linux64/client.so
          test -f game_dist/tc2/bin/linux64/server.so
          touch game_dist/STEAM_READY

      # Bootstrapper, EasyAntiCheat/, EOS runtime, and the integrity catalog
      # signed with the product key. The key lives only in secrets and a
      # temporary folder; tools/eac/package_eac.py verifies the result.
      - name: Protect the Linux client with Easy Anti-Cheat
        if: matrix.target == 'linux' && steps.eac.outputs.enabled == '1'
        shell: bash
        env:
          FRONTRESS_EOS_PRODUCT_ID: ${{ vars.EOS_PRODUCT_ID || 'a626b6da0c3747dcb4481023976760d6' }}
          FRONTRESS_EOS_SANDBOX_ID: ${{ vars.EOS_SANDBOX_ID }}
          FRONTRESS_EOS_DEPLOYMENT_ID: ${{ vars.EOS_DEPLOYMENT_ID }}
          EAC_INTEGRITY_PRIVATE_KEY_B64: ${{ secrets.EAC_INTEGRITY_PRIVATE_KEY_B64 }}
          EAC_INTEGRITY_PUBLIC_CERT_B64: ${{ secrets.EAC_INTEGRITY_PUBLIC_CERT_B64 }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python)"
          "$PY" tools/eac/package_eac.py --dist game_dist --platform linux
          test -f game_dist/EasyAntiCheat/Certificates/base.bin
          test -f game_dist/start_protected_game

      # Packaging only: copy_server.sh derives game_server_dist from the
      # game_dist the step above just produced.
      - name: Package the Linux dedicated server
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          PACK_TARBALL=1 ./game_clean/copy_server.sh
          # The payload runs as the game, not as the Tool it ships in, and the
          # two files that say which game have to agree -- whichever app this
          # build is for.
          test "$(tr -d '\r\n ' < game_server_dist/steam_appid.txt)" \
             = "$(sed -n 's/^appID=//p' game_server_dist/tc2/steam.inf | tr -d '\r')"
          test -f game_server_dist/tc2/bin/linux64/server.so
          test ! -f game_server_dist/tc2/bin/linux64/client.so
          if [ "${{ steps.eac.outputs.enabled }}" = "1" ]; then
            test -f game_server_dist/bin/linux64/libEOSSDK-Linux-Shipping.so
            test ! -e game_server_dist/EasyAntiCheat
          fi
          test -s game_server_dist/VERSION
          test -s frontress-dedicated-linux.tar.gz
          touch game_server_dist/STEAM_READY

      # Ahead of the dist uploads: a failure there must not cost the next
      # release its cache. always(), because the objects a failed build did
      # produce are just as valid as the ones a successful build produced.
      - name: Pack ccache
        id: packccache
        if: ${{ always() && matrix.target == 'linux' }}
        continue-on-error: true
        run: bash .github/scripts/artifact-cache.sh pack ccache.tar "$CCACHE_DIR"

      - name: Upload ccache for the next build
        if: ${{ always() && matrix.target == 'linux' && steps.packccache.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-linux
          path: ccache.tar
          # The script already compressed it.
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Add MSBuild
        if: matrix.target == 'windows'
        uses: microsoft/setup-msbuild@v3

      - name: Prepare Windows project solution
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/src
        run: .\createallprojects.bat

      - name: Build Windows solution
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/src
        run: msbuild everything.sln /p:Platform="win64" /p:Configuration="Release"

      # success() and not always(), unlike ccache: this is a tree of build
      # state, not content-addressed entries. A tree left behind by a broken
      # build would be handed to every release after it.
      - name: Pack the MSBuild workspace
        id: packws
        if: ${{ success() && matrix.target == 'windows' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git gc --auto --quiet || true

          # Preserve .git and tracked files so the next checkout can retain
          # their mtimes. Exclude only generated payloads and temporary archives
          # -- .ci-bootstrap among them, since it is re-checked-out every run and
          # survives into this step only when the cache was already warm.
          bash .github/scripts/artifact-cache.sh pack workspace.tar . \
            ./workspace.tar ./.ci-bootstrap ./src/thirdparty/eos_sdk \
            ./game_dist ./game_dist_debug ./steam_build \
            './game/tc2/pak1*.vpk'

      - name: Upload the MSBuild workspace for the next build
        if: ${{ matrix.target == 'windows' && steps.packws.outputs.packed == '1' }}
        uses: actions/upload-artifact@v7
        with:
          # v1 archives did not include .git and cannot warm an incremental build.
          name: msbuild-windows-v2
          path: workspace.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Package the Windows client
        if: matrix.target == 'windows'
        shell: bash
        env:
          # dlpak.sh falls back to the GitHub API when a release link fails.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f ./game/tc2/pak1*.vpk
          ./game_clean/copy.sh
          test -f game_dist/tc2/bin/x64/client.dll
          test -f game_dist/tc2/bin/x64/server.dll
          # Our copies of TF2's unsigned libraries (see PreloadOwnLibraries).
          for lib in SDL2 libxml2-2 libharfbuzz-0 libfreetype-6 libfontconfig-1 dxvk_d3d9; do
            test -f "game_dist/bin/x64/${lib}.dll"
          done
          touch game_dist/STEAM_READY

      # Bootstrapper, EasyAntiCheat/, EOS runtime, and the integrity catalog
      # signed with the product key. The key lives only in secrets and a
      # temporary folder; tools/eac/package_eac.py verifies the result.
      - name: Protect the Windows client with Easy Anti-Cheat
        if: matrix.target == 'windows' && steps.eac.outputs.enabled == '1'
        shell: bash
        env:
          FRONTRESS_EOS_PRODUCT_ID: ${{ vars.EOS_PRODUCT_ID || 'a626b6da0c3747dcb4481023976760d6' }}
          FRONTRESS_EOS_SANDBOX_ID: ${{ vars.EOS_SANDBOX_ID }}
          FRONTRESS_EOS_DEPLOYMENT_ID: ${{ vars.EOS_DEPLOYMENT_ID }}
          EAC_INTEGRITY_PRIVATE_KEY_B64: ${{ secrets.EAC_INTEGRITY_PRIVATE_KEY_B64 }}
          EAC_INTEGRITY_PUBLIC_CERT_B64: ${{ secrets.EAC_INTEGRITY_PUBLIC_CERT_B64 }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python)"
          "$PY" tools/eac/package_eac.py --dist game_dist --platform win
          test -f game_dist/EasyAntiCheat/Certificates/base.bin
          test -f game_dist/start_protected_game.exe

      # compression-level 1 throughout: the payloads are already-compressed vpk
      # and stripped binaries, so the default level 6 buys almost nothing and
      # costs minutes on a multi-gigabyte dist.
      - name: Upload the Linux client
        if: ${{ always() && matrix.target == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-linux
          path: game_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload the Linux dedicated payload
        if: ${{ always() && matrix.target == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-dedicated-linux
          path: game_server_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload the dedicated tarball
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: frontress-dedicated-tarball
          path: |
            frontress-dedicated-linux.tar.gz
            frontress-dedicated-linux.tar.gz.sha256
          # Already gzip.
          compression-level: 0
          if-no-files-found: error

      - name: Upload the Windows client
        if: ${{ always() && matrix.target == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-client-windows
          path: game_dist
          compression-level: 1
          if-no-files-found: warn

      - name: Upload client debug info
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-client-${{ matrix.target }}
          path: game_dist_debug
          compression-level: 1
          if-no-files-found: warn

      - name: Cleanup Linux game workspace
        if: ${{ always() && matrix.target == 'linux' }}
        continue-on-error: true
        run: |
          rm -rf game_dist game_dist_debug game_server_dist steam_build steam_build_server src/thirdparty/eos_sdk
          rm -f frontress-dedicated-linux.tar.gz frontress-dedicated-linux.tar.gz.sha256 ccache.tar
          git clean -xfd -- game src

  publish-steam:
    name: Steam / Playtest + main + dedicated
    needs: [build, coordinator]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: team-frontress-steam-publish
      cancel-in-progress: false
    env:
      STEAM_APPID: ${{ vars.STEAM_APPID || '5147520' }}
      STEAM_DEPOT_WIN: ${{ vars.STEAM_DEPOT_WIN }}
      STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
      STEAM_BRANCH: ${{ vars.STEAM_BRANCH || 'prerelease' }}
      STEAM_MAIN_APPID: ${{ vars.STEAM_MAIN_APPID || '5147380' }}
      # Empty depot overrides use the target AppID + 1/+2 in steampipe.sh.
      STEAM_MAIN_DEPOT_WIN: ${{ vars.STEAM_MAIN_DEPOT_WIN }}
      STEAM_MAIN_DEPOT_LINUX: ${{ vars.STEAM_MAIN_DEPOT_LINUX }}
      STEAM_MAIN_BRANCH: ${{ vars.STEAM_MAIN_BRANCH || 'prerelease' }}
      # The dedicated server ships under its own Tool and keeps Playtest identity.
      STEAM_DS_APPID: 5150320
      STEAM_DS_DEPOT_LINUX: 5150321
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Named, not everything. The unfiltered download also pulled the debug
      # symbols this job never opens and, now, the ccache tarball.
      - name: Download what gets published
        uses: actions/download-artifact@v7
        with:
          pattern: "{steam-client-windows,steam-client-linux,steam-dedicated-*,coordinator}"
          path: publish-artifacts

      - name: Stage the coordinator next to the release
        run: |
          set -euo pipefail
          COORD_DIR="${GITHUB_WORKSPACE}/publish-artifacts/coordinator"
          if [ -d "${COORD_DIR}" ]; then
            echo "Coordinator build published with this release:"
            ls -la "${COORD_DIR}"
          else
            echo "::warning::No coordinator build in this release. Servers will need one built by hand."
          fi

      - name: Install SteamPipe prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip

      # Both apps are published from these same directories, so readiness checks
      # and executable permissions are handled once, here. Each publish step is
      # then only a stamp and an upload.
      - name: Stage the client content
        run: |
          set -euo pipefail
          WIN_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-windows"
          LINUX_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-client-linux"

          if [ ! -f "${WIN_DIR}/STEAM_READY" ] || [ ! -f "${LINUX_DIR}/STEAM_READY" ]; then
            echo "::warning::Client Steam publish skipped: both Windows and Linux must finish successfully before either app is published."
            echo "CLIENT_READY=0" >> "${GITHUB_ENV}"
            exit 0
          fi

          rm -f "${WIN_DIR}/STEAM_READY" "${LINUX_DIR}/STEAM_READY"
          chmod +x "${LINUX_DIR}"/*.sh "${LINUX_DIR}/tc2_linux64" "${LINUX_DIR}/srcds_run_64" "${LINUX_DIR}/start_protected_game" 2>/dev/null || true

          {
            echo "CLIENT_READY=1"
            echo "WIN_DIR=${WIN_DIR}"
            echo "LINUX_DIR=${LINUX_DIR}"
          } >> "${GITHUB_ENV}"

      - name: Publish client depots to the playtest app
        if: env.CLIENT_READY == '1'
        run: |
          set -euo pipefail
          # Normally a no-op; keep content consistent with repository overrides.
          ./game_clean/retarget_appid.sh "${WIN_DIR}" "${STEAM_APPID}"
          ./game_clean/retarget_appid.sh "${LINUX_DIR}" "${STEAM_APPID}"
          if [ "${STEAM_BRANCH}" = "none" ]; then STEAM_BRANCH=""; fi
          STEAM_WIN_DIR="${WIN_DIR}" \
          STEAM_LINUX_DIR="${LINUX_DIR}" \
            ./game_clean/steampipe.sh

      - name: Publish client depots to the main app
        if: env.CLIENT_READY == '1' && env.STEAM_MAIN_APPID != 'none'
        run: |
          set -euo pipefail
          # Only mutate the downloaded clients, after the Playtest upload succeeds.
          ./game_clean/retarget_appid.sh "${WIN_DIR}" "${STEAM_MAIN_APPID}"
          ./game_clean/retarget_appid.sh "${LINUX_DIR}" "${STEAM_MAIN_APPID}"
          if [ "${STEAM_MAIN_BRANCH}" = "none" ]; then STEAM_MAIN_BRANCH=""; fi
          STEAM_APPID="${STEAM_MAIN_APPID}" \
          STEAM_DEPOT_WIN="${STEAM_MAIN_DEPOT_WIN}" \
          STEAM_DEPOT_LINUX="${STEAM_MAIN_DEPOT_LINUX}" \
          STEAM_BRANCH="${STEAM_MAIN_BRANCH}" \
          STEAM_WIN_DIR="${WIN_DIR}" \
          STEAM_LINUX_DIR="${LINUX_DIR}" \
            ./game_clean/steampipe.sh

      - name: Publish Linux dedicated server to prerelease
        env:
          STEAM_DS_BRANCH: prerelease
        run: |
          set -euo pipefail
          DS_DIR="${GITHUB_WORKSPACE}/publish-artifacts/steam-dedicated-linux"

          if [ ! -f "${DS_DIR}/STEAM_READY" ]; then
            echo "::warning::Dedicated Steam publish skipped: the Linux dedicated lane did not finish successfully."
            exit 0
          fi

          if [ -z "${STEAM_DS_DEPOT_LINUX:-}" ]; then
            echo "STEAM_DS_DEPOT_LINUX repository variable is required to publish Tool AppID ${STEAM_DS_APPID}." >&2
            exit 1
          fi

          rm -f "${DS_DIR}/STEAM_READY"
          chmod +x "${DS_DIR}"/*.sh "${DS_DIR}/tc2_linux64" "${DS_DIR}/srcds_run_64" 2>/dev/null || true
          ./game_clean/steampipe_server.sh "${DS_DIR}"

  # The artifacts a server operator needs, on a release tag and nowhere else.
  # Steam ships the game; this ships the things that are not the game: the
  # dedicated payload the docker image is built from, the coordinator, and the
  # agent that reports match results from inside a container.
  release-artifacts:
    name: Release artifacts
    needs: [build, coordinator]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download what gets released
        uses: actions/download-artifact@v7
        with:
          pattern: "{frontress-*,coordinator}"
          path: artifacts

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          TARBALL="artifacts/frontress-dedicated-tarball/frontress-dedicated-linux.tar.gz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::No dedicated server tarball in this release; the docker image has nothing to build from."
            exit 1
          fi
          cp "${TARBALL}" "${TARBALL}.sha256" release/
          # The coordinator lane can fail without stopping a game release, so
          # its binaries are optional here rather than required.
          cp artifacts/coordinator/frontress-gc-* release/ 2>/dev/null || true
          cp artifacts/coordinator/gc.example.json release/ 2>/dev/null || true
          ls -la release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
