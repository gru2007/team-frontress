name: Build - Greyline

# The coordinator, and the schema both halves share.
#
# This runs in a couple of minutes, unlike the game build, so it is the job that
# should catch a broken protocol before anyone waits on a full compile.

on:
  push:
    branches:
      - "*"
      - "release/*"
    paths:
      - "services/**"
      - ".github/workflows/build_greyline.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/build_greyline.yml"
  workflow_dispatch:

jobs:
  coordinator:
    name: Coordinator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/coordinator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/coordinator/go.mod
          cache-dependency-path: services/coordinator/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '/pb/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=2 ./...

      - name: Build
        run: |
          go build -o bin/coordinator ./cmd/coordinator
          go build -o bin/greyline-agent ./cmd/greyline-agent

      # A config that will not load is a broken release, and it costs seconds to
      # find out here rather than on a server. The war log is the world, so each
      # smoke run gets a fresh one.
      - name: Smoke test the shipped configs
        run: |
          set -euo pipefail
          export GREYLINE_GC_SECRET=ci-smoke-test-secret
          export GREYLINE_POOL_KEY=ci-smoke-test-pool-key
          export GREYLINE_STATE_PATH="$(mktemp -d)/players.json"

          echo "--- defaults with the shipped theater"
          GREYLINE_WAR_LOG="$(mktemp -d)/war.jsonl" GREYLINE_LISTEN=127.0.0.1:0 \
            timeout 5s ./bin/coordinator -theater theater.industrial.json > out.log 2>&1 || true
          grep -q "api listening" out.log || { cat out.log; exit 1; }
          grep -q "war loaded" out.log || { cat out.log; exit 1; }

          echo "--- gc.test.json"
          GREYLINE_WAR_LOG="$(mktemp -d)/war.jsonl" GREYLINE_LISTEN=127.0.0.1:0 \
            timeout 5s ./bin/coordinator -config gc.test.json > out.log 2>&1 || true
          grep -q "api listening" out.log || { cat out.log; exit 1; }

          echo "--- a war must survive a restart"
          LOG="$(mktemp -d)/war.jsonl"
          for run in 1 2; do
            GREYLINE_WAR_LOG="$LOG" GREYLINE_LISTEN=127.0.0.1:0 \
              timeout 5s ./bin/coordinator -config gc.test.json > out.log 2>&1 || true
            grep -q "war loaded" out.log || { cat out.log; exit 1; }
          done
          # The second run replayed the first one's log rather than starting a
          # new campaign, which is the whole point of the log being the world.
          grep -q '"kind":"campaign_started"' "$LOG"
          test "$(grep -c '"kind":"campaign_started"' "$LOG")" = "1"

      - name: Archive coordinator and agent
        uses: actions/upload-artifact@v7
        with:
          name: greyline-coordinator-linux
          path: |
            services/coordinator/bin/coordinator
            services/coordinator/bin/greyline-agent

  schema:
    name: Shared schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_TOKEN || github.token }}

      # The game compiles greyline.proto with the protoc bundled in the tree —
      # 2.6.1, not whatever a runner happens to have installed. Running that
      # exact version here catches a schema the game cannot build without paying
      # for a full game build to find out.
      #
      # Use the linux32 binary, the same one the VPC rule invokes. It is the
      # statically linked build; the linux64 one in the tree is dynamically
      # linked against a libprotoc.so.9 that is not shipped, so it cannot run at
      # all. That costs an i386 runtime on the runner.
      - name: Compile the schema with the tree's protoc 2.6.1
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386

          PROTOC=src/thirdparty/protobuf-2.6.1/bin/linux32/protoc
          chmod +x "$PROTOC"
          "$PROTOC" --version

          mkdir -p /tmp/greyline_pb
          "$PROTOC" \
            --proto_path=src/thirdparty/protobuf-2.6.1/src \
            --proto_path=services/coordinator/proto \
            --cpp_out=/tmp/greyline_pb \
            services/coordinator/proto/greyline.proto

          test -s /tmp/greyline_pb/greyline.pb.cc
          test -s /tmp/greyline_pb/greyline.pb.h
          echo "schema builds for the game side"
