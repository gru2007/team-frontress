name: One-shot Valve inventory cache repair

on:
  push:
    branches:
      - fix/valve-inventory-socache
    paths:
      - .github/workflows/inventory-cache-hotfix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply reviewed source fix and verify invariants
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_inventory_cache_fix.py
          python3 tools/apply_inventory_cache_fix.py
          python3 tools/apply_inventory_cache_fix.py --verify
          git diff --check
      - name: Commit patched C++ files and remove one-shot tooling
        run: |
          set -euo pipefail
          rm tools/apply_inventory_cache_fix.py .github/workflows/inventory-cache-hotfix.yml
          git add -A
          git diff --cached --check
          git config user.name "Team Frontress inventory fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Valve inventory bootstrap and isolate matchmaking SO cache"
          git push origin HEAD:refs/heads/fix/valve-inventory-socache
