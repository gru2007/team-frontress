name: macOS client (developers)

# The macOS client runs on the team's private development engine, which is
# kept in a private repository. It is built here because public repositories
# get free macOS runners. Nothing from the engine may become public, so:
#   - the engine is checked out with a read-only token (SOURCE_ENGINE_TOKEN);
#   - build output stays in files on the runner; the public job log only shows
#     each step's result (ci_quiet.sh);
#   - logs and the depot leave the runner only encrypted (FRONTRESS_CI_KEY);
#   - no caches: workflows from forked pull requests can restore them;
#   - never runs for pull requests or in forks;
#   - the depot only goes live on a password-protected Steam branch.
# Setup and decrypting logs: scripts/frontress/CI.md in the engine repository.

on:
  push:
    tags:
      - "release/*"
      - "private/*"
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "Engine branch, tag or commit"
        default: "frontress"
      d9mt_ref:
        description: "D9MT native macOS branch, tag or commit"
        default: "native-macos"
      publish:
        description: "Upload to the private macOS Steam branch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_REPO: ${{ vars.ENGINE_REPO || 'gru2007/source-engine' }}
  D9MT_REPO: ${{ vars.D9MT_REPO || 'gru2007/d9mt-tf2-source' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build macOS client
    if: github.repository == 'gru2007/team-frontress'
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 180
    env:
      FRONTRESS_CI_KEY: ${{ secrets.FRONTRESS_CI_KEY }}
    steps:
      - name: Check secrets
        env:
          HAS_ENGINE_TOKEN: ${{ secrets.SOURCE_ENGINE_TOKEN != '' }}
        run: |
          missing=0
          [ "$HAS_ENGINE_TOKEN" = true ] || { echo "::error::SOURCE_ENGINE_TOKEN is not set (read access to $ENGINE_REPO)"; missing=1; }
          [ -n "$FRONTRESS_CI_KEY" ] || { echo "::error::FRONTRESS_CI_KEY is not set (encrypts logs and the depot)"; missing=1; }
          exit $missing

      - name: Checkout game
        uses: actions/checkout@v6
        with:
          path: game
          submodules: recursive
          persist-credentials: false

      - name: Checkout engine (private)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ inputs.engine_ref || vars.ENGINE_REF || 'frontress' }}
          token: ${{ secrets.SOURCE_ENGINE_TOKEN }}
          path: engine
          submodules: recursive
          persist-credentials: false

      - name: Checkout D9MT (native macOS)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.D9MT_REPO }}
          ref: ${{ inputs.d9mt_ref || vars.D9MT_REF || 'native-macos' }}
          token: ${{ secrets.D9MT_TOKEN || secrets.SOURCE_ENGINE_TOKEN }}
          path: d9mt
          submodules: recursive
          persist-credentials: false

      - name: Prepare
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ] || { echo "::error::Native Metal requires an Apple Silicon runner; configure MACOS_RUNS_ON."; exit 1; }
          {
            echo "ENGINE=$GITHUB_WORKSPACE/engine"
            echo "GAME=$GITHUB_WORKSPACE/game"
            echo "D9MT=$GITHUB_WORKSPACE/d9mt"
            echo "FRONTRESS_REQUIRE_METAL=1"
            echo "FRONTRESS_LOG_DIR=$RUNNER_TEMP/logs"
            echo "JOBS=$(sysctl -n hw.ncpu)"
          } >> "$GITHUB_ENV"
          brew install --quiet ninja sdl2 sdl3 glslang freetype fontconfig libpng jpeg-turbo > /dev/null

      # Easy Anti-Cheat, as in build.yml: the EOS SDK comes from a private
      # location when the secrets are set. FRONTRESS_EAC=1 then switches the
      # game build (buildallprojects_osx) and the depot (package_macos.sh).
      - name: Stage the EOS SDK (Easy Anti-Cheat)
        env:
          EOS_SDK_URL: ${{ secrets.EOS_SDK_URL }}
          EOS_SDK_TOKEN: ${{ secrets.EOS_SDK_TOKEN }}
          EOS_SDK_SHA256: ${{ vars.EOS_SDK_SHA256 }}
          FRONTRESS_EOS_PRODUCT_ID: ${{ vars.EOS_PRODUCT_ID || 'a626b6da0c3747dcb4481023976760d6' }}
          FRONTRESS_EOS_SANDBOX_ID: ${{ vars.EOS_SANDBOX_ID }}
          FRONTRESS_EOS_DEPLOYMENT_ID: ${{ vars.EOS_DEPLOYMENT_ID }}
          FRONTRESS_EOS_CLIENT_ID: ${{ vars.EOS_CLIENT_ID }}
          FRONTRESS_EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${EOS_SDK_URL}" ]; then
            echo "::warning::EOS_SDK_URL is not set: this macOS build has no Easy Anti-Cheat, and protected servers will refuse it."
            exit 0
          fi
          bash "$GAME/tools/eac/stage_eos_sdk.sh" > /dev/null
          echo "FRONTRESS_EAC=1" >> "$GITHUB_ENV"

      - name: Build engine
        run: '"$ENGINE/scripts/frontress/ci_quiet.sh" engine "$ENGINE/scripts/frontress/build.sh" release "$GAME"'

      - name: Publish engine into the game tree
        run: '"$ENGINE/scripts/frontress/ci_quiet.sh" publish "$ENGINE/scripts/frontress/publish.sh" "$GAME"'

      - name: Test VTF header compatibility (no game launch)
        run: '"$ENGINE/scripts/frontress/ci_quiet.sh" vtf-tests python3 "$ENGINE/scripts/frontress/test_vtf_headers.py"'

      - name: Build game
        run: '"$ENGINE/scripts/frontress/ci_quiet.sh" game "$GAME/src/buildallprojects_osx" release'

      - name: Package depot
        env:
          FRONTRESS_EOS_PRODUCT_ID: ${{ vars.EOS_PRODUCT_ID || 'a626b6da0c3747dcb4481023976760d6' }}
          FRONTRESS_EOS_SANDBOX_ID: ${{ vars.EOS_SANDBOX_ID }}
          FRONTRESS_EOS_DEPLOYMENT_ID: ${{ vars.EOS_DEPLOYMENT_ID }}
          EAC_INTEGRITY_PRIVATE_KEY_B64: ${{ secrets.EAC_INTEGRITY_PRIVATE_KEY_B64 }}
          EAC_INTEGRITY_PUBLIC_CERT_B64: ${{ secrets.EAC_INTEGRITY_PUBLIC_CERT_B64 }}
        run: |
          set -euo pipefail
          "$ENGINE/scripts/frontress/ci_quiet.sh" package \
            "$ENGINE/scripts/frontress/package_macos.sh" "$GAME" "$RUNNER_TEMP/depot-macos"
          {
            echo "### macOS depot"
            echo '```'
            cat "$RUNNER_TEMP/depot-macos/VERSION_MACOS"
            du -sh "$RUNNER_TEMP/depot-macos" | cut -f1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Public artifacts can be downloaded by anyone, so they carry ciphertext only.
      # A tarball also keeps the executable bits that artifacts drop.
      - name: Encrypt depot
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/depot-macos" -czf "$RUNNER_TEMP/depot.tar.gz" .
          "$ENGINE/scripts/frontress/ci_crypt.sh" enc "$RUNNER_TEMP/depot.tar.gz" "$RUNNER_TEMP/frontress-macos.tar.gz.enc"
          rm -f "$RUNNER_TEMP/depot.tar.gz"

      - name: Upload encrypted depot
        uses: actions/upload-artifact@v7
        with:
          name: frontress-macos-encrypted
          path: ${{ runner.temp }}/frontress-macos.tar.gz.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Encrypt logs
        if: always()
        run: |
          set -euo pipefail
          [ -d "${FRONTRESS_LOG_DIR:-}" ] || exit 0
          [ -n "$FRONTRESS_CI_KEY" ] || exit 0
          tar -C "$FRONTRESS_LOG_DIR" -czf "$RUNNER_TEMP/logs.tar.gz" .
          "$ENGINE/scripts/frontress/ci_crypt.sh" enc "$RUNNER_TEMP/logs.tar.gz" "$RUNNER_TEMP/frontress-macos-logs.tar.gz.enc"

      - name: Upload encrypted logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontress-macos-logs
          path: ${{ runner.temp }}/frontress-macos-logs.tar.gz.enc
          retention-days: 7
          if-no-files-found: ignore

      # The runner is discarded anyway; a self-hosted one is not.
      - name: Remove engine files
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/engine" "$GITHUB_WORKSPACE/d9mt" "$GITHUB_WORKSPACE/game/src/thirdparty/eos_sdk" "$RUNNER_TEMP/depot-macos" "$RUNNER_TEMP/logs.tar.gz" "${FRONTRESS_LOG_DIR:-/nonexistent}"

  publish-steam:
    name: Steam / private macOS branch
    needs: build
    if: >-
      github.repository == 'gru2007/team-frontress' &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One steamcmd session per account at a time, shared with build.yml.
    concurrency:
      group: team-frontress-steam-publish
      cancel-in-progress: false
    env:
      FRONTRESS_CI_KEY: ${{ secrets.FRONTRESS_CI_KEY }}
      STEAM_APPID: ${{ vars.STEAM_APPID || '5147520' }}
      STEAM_DEPOT_MAC: ${{ vars.STEAM_DEPOT_MAC }}
      STEAM_BRANCH: ${{ vars.STEAM_MAC_BRANCH || 'macos-dev' }}
      STEAM_MAC_MAIN_APPID: ${{ vars.STEAM_MAC_MAIN_APPID || 'none' }}
      STEAM_MAC_MAIN_DEPOT: ${{ vars.STEAM_MAC_MAIN_DEPOT }}
      STEAM_MAC_MAIN_BRANCH: ${{ vars.STEAM_MAC_MAIN_BRANCH || 'macos-dev' }}
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
      BUILD_DESC: macOS ${{ github.ref_name }} (${{ github.sha }})
    steps:
      - name: Checkout engine scripts
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ inputs.engine_ref || vars.ENGINE_REF || 'frontress' }}
          token: ${{ secrets.SOURCE_ENGINE_TOKEN }}
          path: engine
          sparse-checkout: scripts/frontress
          persist-credentials: false

      - name: Checkout packaging scripts
        uses: actions/checkout@v6
        with:
          path: game
          sparse-checkout: game_clean
          persist-credentials: false

      - name: Download encrypted depot
        uses: actions/download-artifact@v7
        with:
          name: frontress-macos-encrypted
          path: ${{ runner.temp }}

      - name: Decrypt depot
        run: |
          set -euo pipefail
          engine/scripts/frontress/ci_crypt.sh dec "$RUNNER_TEMP/frontress-macos.tar.gz.enc" "$RUNNER_TEMP/depot.tar.gz"
          mkdir -p "$RUNNER_TEMP/depot-macos"
          tar -C "$RUNNER_TEMP/depot-macos" -xzf "$RUNNER_TEMP/depot.tar.gz"
          rm -f "$RUNNER_TEMP/depot.tar.gz"
          test -x "$RUNNER_TEMP/depot-macos/tc2_osx"

      - name: Upload to the playtest app
        run: engine/scripts/frontress/steampipe_macos.sh "$RUNNER_TEMP/depot-macos"

      - name: Upload to the main app
        if: env.STEAM_MAC_MAIN_APPID != 'none'
        run: |
          set -euo pipefail
          # The AppID is baked into gameinfo.txt and steam.inf; stamp it for the main app.
          game/game_clean/retarget_appid.sh "$RUNNER_TEMP/depot-macos" "$STEAM_MAC_MAIN_APPID"
          STEAM_APPID="$STEAM_MAC_MAIN_APPID" \
          STEAM_DEPOT_MAC="$STEAM_MAC_MAIN_DEPOT" \
          STEAM_BRANCH="$STEAM_MAC_MAIN_BRANCH" \
            engine/scripts/frontress/steampipe_macos.sh "$RUNNER_TEMP/depot-macos"
