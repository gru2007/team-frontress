name: Remove obsolete SM3 bypass comment once
on:
  push:
    branches: [feature/sm3-diagnostics-compatibility]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time removal of outdated bypass comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Correct misleading SM3 guard comment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/game/client/tf/clientmode_tf.cpp')
          source = path.read_text(encoding='utf-8')
          old = '\t\t// SM3 shaders remain mandatory. Only allow an explicit diagnostic bypass\n\t\t// when the adapter itself reports DX 9.0c+ but the engine rejects it.\n'
          new = '\t\t// SM3 is required by the world and model shaders; show GPU diagnostics and exit.\n'
          if source.count(old) != 1:
              raise SystemExit('Refusing edit: original comment missing or ambiguous')
          path.write_text(source.replace(old, new, 1), encoding='utf-8', newline='')
          PY
          git diff --check
          grep -q 'show GPU diagnostics and exit' src/game/client/tf/clientmode_tf.cpp
      - name: Commit guard comment fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/client/tf/clientmode_tf.cpp
          git commit -m 'Remove obsolete SM3 continuation comment'
          git push
