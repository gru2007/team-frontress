<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Frontress -- Campaign</title>
<!--
  The campaign map on the main menu.

  Two views of one page, picked by ?view= :
     card  - the block in the menu's information column. A picture, no controls;
             the VGUI card above it turns any click into "open the theater".
     full  - the theater, where a node can be picked and the war read properly.

  It draws whatever GET /v1/campaign says, and asks the game for things by
  POSTing one line to /v1/campaign/command. Both are served by the game's own
  local server (see src/game/shared/gamestate/gamestate.cpp), so the page has no
  network access of its own and nothing here needs a build step.

  Demo is the default until the live theater is connected. ?demo=0 explicitly
  opts into the game feed. Both views use the same wall-clock demo timeline.
-->
<style>
@font-face {
	font-family: "TF2";
	src: url("./fonts/TF2.woff2") format("woff2");
	font-display: swap;
}
@font-face {
	font-family: "TF2 Secondary";
	src: url("./fonts/TF2Secondary.woff2") format("woff2");
	font-display: swap;
}
@font-face {
	font-family: "TF2 Build";
	src: url("./fonts/TF2Build.woff2") format("woff2");
	font-display: swap;
}

:root {
	--red: #c23b2c;
	--red-bright: #f4705a;
	--red-deep: #6e1c14;
	--blu: #4a7fa8;
	--blu-bright: #7cc0ec;
	--blu-deep: #17384f;
	--tan: #ded3bb;
	--tan-dim: #9a8f79;
	--ink: #0d0b0a;
	--paper: #171310;
	--paper-2: #221c17;
	--gold: #e8b563;
	--live: #ffd07a;

	/* Everything scales off the panel, because the panel is 300 units wide in
	   the menu column and most of the screen in the theater. */
	--u: min(0.92vw, 1.72vh);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: var(--ink);
	color: var(--tan);
	font-family: "TF2 Secondary", "Trebuchet MS", system-ui, sans-serif;
	-webkit-font-smoothing: antialiased;
	cursor: default;
	user-select: none;
}

body.view-card { --u: clamp(10px, 2vw, 16px); }

/* ------------------------------------------------------------------ shell */
#shell {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	background:
		radial-gradient(120% 90% at 50% 0%, #2a211a 0%, #151110 55%, #0b0908 100%);
}

body.view-full #shell {
	border: 1px solid #4a3c30;
	box-shadow: 0 0 0 1px #0a0806 inset, 0 2vh 6vh rgba(0,0,0,.7);
}

/* ------------------------------------------------------------------ header */
#header {
	display: none;
	align-items: baseline;
	gap: calc(var(--u) * 1.2);
	padding: calc(var(--u) * .9) calc(var(--u) * 1.5);
	border-bottom: 1px solid #3a2f26;
	background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
	flex: none;
}
body.view-full #header { display: flex; }

#title {
	font-family: "TF2", "TF2 Secondary", sans-serif;
	font-size: calc(var(--u) * 1.9);
	letter-spacing: .06em;
	color: var(--tan);
	text-transform: uppercase;
	text-shadow: 0 .2vh 0 #000;
}
#subtitle {
	font-size: calc(var(--u) * .95);
	color: var(--tan-dim);
	letter-spacing: .08em;
	text-transform: uppercase;
}
#headerStats {
	margin-left: auto;
	display: flex;
	gap: calc(var(--u) * 1.6);
	align-items: baseline;
	/* the theater's close button is a VGUI control sitting above this page, so
	   the top-right corner has to stay clear of anything clickable */
	padding-right: calc(var(--u) * 2);
}
.stat { text-align: right; }
.stat b {
	display: block;
	font-family: "TF2 Build", "TF2", monospace;
	font-size: calc(var(--u) * 1.5);
	color: var(--tan);
	line-height: 1;
}
.stat span {
	font-size: calc(var(--u) * .8);
	color: var(--tan-dim);
	letter-spacing: .1em;
	text-transform: uppercase;
}
.stat.off b { color: #8a3b30; }

/* ------------------------------------------------------------------- body */
#body { flex: 1; display: flex; min-height: 0; }

#mapWrap {
	position: relative;
	flex: 1;
	min-width: 0;
	overflow: hidden;
}

/* the field of influence is painted small into this and then blown up inside
   the map, so territory and the nodes that cause it can never drift apart */
#terrain { display: none; }

#map { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------------------------------------------------------------- sidebar */
#side {
	display: none;
	width: 27%;
	min-width: 15vw;
	max-width: 34vw;
	flex-direction: column;
	gap: calc(var(--u) * .7);
	padding: calc(var(--u) * .9);
	border-left: 1px solid #3a2f26;
	background: linear-gradient(180deg, rgba(12,9,8,.92), rgba(12,9,8,.75));
	overflow: hidden;
}
body.view-full #side { display: flex; }

.panel {
	background: rgba(0,0,0,.35);
	border: 1px solid #382c23;
	border-radius: calc(var(--u) * .25);
	padding: calc(var(--u) * .7) calc(var(--u) * .85);
	min-height: 0;
}
.panel h2 {
	font-family: "TF2", sans-serif;
	font-size: calc(var(--u) * 1.05);
	letter-spacing: .12em;
	color: var(--gold);
	text-transform: uppercase;
	margin-bottom: calc(var(--u) * .42);
	display: flex;
	align-items: center;
	gap: calc(var(--u) * .5);
}
.panel h2:after {
	content: "";
	flex: 1;
	height: 1px;
	background: linear-gradient(90deg, #4a3c30, transparent);
}

#selName {
	font-family: "TF2", sans-serif;
	font-size: calc(var(--u) * 1.6);
	line-height: 1.1;
	text-transform: uppercase;
}
#selOwner {
	font-size: calc(var(--u) * .85);
	letter-spacing: .12em;
	text-transform: uppercase;
	margin-bottom: calc(var(--u) * .6);
}
.owner-RED { color: var(--red-bright); }
.owner-BLU { color: var(--blu-bright); }
.owner-NEUTRAL { color: var(--tan-dim); }

.row {
	display: flex;
	justify-content: space-between;
	gap: calc(var(--u) * .6);
	font-size: calc(var(--u) * .92);
	padding: calc(var(--u) * .18) 0;
	border-bottom: 1px dotted #332a22;
}
.row:last-child { border-bottom: 0; }
.row span {
	color: var(--tan-dim);
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.row b { font-weight: normal; color: var(--tan); font-family: "TF2 Build", monospace; }

.stages { display: flex; gap: calc(var(--u) * .3); margin: calc(var(--u) * .5) 0; }
.pip {
	flex: 1;
	height: calc(var(--u) * .45);
	background: #2b231d;
	border: 1px solid #453629;
}
.pip.done { background: var(--gold); border-color: var(--gold); }
.pip.live { background: var(--live); border-color: #fff0c4; animation: pulse 1.6s infinite; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

#deploy {
	margin-top: calc(var(--u) * .8);
	display: block;
	flex: none;
	width: 100%;
	padding: calc(var(--u) * .75) 0;
	font-family: "TF2", sans-serif;
	font-size: calc(var(--u) * 1.15);
	letter-spacing: .1em;
	text-transform: uppercase;
	color: #1a1310;
	background: linear-gradient(180deg, #f0c070, #c9873a);
	border: 1px solid #7d5324;
	border-radius: calc(var(--u) * .2);
	cursor: pointer;
	text-shadow: 0 1px 0 rgba(255,255,255,.35);
}
#deploy:hover { background: linear-gradient(180deg, #ffdc9a, #dc9a45); }
#deploy:disabled { opacity: .4; cursor: default; background: #4a4038; color: #a89988; }
#deploy.here { background: linear-gradient(180deg, #9fd07a, #5d9740); border-color: #3f6b2b; }

#sideScroll {
	flex: 1 1 auto;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: calc(var(--u) * .7);
	overflow-y: auto;
	overflow-x: hidden;
}
#sideScroll::-webkit-scrollbar { width: calc(var(--u) * .3); }
#sideScroll::-webkit-scrollbar-thumb { background: #4a3c30; }
#sideScroll > .panel { flex: 0 0 auto; }
.list { overflow: hidden; }
.list > div { overflow: hidden; min-height: 0; }
.more { font-size: calc(var(--u) * .8); color: var(--tan-dim); padding-top: calc(var(--u) * .2); }
.item {
	display: flex;
	align-items: center;
	gap: calc(var(--u) * .55);
	padding: calc(var(--u) * .26) 0;
	font-size: calc(var(--u) * .92);
	border-bottom: 1px dotted #332a22;
}
.item:last-child { border-bottom: 0; }
.item .dot {
	width: calc(var(--u) * .55);
	height: calc(var(--u) * .55);
	border-radius: 50%;
	flex: none;
}
.item .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .num { font-family: "TF2 Build", monospace; color: var(--tan); }
.item .sub { color: var(--tan-dim); font-size: calc(var(--u) * .8); }

.bar {
	position: relative;
	height: calc(var(--u) * .5);
	background: #241d18;
	border: 1px solid #3d3128;
	overflow: hidden;
}
.bar > i {
	position: absolute;
	inset: 0 auto 0 0;
	display: block;
	background: linear-gradient(90deg, #7a9c4d, #b9d97a);
}
.bar.hot > i { background: linear-gradient(90deg, #b8642c, #f0a95a); }

/* ------------------------------------------------------------------ footer */
#footer {
	flex: none;
	display: flex;
	align-items: center;
	gap: calc(var(--u) * .8);
	padding: calc(var(--u) * .5) calc(var(--u) * 1.2);
	border-top: 1px solid #3a2f26;
	background: rgba(0,0,0,.5);
	font-size: calc(var(--u) * .85);
	color: var(--tan-dim);
	letter-spacing: .06em;
	text-transform: uppercase;
	white-space: nowrap;
	overflow: hidden;
}
.key { display: flex; align-items: center; gap: calc(var(--u) * .35); }
.key i {
	width: calc(var(--u) * .8);
	height: calc(var(--u) * .8);
	display: block;
	border: 1px solid rgba(0,0,0,.5);
}
#hint { margin-left: auto; color: var(--gold); }

/* card view: a strip along the bottom instead of a sidebar */
#cardBar {
	display: none;
	flex: none;
	flex-direction: column;
	gap: calc(var(--u) * .25);
	padding: calc(var(--u) * .5) calc(var(--u) * .7) calc(var(--u) * .6);
	background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.75) 40%);
	border-top: 1px solid #34291f;
}
body.view-card #cardBar { display: flex; }
body.view-card #footer { display: none; }

#cardFront {
	display: flex;
	align-items: baseline;
	gap: calc(var(--u) * .4);
	font-size: calc(var(--u) * .95);
	white-space: nowrap;
	overflow: hidden;
}
#cardFront b { font-family: "TF2", sans-serif; letter-spacing: .04em; }
#cardMeta {
	display: flex;
	justify-content: space-between;
	font-size: calc(var(--u) * .8);
	color: var(--tan-dim);
	letter-spacing: .06em;
	text-transform: uppercase;
}
#cardOpen { color: var(--gold); }

/* ------------------------------------------------------------------ badges */
#demoBadge {
	position: absolute;
	top: calc(var(--u) * .6);
	left: calc(var(--u) * .6);
	padding: calc(var(--u) * .15) calc(var(--u) * .5);
	font-size: calc(var(--u) * .72);
	letter-spacing: .16em;
	text-transform: uppercase;
	color: #ffd9a0;
	background: rgba(120, 60, 20, .55);
	border: 1px solid #9a5c25;
	border-radius: calc(var(--u) * .15);
	z-index: 5;
}
#demoBadge.hidden { display: none; }

#offline {
	position: absolute;
	inset: 0;
	display: none;
	align-items: center;
	justify-content: center;
	text-align: center;
	padding: calc(var(--u) * 2);
	font-size: calc(var(--u) * 1);
	color: var(--tan-dim);
	letter-spacing: .08em;
	text-transform: uppercase;
	background: rgba(10,8,7,.8);
	z-index: 6;
}
body.offline #offline { display: flex; }

/* --------------------------------------------------------------- map bits */
.nodeHit { cursor: pointer; }
body.view-card .nodeHit { cursor: default; }
.label {
	font-family: "TF2 Secondary", sans-serif;
	paint-order: stroke;
	stroke: rgba(0,0,0,.85);
	stroke-width: 3px;
	stroke-linejoin: round;
}
.labelName { font-size: 13px; letter-spacing: .04em; }
.labelSub  { font-size: 10px; fill: #b9ad94; letter-spacing: .08em; }
.frontLine { animation: march 2.6s linear infinite; }
body.demo .frontLine { animation: none; }
@keyframes march { to { stroke-dashoffset: -26; } }
.spark { animation: spark 3.2s ease-in-out infinite; }
@keyframes spark { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.breathe { animation: breathe 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { 0%,100% { opacity: .18; transform: scale(1); } 50% { opacity: .5; transform: scale(1.35); } }

/* The overview is deliberately not a scaled-down operations screen. */
body.view-card #cardBar { padding: 7px 12px; gap: 4px; }
body.view-card #cardFront { font-size: clamp(11px, 2vw, 15px); }
body.view-card #cardMeta { font-size: clamp(10px, 1.7vw, 12px); gap: 12px; }
#cardFront span { overflow: hidden; text-overflow: ellipsis; }
#cardOpen { flex: none; text-decoration: none; }
#cardOpen:hover { color: #fff0cb; }
body.view-card #demoBadge { font-size: 10px; top: 10px; left: 12px; }
body.view-card .labelName { font-size: 22px; }
body.view-card .labelSub { display: none; }
.label { pointer-events: none; }
.nodeHit:focus { outline: none; }
.nodeHit:hover .nodeFace, .nodeHit:focus .nodeFace { stroke: #ffe9b8; }
.selection { visibility: hidden; }
.nodeHit.selected .selection { visibility: visible; }
.nodeHit:focus .selection { visibility: visible; }
.supplyFlow { animation: supplyFlow 4s linear infinite; }
@keyframes supplyFlow { to { stroke-dashoffset: -80; } }
#briefing {
	position: absolute; bottom: 16px; left: 20px; right: 20px;
	pointer-events: none; padding: 12px 16px;
	background: linear-gradient(90deg, rgba(17,13,10,.94), rgba(17,13,10,.55));
	border-left: 3px solid var(--gold);
}
#briefingTitle { font-family: "TF2", sans-serif; font-size: 18px; color: var(--gold); }
#briefingText { font-size: 13px; color: var(--tan-dim); margin-top: 5px; line-height: 1.4; }
#captureNotice {
	position: absolute; top: 18px; right: 20px; max-width: 65%;
	padding: 10px 14px; border: 1px solid currentColor; background: #151310ed;
	font-family: "TF2 Secondary", sans-serif; font-size: 16px;
	pointer-events: none; opacity: 0; text-align: right;
}
body.view-card #captureNotice { top: 10px; right: 12px; font-size: 11px; padding: 5px 8px; max-width: 56%; }
#demoTrack { height: 2px; background: #453526; margin-top: 10px; }
#demoTrack i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
body.view-card #briefing { display: none; }
body:not(.demo) #briefing { display: none; }
body.demo #queuePanel { display: none; }
body.view-full { --u: clamp(11px, min(.92vw, 1.72vh), 18px); }
body.view-full #side { width: 29%; min-width: 260px; max-width: 380px; }
body.view-full #header { padding: 18px 22px; }
body.view-full .labelName { font-size: 17px; letter-spacing: 0; }
body.view-full .labelSub { font-size: 12px; }
#demoControls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
#pauseDemo, #closeMap {
	font: inherit; color: var(--tan); border: 1px solid #594737;
	background: #2b221b; padding: 7px 10px; cursor: pointer; white-space: nowrap;
}
#pauseDemo:hover, #closeMap:hover { border-color: var(--gold); color: var(--gold); }
#pauseDemo:focus-visible, #closeMap:focus-visible, #deploy:focus-visible, #cardOpen:focus-visible {
	outline: 2px solid var(--gold); outline-offset: 3px;
}
body:not(.demo) #pauseDemo { display: none; }
body.paused .frontLine, body.paused .spark, body.paused .breathe,
body.paused .supplyFlow, body.paused .pip { animation-play-state: paused; }
@media (max-width: 720px) {
	body.view-full #header { padding: 12px; flex-wrap: wrap; gap: 10px; }
	body.view-full #headerStats { display: none; }
	body.view-full #body { flex-direction: column; }
	body.view-full #mapWrap { flex: 1 1 52%; min-height: 210px; }
	body.view-full #side { width: 100%; min-width: 0; max-width: none; flex: 1 1 48%; min-height: 0; border-left: 0; border-top: 1px solid #3a2f26; }
	body.view-full #footer { flex-wrap: wrap; font-size: 10px; gap: 8px; padding: 8px 12px; }
	#hint { display: none; }
	#briefing { bottom: 8px; left: 10px; right: 10px; padding: 7px 10px; }
	#briefingTitle { font-size: 14px; }
	#briefingText { display: none; }
	body.view-full .labelName { visibility: hidden; }
	body.view-full .labelName.labelHQ, body.view-full .labelName.selected { visibility: visible; font-size: 28px; }
	body.view-full .labelSub, body.view-full .playerTag { display: none; }
}
@media (prefers-reduced-motion: reduce) {
	.frontLine, .spark, .breathe, .supplyFlow, .pip.live { animation: none; }
}
</style>
</head>
<body>

<div id="shell">
	<div id="header">
		<div>
			<div id="title">The Frontline</div>
			<div id="subtitle">Campaign</div>
		</div>
		<div id="headerStats"></div>
		<div id="demoControls">
			<button id="pauseDemo" type="button" aria-pressed="false"></button>
			<button id="closeMap" type="button" data-t="closeMap">Close</button>
		</div>
	</div>

	<div id="body">
		<div id="mapWrap">
			<canvas id="terrain" width="220" height="140"></canvas>
			<svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice"></svg>
			<div id="demoBadge" class="hidden">Demo</div>
			<div id="captureNotice"></div>
			<div id="briefing">
				<div id="briefingTitle"></div>
				<div id="briefingText"></div>
				<div id="demoTrack"><i></i></div>
			</div>
			<div id="offline"></div>
		</div>

		<div id="side">
			<div id="sideScroll">
			<div class="panel" id="selPanel">
				<h2 data-t="node">Node</h2>
				<div id="selName">--</div>
				<div id="selOwner">--</div>
				<div id="selBody"></div>
			</div>

			<div class="panel list" id="battlePanel">
				<h2 data-t="battles">Live battles</h2>
				<div id="battles"></div>
			</div>

			<div class="panel list" id="serverPanel">
				<h2 data-t="servers">Servers</h2>
				<div id="regions"></div>
				<div id="servers"></div>
			</div>

			<div class="panel" id="queuePanel">
				<h2 data-t="queueTitle">Matchmaking</h2>
				<div id="queueBody"></div>
			</div>
			</div>

			<button id="deploy" data-t="deploy" disabled>Deploy here</button>
		</div>
	</div>

	<div id="cardBar">
		<div id="cardFront"></div>
		<div id="cardMeta">
			<span id="cardPop"></span>
			<a id="cardOpen" href="?view=full" data-t="openMap">Open the map</a>
		</div>
	</div>

	<div id="footer">
		<div class="key"><i style="background:#c23b2c"></i><span>RED</span></div>
		<div class="key"><i style="background:#4a7fa8"></i><span>BLU</span></div>
		<div class="key"><i style="background:#e8b563"></i><span data-t="front">Front</span></div>
		<div class="key"><i style="background:#6b6255"></i><span data-t="supply">Supply line</span></div>
		<div id="hint" data-t="hint">Click a node to pick where you deploy</div>
	</div>
</div>

<script>
"use strict";

//---------------------------------------------------------------- the words
var STRINGS = {
	en: {
		node: "Node", battles: "Live battles", servers: "Servers",
		deploy: "Deploy here", deployed: "Deploying here", front: "Front",
		supply: "Supply line", hint: "Click a node to pick where you deploy",
		openMap: "Open the map", online: "Online", matches: "Matches",
		free: "Servers free", onDemand: "On demand", owner: "Held by",
		garrison: "Fighting here", stage: "Stage", map: "Map", kind: "Operation",
		attacking: "%a% attacking %n%", quiet: "The line is quiet",
		noCampaign: "No campaign is running", waiting: "Waiting for the game...",
		coordinatorDown: "Coordinator unavailable", neutral: "Nobody",
		empty: "Nothing here yet", idle: "Idle", region: "Region",
		queueSearching: "In queue", queueReady: "Server ready",
		queueConnecting: "Connecting", queueInMatch: "In a match",
		queueIdle: "Not queued", hq: "Headquarters", players: "players",
		breakthrough: "Breakthrough", assault: "Assault", advance: "Advance",
		skirmish: "Skirmish", capture: "Capture",
		selectPrompt: "Pick a node", queueTitle: "Matchmaking", type: "Type",
		k_command: "Headquarters", k_rail: "Railhead", k_industrial: "Industry",
		k_supply: "Depot", k_water: "Waterworks", k_mining: "Quarry site",
		waiting2: "%h% waiting, %n% more needed", regions: "By region",
		population: "Population", closeMap: "Close", pause: "Pause", resume: "Resume",
		demo: "Demo / simulation", demoSelect: "Mark this sector", demoSelected: "Sector marked",
		demoHint: "Select a sector to inspect the operation", demoPopulation: "8 sectors / 2 operations",
		demoName: "The Iron Frontier", demoNote: "Scripted simulation. No matchmaking or live player data.",
		phase0: "01 / Mobilization", phase1: "02 / Taking the foundry",

function mapX( n ) { return PAD_X + n.x * ( VB_W - PAD_X * 2 ); }

//------------------------------------------------------------ the front line
//
// Territory is not drawn from a list of shapes -- there is no such list. Every
// node pulls the ground around it towards its own side, and the line where the
// two pulls cancel out is the front. The map is then right by construction:
// take a node and the line moves, with no second description of the war to
// keep in step.
//
function field( px, py ) {
	var sum = 0, weightSum = 0;

	for ( var i = 0; i < data.nodes.length; i++ ) {
		var n = data.nodes[i];
		if ( n.owner !== "RED" && n.owner !== "BLU" ) continue;

		var dx = ( px - mapX( n ) ) / VB_W;
		var dy = ( py - mapY( n ) ) / VB_W;
		var d2 = dx * dx + dy * dy + 0.0035;

		// A headquarters holds more ground than an outpost, and a node with a
		// battle on it is being pushed hard enough to bend the line.
		var w = ( n.hq ? 1.9 : 1.0 ) + Math.min( n.players || 0, 32 ) / 40;
		var pull = w / d2;

		sum += ( n.owner === "RED" ? pull : -pull );
		weightSum += pull;
	}

	return { value: sum, density: weightSum };
}

function paintTerrain() {
	var w = 160;
	var h = Math.max( 60, Math.round( w * VB_H / VB_W ) );

	terrain.width = w;
	terrain.height = h;

	var img = tctx.createImageData( w, h );
	var px = img.data;

	for ( var yi = 0; yi < h; yi++ ) {
		for ( var xi = 0; xi < w; xi++ ) {
			var f = field( ( xi + 0.5 ) / w * VB_W, ( yi + 0.5 ) / h * VB_H );
			var hold = Math.min( 1, Math.abs( f.value ) / Math.max( f.density, 0.0001 ) );
			var near = Math.min( 1, f.density / 420 );
			var t = Math.pow( hold, 0.9 ) * ( 0.45 + 0.55 * Math.pow( near, 0.5 ) );
			var o = ( yi * w + xi ) * 4;

			if ( f.value >= 0 ) {
				px[o]   = 128 + 70 * t;
				px[o+1] = 42 + 16 * t;
				px[o+2] = 33 + 12 * t;
			} else {
				px[o]   = 30 + 14 * t;
				px[o+1] = 68 + 40 * t;
				px[o+2] = 104 + 58 * t;
			}
			px[o+3] = 30 + 175 * t;
		}
	}

	tctx.putImageData( img, 0, 0 );
	return terrain.toDataURL();
}

// Marching squares over the same field, for the one line that has to be sharp.
function frontRuns() {
	var cols = 76;
	var rows = Math.max( 24, Math.round( cols * VB_H / VB_W ) );

	var val = [], dens = [];
	for ( var r = 0; r <= rows; r++ ) {
		val[r] = []; dens[r] = [];
		for ( var c = 0; c <= cols; c++ ) {
			var f = field( c / cols * VB_W, r / rows * VB_H );
			val[r][c] = f.value;
			dens[r][c] = f.density;
		}
	}

	function cut( a, b ) { return a / ( a - b ); }

	var segments = [];
	for ( var r2 = 0; r2 < rows; r2++ ) {
		for ( var c2 = 0; c2 < cols; c2++ ) {
			// Out where nothing is near, the line between two distant nodes is
			// arithmetic rather than a front. Leave it off the map.
			var density = ( dens[r2][c2] + dens[r2][c2+1] + dens[r2+1][c2] + dens[r2+1][c2+1] ) / 4;
			if ( density < 70 ) continue;

			var tl = val[r2][c2], tr = val[r2][c2+1];
			var bl = val[r2+1][c2], br = val[r2+1][c2+1];
			var idx = ( tl > 0 ? 8 : 0 ) | ( tr > 0 ? 4 : 0 ) | ( br > 0 ? 2 : 0 ) | ( bl > 0 ? 1 : 0 );
			if ( idx === 0 || idx === 15 ) continue;

			var x0 = c2 / cols * VB_W, x1 = ( c2 + 1 ) / cols * VB_W;
			var y0 = r2 / rows * VB_H, y1 = ( r2 + 1 ) / rows * VB_H;

			var top    = [ x0 + ( x1 - x0 ) * cut( tl, tr ), y0 ];
			var bottom = [ x0 + ( x1 - x0 ) * cut( bl, br ), y1 ];
			var left   = [ x0, y0 + ( y1 - y0 ) * cut( tl, bl ) ];
			var right  = [ x1, y0 + ( y1 - y0 ) * cut( tr, br ) ];

			// Saddle cells contain two segments, not one. Connect around the
			// corners opposite the center's sign to retain both contour branches.
			if ( idx === 5 || idx === 10 ) {
				var centerPositive = tl + tr + bl + br > 0;
				if ( centerPositive === ( idx === 5 ) ) {
					segments.push( [left,top], [bottom,right] );
				} else {
					segments.push( [left,bottom], [top,right] );
				}
				continue;
			}
			var pair = {
				1:[left,bottom], 2:[bottom,right], 3:[left,right], 4:[top,right],
				5:[left,top], 6:[top,bottom], 7:[left,top], 8:[left,top],
				9:[top,bottom], 10:[left,bottom], 11:[top,right],
				12:[left,right], 13:[bottom,right], 14:[left,bottom]
			}[ idx ];

			if ( pair ) segments.push( pair );
		}
	}

	// Stitch the loose segments into runs so the front can be one stroked line
	// with one animation on it, rather than a thousand dashes. Walk both ways
	// from each seed, or a contour first met in its middle comes out as two.
	var key = function ( p ) { return Math.round( p[0] ) + ":" + Math.round( p[1] ); };
	var fromStart = {}, fromEnd = {};
	segments.forEach( function ( seg, i ) {
		( fromStart[ key( seg[0] ) ] = fromStart[ key( seg[0] ) ] || [] ).push( i );
		( fromEnd[ key( seg[1] ) ] = fromEnd[ key( seg[1] ) ] || [] ).push( i );
	} );

	function pick( table, point ) {
		var list = table[ key( point ) ] || [];
		for ( var i = 0; i < list.length; i++ ) {
			if ( !used[ list[i] ] ) return list[i];
		}
		return -1;
	}

	var used = [];
	var runs = [];

	segments.forEach( function ( seg, i ) {
		if ( used[i] ) return;
		used[i] = true;

		var run = [ seg[0], seg[1] ];

		for ( var f = 0; f < 5000; f++ ) {
			var end = run[ run.length - 1 ];
			var next = pick( fromStart, end );
			var reverse = false;
			if ( next < 0 ) { next = pick( fromEnd, end ); reverse = true; }
			if ( next < 0 ) break;
			used[ next ] = true;
			run.push( segments[ next ][ reverse ? 0 : 1 ] );
		}

		for ( var b = 0; b < 5000; b++ ) {
			var prev = pick( fromEnd, run[0] );
			var reversePrev = false;
			if ( prev < 0 ) { prev = pick( fromStart, run[0] ); reversePrev = true; }
			if ( prev < 0 ) break;
			used[ prev ] = true;
			run.unshift( segments[ prev ][ reversePrev ? 1 : 0 ] );
		}

		if ( run.length > 2 ) runs.push( run );
	} );

	return runs;
}

// A run of points as a smooth path, so the front reads as drawn rather than
// as sampled.
function smoothPath( pts ) {
	if ( pts.length < 3 ) return "";

	var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
	for ( var i = 0; i < pts.length - 1; i++ ) {
		var mx = ( pts[i][0] + pts[i+1][0] ) / 2;
		var my = ( pts[i][1] + pts[i+1][1] ) / 2;
		d += " Q" + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1) + " " +
		     mx.toFixed(1) + " " + my.toFixed(1);
	}
	var last = pts[ pts.length - 1 ];
	d += " L" + last[0].toFixed(1) + " " + last[1].toFixed(1);
	return d;
}

	el( "feTurbulence", { type:"fractalNoise", baseFrequency:"0.85", numOctaves:"3" }, grain );
	el( "feColorMatrix", { type:"saturate", values:"0" }, grain );

	var soft = el( "filter", { id:"soft", x:"-15%", y:"-15%", width:"130%", height:"130%" }, defs );

	var glow = el( "filter", { id:"glow", x:"-80%", y:"-80%", width:"260%", height:"260%" }, defs );

	[ [ "heatRED", "#ff9d78" ], [ "heatBLU", "#8fd0ff" ], [ "heatNEUTRAL", "#ffce7a" ] ]

// Two crossed sabres, for a node with a battle running on it.
function battleMark( parent, x, y, size ) {
	var g = el( "g", { transform:"translate(" + x + "," + y + ") scale(" + ( size / 12 ) + ")" }, parent );

	el( "circle", { cx:0, cy:0, r:12, fill:"#140e0a", stroke:"#8a6432", "stroke-width":2 }, g );

	var blades = el( "g", { "class":"spark" }, g );
	[ 45, -45 ].forEach( function ( angle ) {
		var b = el( "g", { transform:"rotate(" + angle + ")" }, blades );
		el( "line", { x1:0, y1:-8, x2:0, y2:5, stroke:"#ffe1ab", "stroke-width":2.2,
		              "stroke-linecap":"round" }, b );
		el( "line", { x1:-3.4, y1:5, x2:3.4, y2:5, stroke:"#c8894a", "stroke-width":2.2,
		              "stroke-linecap":"round" }, b );
	} );
}

	var key = JSON.stringify( [lang, data.nodes, data.edges, (data.fronts || []).map( function ( f ) {
		return [f.node, f.attacker, f.stage, f.stages, f.kind];
	} )] );
	if ( key === drawKey ) { updateSelection(); updateCaptures(); return; }
	drawKey = key;
	svg.textContent = "";
	captureRings = [];
	territoryPaths = [];
	demoTerritories = [];
	demoNodes = [];
	demoEdges = [];
	demoUiKey = "";

	if ( !data || !data.nodes || data.nodes.length === 0 ) return;

	geometry();

	var defs    = el( "defs", {}, svg );
	var gGround = el( "g", {}, svg );
	var gHeat   = el( "g", {}, svg );
	var gFront  = el( "g", {}, svg );
	var gEdges  = el( "g", {}, svg );
	var gNodes  = el( "g", {}, svg );
	var gLabels = el( "g", {}, svg );

	defineFilters( defs );

	// --- the ground: influence first, then the paper it is printed on
	if ( isDemo ) {
		[ ["RED", "#742d23", "#bc4936"], ["BLU", "#39769a", "#17364b"] ].forEach( function ( side ) {
			var gradient = el("linearGradient", {id:"territory" + side[0], x1:"0%", x2:"100%"}, defs);
			el("stop", {offset:"0%", "stop-color":side[1]}, gradient);
			el("stop", {offset:"100%", "stop-color":side[2]}, gradient);
			demoTerritories.push(el("path", {fill:"url(#territory" + side[0] + ")", opacity:".72"}, gGround));
		} );
	} else {
		var image = el( "image", { x:0, y:0, width:VB_W, height:VB_H,
			preserveAspectRatio:"none", filter:"url(#soft)" }, gGround );
		var url = paintTerrain();
		image.setAttribute( "href", url );
		image.setAttributeNS( xlinkNS, "xlink:href", url );
	}

	el( "rect", { x:0, y:0, width:VB_W, height:VB_H, fill:"url(#grid)" }, gGround );
	el( "rect", { x:0, y:0, width:VB_W, height:VB_H, fill:"url(#gridCoarse)" }, gGround );
	if ( !isDemo ) el( "rect", { x:0, y:0, width:VB_W, height:VB_H, filter:"url(#grain)", opacity:".045" }, gGround );

	// --- where the people are, before anything is drawn on top of them
	data.nodes.forEach( function ( n ) {
		if ( !n.players || isDemo ) return;
		var r = 48 + Math.min( n.players, 32 ) * 2.4;
		el( "circle", { cx:mapX( n ), cy:mapY( n ), r:r,
		                fill:"url(#heat" + ( n.owner || "NEUTRAL" ) + ")" }, gHeat );
	} );

	// --- the front line: a shadow, a dark bed, the moving line, and the ticks
	//     that say which side is pushing
	var frontPath = isDemo ? demoFrontPath(demoState(demoTime())) : frontRuns().map( smoothPath ).join( " " );
	territoryPaths.push( el( "path", { d:frontPath, fill:"none", stroke:"rgba(255,186,102,.16)",
		"stroke-width":18 }, gFront ) );
	territoryPaths.push( el( "path", { d:frontPath, fill:"none", stroke:"#180f0b",
		"stroke-width":7 }, gFront ) );
	territoryPaths.push( el( "path", { "class":"frontLine", d:frontPath, fill:"none", stroke:"#f0b463",
		"stroke-width":3, "stroke-dasharray":"16 10", "stroke-linecap":"round" }, gFront ) );
	// A constant normalized length keeps dash positions attached to the same
	// part of the front as it bends. Never restart or re-stitch the demo path.
	if ( isDemo ) territoryPaths[2].setAttribute("pathLength", "520");

	// --- supply lines
	data.edges.forEach( function ( e ) {
		var a = nodeById( e.a ), b = nodeById( e.b );
		if ( !a || !b ) return;

		var contested = a.owner !== b.owner;
		var ax = mapX( a ), ay = mapY( a ), bx = mapX( b ), by = mapY( b );

		el( "line", { x1:ax, y1:ay, x2:bx, y2:by, stroke:"rgba(0,0,0,.5)", "stroke-width":9,
		              "stroke-linecap":"round" }, gEdges );
		var road = el( "line", { x1:ax, y1:ay, x2:bx, y2:by,
		              stroke: contested ? "rgba(240,180,99,.9)" : "rgba(196,182,152,.42)",
		              "stroke-width": contested ? 3.6 : 2.6,
		              "stroke-dasharray": contested ? "9 8" : null,
		              "stroke-linecap":"round" }, gEdges );
		if ( isDemo ) {
			var flow = el( "line", { x1:ax, y1:ay, x2:bx, y2:by, "class":"supplyFlow",
				stroke:sideColor( a.owner, true ), "stroke-width":3,
				"stroke-dasharray":"3 77", opacity:".8" }, gEdges );
			demoEdges.push({a:a, b:b, road:road, flow:flow});
		}
	} );

	// --- nodes
	data.nodes.forEach( function ( n ) {
		var x = mapX( n ), y = mapY( n );
		var front = frontForNode( n.id );
		var r = n.hq ? 26 : (isFull ? 20 : 15);

		var g = el( "g", { "class":"nodeHit", "data-id":n.id,
			role:isFull ? "button" : null, tabindex:isFull ? "0" : null,
			"aria-label":n.name + ", " + n.owner }, gNodes );
		el( "title", {}, g ).textContent = n.name + " / " + n.owner;

		// the capture backdrop: how far the attacker has got around the node,
		// behind the node itself so the marker stays readable
		if ( front ) {
			var captureGroup = el("g", {"class":"captureEffects"}, g);
			var halo = el( "circle", { cx:x, cy:y, r:r + 30, fill:sideColor( front.attacker, false ),
			                "class":"breathe" }, captureGroup );

			var pr = r + 14;
			var frac = Math.max( 0.02, Math.min( 1, front.progress ) );
			var circ = 2 * Math.PI * pr;
			el( "circle", { cx:x, cy:y, r:pr, fill:"none", stroke:"rgba(0,0,0,.55)", "stroke-width":7 }, captureGroup );
			var ring = el( "circle", { cx:x, cy:y, r:pr, fill:"none", stroke:sideColor( front.attacker, true ),
			                "stroke-width":7, "stroke-linecap":"round",
			                "stroke-dasharray": ( circ * frac ).toFixed(1) + " " + circ.toFixed(1),
			                transform:"rotate(-90 " + x + " " + y + ")" }, captureGroup );
			var wave = el("circle", {cx:x, cy:y, r:pr, fill:"none", "stroke-width":3, opacity:0}, g);
			captureRings.push( { node:n.id, element:ring, circumference:circ, group:captureGroup, halo:halo, wave:wave, radius:pr } );
		}

		// the marker: a hexagon, larger and ringed for a headquarters
		var pts = [];
		for ( var i = 0; i < 6; i++ ) {
			var a = Math.PI / 6 + i * Math.PI / 3;
			pts.push( ( x + r * Math.cos( a ) ).toFixed(1) + "," + ( y + r * Math.sin( a ) ).toFixed(1) );
		}
		var inner = [];
		for ( var j = 0; j < 6; j++ ) {
			var a2 = Math.PI / 6 + j * Math.PI / 3;
			inner.push( ( x + r * 0.66 * Math.cos( a2 ) ).toFixed(1) + "," +
			            ( y + r * 0.66 * Math.sin( a2 ) ).toFixed(1) );
		}

		el( "polygon", { points:pts.join(" "), fill:"rgba(0,0,0,.55)", transform:"translate(0,4)" }, g );
		var face = el( "polygon", { "class":"nodeFace", points:pts.join(" "), fill:sideColor( n.owner, false ),
		                 stroke:"#0f0b09", "stroke-width":3 }, g );
		var rim = el( "polygon", { points:inner.join(" "), fill:"none", stroke:sideColor( n.owner, true ),
		                 "stroke-width":1.6, opacity:".85" }, g );

		if ( n.hq ) {
			el( "circle", { cx:x, cy:y, r:6.5, fill:"#0f0b09" }, g );
			el( "circle", { cx:x, cy:y, r:3.2, fill:sideColor( n.owner, true ) }, g );
		}

		var battleIcon = el("g", {}, g);
		if ( n.battles > 0 || (isDemo && front) ) battleMark( battleIcon, x - r * 1.25, y - r * 1.25, 17 );
		if ( isDemo ) demoNodes.push({node:n, group:g, face:face, rim:rim, battle:battleIcon});

		// how many people are on it, as a tag under the marker
		if ( isFull && n.players > 0 ) {
			var tagW = 46, tagH = 21;
			var tagGroup = el( "g", { "class":"playerTag" }, g );
			el( "rect", { x:x - tagW / 2, y:y + r + 4, width:tagW, height:tagH, rx:4,
			              fill:"#130e0b", stroke:"#5a442c", "stroke-width":1.5 }, tagGroup );
			var tag = el( "text", { x:x, y:y + r + 19, "text-anchor":"middle",
			                        "class":"label labelSub", fill:"#ffd9a0", stroke:"none" }, tagGroup );
			tag.textContent = "● " + n.players;
		}

		if ( isFull ) {
			var sel = [];
			for ( var k = 0; k < 6; k++ ) {
				var a3 = Math.PI / 6 + k * Math.PI / 3;
				sel.push( ( x + ( r + 10 ) * Math.cos( a3 ) ).toFixed(1) + "," +
				          ( y + ( r + 10 ) * Math.sin( a3 ) ).toFixed(1) );
			}
			el( "polygon", { "class":"selection", points:sel.join(" "), fill:"none", stroke:"#ffe9b8",
			                 "stroke-width":2.5, "stroke-dasharray":"7 5", opacity:".95" }, g );
		}

		if ( isFull ) {
			el( "path", { "class":"deployMarker", d:"M" + x + " " + ( y - r - 14 ) + " l 10 -16 h -20 z", fill:"#9fd07a",
			              stroke:"#1d2c17", "stroke-width":2 }, g );
		}

		// hit area, generous: this is a menu, not a strategy game
		el( "circle", { cx:x, cy:y, r:r + (isFull ? 36 : 24), fill:"transparent" }, g );
	} );

	// --- labels last, so nothing is drawn over them
	data.nodes.forEach( function ( n ) {
		if ( !isFull && !n.hq ) return;
		var x = mapX( n ), y = mapY( n );
		var r = n.hq ? 26 : 20;
		var front = frontForNode( n.id );
		var lift = n.players > 0 ? 26 : 0;

		var name = el( "text", { x:x, y:y + r + 20 + lift, "text-anchor":"middle",
		                         "class":"label labelName" + (n.hq ? " labelHQ" : ""), "data-label":n.id,
		                         fill: front ? "#ffe6bd" : "#e6dcc4" }, gLabels );
		// Split long localized names instead of shrinking them into illegibility.
		var words = ( !isFull ? n.owner + " HQ" : n.name ).split( " " );
		var lines = [""];
		words.forEach( function ( word ) {
			var last = lines.length - 1;
			if ( lines[last] && (lines[last] + " " + word).length > 18 ) lines.push( word );
			else lines[last] += (lines[last] ? " " : "") + word;
		} );
		lines.forEach( function ( line, i ) {
			el( "tspan", {x:x, dy:i ? 18 : 0}, name ).textContent = line;
		} );

		var subText = front
			? kindName( front.kind ) + "  " + front.stage + "/" + front.stages
			: ( n.region || ( n.hq ? T( "hq" ) : "" ) );

		if ( isFull && subText ) {
			var sub = el( "text", { x:x, y:y + r + 38 + lift + (lines.length - 1) * 18, "text-anchor":"middle",
			                        "class":"label labelSub", "data-status":n.id,
			                        fill: front ? "#f0b463" : "#a2977f" }, gLabels );
			sub.textContent = subText;
		}
	} );

	el( "rect", { x:0, y:0, width:VB_W, height:VB_H, fill:"url(#vig)", "pointer-events":"none" }, svg );

	if ( isFull ) {
		Array.prototype.forEach.call( svg.querySelectorAll( ".nodeHit" ), function ( g ) {
			function selectNode() {
				selected = g.getAttribute( "data-id" );
				fillSidebar();
				updateSelection();
			}
			g.addEventListener( "click", selectNode );
			g.addEventListener( "keydown", function ( event ) {
				if ( event.key === "Enter" || event.key === " " ) { event.preventDefault(); selectNode(); }
			} );
		} );
	}
	updateSelection();
	// Rebuilt live geometry still joins the shared effect phase rather than restarting it.
	Array.prototype.forEach.call( svg.querySelectorAll( ".frontLine, .spark, .breathe, .supplyFlow" ), function ( node ) {
		var duration = node.classList.contains("spark") ? 3200 : node.classList.contains("supplyFlow") ? 4000 : 2600;
		node.style.animationDelay = -(Date.now() % duration) + "ms";
	} );
}

function updateSelection() {
	Array.prototype.forEach.call( svg.querySelectorAll( ".labelName" ), function ( label ) {
		label.classList.toggle( "selected", label.getAttribute("data-label") === selected );
	} );
	Array.prototype.forEach.call( svg.querySelectorAll( ".nodeHit" ), function ( node ) {
		var id = node.getAttribute( "data-id" );
		node.classList.toggle( "selected", isFull && id === selected );
		if ( isFull ) node.setAttribute( "aria-pressed", id === selected ? "true" : "false" );
		var marker = node.querySelector( ".deployMarker" );
		if ( marker ) marker.style.visibility = data.deploy === id ? "visible" : "hidden";
	} );
}

function updateCaptures() {
	captureRings.forEach( function ( ring ) {
		var front = frontForNode( ring.node );
		if ( front ) ring.element.setAttribute( "stroke-dasharray",
			(ring.circumference * Math.max(0, Math.min(1, front.progress))).toFixed(2) + " " + ring.circumference.toFixed(2) );
		if ( front && isDemo ) {
			var age = front.captureAge;
			var fade = front.active ? 1 : Math.max(0, 1 - age / 2);
			ring.group.setAttribute("opacity", fade);
			ring.element.setAttribute("stroke", sideColor(front.attacker, true));
			ring.halo.setAttribute("fill", sideColor(front.attacker, false));
			ring.wave.setAttribute("stroke", sideColor(nodeById(ring.node).owner, true));
			ring.wave.setAttribute("r", ring.radius + Math.min(age / 2, 1) * 55);
			ring.wave.setAttribute("opacity", age < 2 ? Math.sin(Math.PI * age / 2) * .85 : 0);
		}
	} );
	var front = frontForNode( selected );
	var bar = document.querySelector( "#selBody .bar > i" );
	if ( front && bar ) bar.style.width = (front.progress * 100).toFixed(1) + "%";
	var percent = document.getElementById("capturePercent");
	if ( front && percent ) percent.textContent = front.active ? Math.floor(front.progress * 100) + "%" : T("secured");
}

//----------------------------------------------------------------- the words
function row2( host, label, value ) {
	var r = div( "row", null, host );
	var s = document.createElement( "span" ); s.textContent = label; r.appendChild( s );
	var b = document.createElement( "b" ); b.textContent = value; r.appendChild( b );
}

function statusLine() {
	if ( !data ) return "";
	if ( !data.fronts || data.fronts.length === 0 ) return T( "quiet" );

	var f = data.fronts[0];
	var n = nodeById( f.node );
	return T( "attacking" ).replace( "%a%", f.attacker ).replace( "%n%", n ? n.name : f.node );
}

function fillHeader() {
	var host = document.getElementById( "headerStats" );
	host.textContent = "";

	document.getElementById( "title" ).textContent = data.name || "Campaign";
	document.getElementById( "subtitle" ).textContent = statusLine();

	var st = data.status || {};
	function stat( value, label, off ) {
		var box = div( "stat" + ( off ? " off" : "" ), null, host );
		var b = document.createElement( "b" ); b.textContent = value; box.appendChild( b );
		var s = document.createElement( "span" ); s.textContent = label; box.appendChild( s );
	}

	if ( !st.checked ) {
		stat( "--", T( "online" ), true );
	} else if ( !st.valid ) {
		stat( "!", T( "coordinatorDown" ), true );
	} else {
		stat( st.online, T( "online" ) );
		stat( st.matches, T( "matches" ) );
		stat( st.serversKnown ? st.servers : "~", T( "free" ) );
	}
}

function fillSidebar() {
	if ( !isFull ) return;

	var n = nodeById( selected ) || nodeById( data.deploy ) ||
	        ( data.fronts && data.fronts[0] ? nodeById( data.fronts[0].node ) : null ) ||
	        data.nodes[0];

	selected = n ? n.id : null;

	var nameEl = document.getElementById( "selName" );
	var ownEl  = document.getElementById( "selOwner" );
	var body   = document.getElementById( "selBody" );
	body.textContent = "";

	if ( !n ) {
		nameEl.textContent = T( "selectPrompt" );
		ownEl.textContent = "";
		document.getElementById( "deploy" ).disabled = true;
		["battles", "regions", "servers", "queueBody"].forEach( function ( id ) {
			document.getElementById(id).textContent = T("empty");
		} );
		return;
	}

	nameEl.textContent = n.name;
	ownEl.className = "owner-" + n.owner;
	ownEl.textContent = T( "owner" ) + ": " + ( n.owner === "NEUTRAL" ? T( "neutral" ) : n.owner );

	function row( label, value ) {
		var r = div( "row", null, body );
		var s = document.createElement( "span" ); s.textContent = label; r.appendChild( s );
		var b = document.createElement( "b" ); b.textContent = value; r.appendChild( b );
	}

	var front = frontForNode( n.id );
	if ( front ) {
		row( T( "kind" ), isDemo && !front.active ? T("holding") : kindName( front.kind ) );
		row( T( "map" ), front.map || "--" );
		row( T( isDemo && !front.active ? "defenders" : "garrison" ), front.players + " " + T( "players" ) );

		var pips = div( "stages", null, body );
		for ( var i = 1; i <= Math.max( 1, front.stages ); i++ ) {
			div( "pip" + ( (isDemo && !front.active) || i < front.stage ? " done" : i === front.stage ? " live" : "" ), "", pips );
		}

		var bar = div( "bar hot", null, body );
		var fill = document.createElement( "i" );
		fill.style.width = Math.round( Math.max( 2, front.progress * 100 ) ) + "%";
		bar.appendChild( fill );
		if ( isDemo ) {
			var captureRow = div("row", null, body);
			div(null, T("capture"), captureRow);
			var percent = document.createElement("b");
			percent.id = "capturePercent";
			percent.textContent = front.active ? Math.floor(front.progress * 100) + "%" : T("secured");
			captureRow.appendChild(percent);
		}
	} else {
		row( T( "region" ), n.region || "--" );
		row( T( "garrison" ), ( n.players || 0 ) + " " + T( "players" ) );
		row( T( "type" ), nodeKindName( n ) );
	}

	// live battles
	var battles = document.getElementById( "battles" );
	battles.textContent = "";
	if ( !data.fronts || data.fronts.length === 0 ) {
		div( "item sub", T( "quiet" ), battles );
	} else {
		data.fronts.slice( 0, 3 ).forEach( function ( f ) {
			var node = nodeById( f.node );
			var item = div( "item", null, battles );
			var dot = div( "dot", "", item );
			dot.style.background = sideColor( isDemo && !f.active ? node.owner : f.attacker, true );
			var who = div( "who", null, item );
			div( null, ( node ? node.name : f.node ), who );
			div( "sub", (isDemo ? (f.active ? f.attacker + " / " + T("capture") : node.owner + " / " + T("holding")) : kindName(f.kind)) + "  ·  " + ( f.map || "--" ), who );
			div( "num", f.players, item );
		} );

		if ( data.fronts.length > 3 ) {
			div( "more", "+" + ( data.fronts.length - 3 ), battles );
		}
	}

	// servers, so it is obvious where people actually are
	var servers = document.getElementById( "servers" );
	servers.textContent = "";
	if ( !data.servers || data.servers.length === 0 ) {
		div( "item sub", T( "empty" ), servers );
	} else {
		data.servers.slice( 0, 3 ).forEach( function ( s ) {
			var item = div( "item", null, servers );
			var dot = div( "dot", "", item );
			dot.style.background = s.players > 0 ? "#9fd07a" : "#5a5044";
			var who = div( "who", null, item );
			div( null, s.name, who );
			div( "sub", ( s.region || "--" ) + "  ·  " + ( s.map || T( "idle" ) ), who );
			div( "num", s.players + "/" + s.max, item );
		} );

		if ( data.servers.length > 3 ) {
			div( "more", "+" + ( data.servers.length - 3 ), servers );
		}
	}

	// where the population actually is, which is the thing a player wants to
	// know before picking a side of the map to fight on
	var regions = document.getElementById( "regions" );
	regions.textContent = "";

	var byRegion = {};
	( data.servers || [] ).forEach( function ( srv ) {
		var name = srv.region || "--";
		byRegion[ name ] = ( byRegion[ name ] || 0 ) + ( srv.players || 0 );
	} );

	var names = Object.keys( byRegion );
	var busiest = 1;
	names.forEach( function ( name ) { busiest = Math.max( busiest, byRegion[ name ] ); } );

	names.sort( function ( a, b ) { return byRegion[b] - byRegion[a]; } ).forEach( function ( name ) {
		var item = div( "item", null, regions );
		var who = div( "who", null, item );
		div( null, name, who );
		var bar = div( "bar", null, who );
		var fill = document.createElement( "i" );
		fill.style.width = Math.round( 100 * byRegion[ name ] / busiest ) + "%";
		bar.appendChild( fill );
		div( "num", byRegion[ name ], item );
	} );

	// what matchmaking is doing, so the map is not a second place to be told
	// nothing about the queue you are standing in
	var q = data.queue || {};
	var queueBody = document.getElementById( "queueBody" );
	queueBody.textContent = "";

	var stateName = {
		searching: "queueSearching", ready: "queueReady",
		connecting: "queueConnecting", inmatch: "queueInMatch"
	}[ q.state ] || "queueIdle";

	row2( queueBody, T( stateName ), q.group || "--" );

	if ( q.state === "searching" ) {
		var total = Math.max( 1, ( q.have || 0 ) + ( q.need || 0 ) );
		var qbar = div( "bar hot", null, queueBody );
		var qfill = document.createElement( "i" );
		qfill.style.width = Math.round( 100 * ( q.have || 0 ) / total ) + "%";
		qbar.appendChild( qfill );

		var mins = Math.floor( ( q.seconds || 0 ) / 60 );
		var secs = ( q.seconds || 0 ) % 60;
		row2( queueBody,
		      T( "waiting2" ).replace( "%h%", q.have || 0 ).replace( "%n%", q.need || 0 ),
		      mins + ":" + ( secs < 10 ? "0" : "" ) + secs );
	}

	var deploy = document.getElementById( "deploy" );
	var here = data.deploy && data.deploy === selected;
	deploy.textContent = isDemo ? T( here ? "demoSelected" : "demoSelect" ) : T( here ? "deployed" : "deploy" );
	deploy.classList.toggle( "here", !!here );
	deploy.disabled = !selected;
}

function fillCard() {
	if ( isFull ) return;

	var host = document.getElementById( "cardFront" );
	host.textContent = "";

	var f = data.fronts && data.fronts[0];
	if ( f ) {
		var n = nodeById( f.node );
		var b = document.createElement( "b" );
		b.textContent = f.attacker;
		b.style.color = sideColor( f.attacker, true );
		host.appendChild( b );
		var rest = document.createElement( "span" );
		rest.textContent = " → " + ( n ? n.name : f.node ) + "  ·  " +
		                   kindName( f.kind ) + " " + f.stage + "/" + f.stages;
		host.appendChild( rest );
	} else {
		host.textContent = statusLine();
	}

	var st = data.status || {};
	var pop = document.getElementById( "cardPop" );
	if ( isDemo ) {
		pop.textContent = T( "demoPopulation" );
	} else if ( !st.checked ) {
		pop.textContent = "--";
	} else if ( !st.valid ) {
		pop.textContent = T( "coordinatorDown" );
	} else {
		pop.textContent = st.online + " " + T( "online" ) + "  ·  " +
		                  st.matches + " " + T( "matches" );
	}
}

function render() {
	if ( !data ) return;

	lang = ( data.lang && data.lang.toLowerCase().indexOf( "russ" ) === 0 ) ? "ru" : "en";
	document.documentElement.lang = lang;
	document.body.classList.toggle( "demo", isDemo );
	Array.prototype.forEach.call( document.querySelectorAll( "[data-t]" ), function ( node ) {
		node.textContent = T( node.getAttribute( "data-t" ) );
	} );

	document.getElementById( "demoBadge" ).classList.toggle( "hidden", !data.demo );
	document.getElementById( "demoBadge" ).textContent = T( "demo" );
	if ( isDemo ) {
		document.getElementById( "hint" ).textContent = T( "demoHint" );
		document.getElementById( "demoBadge" ).title = T( "demoNote" );
		document.querySelector("#battlePanel h2").textContent = T("operations");
	}

	var empty = !data.nodes || data.nodes.length === 0;
	document.body.classList.toggle( "offline", empty );
	document.getElementById( "offline" ).textContent = empty ? T( "noCampaign" ) : "";

	fillHeader();
	fillSidebar();
	fillCard();
	draw();
	updateCaptures();
	if ( isDemo ) { demoPhase = -1; updateDemo(); }
}

//---------------------------------------------------------------- the feed
var everAnswered = false;
var pollPending = false;

function poll() {
	if ( isDemo || pollPending || document.hidden ) return;
	pollPending = true;
	var controller = new AbortController();
	var timeout = setTimeout( function () { controller.abort(); }, 5000 );
	fetch( "/v1/campaign", { cache: "no-store", signal:controller.signal } ).then( function ( r ) {
		if ( !r.ok ) throw new Error( "HTTP " + r.status );
		return r.json();
	} ).then( function ( doc ) {
		if ( !doc || !doc.version || !Array.isArray(doc.nodes) || !Array.isArray(doc.edges) ) throw new Error( "empty" );
		everAnswered = true;
		data = doc;
		render();
	} ).catch( function () {
		if ( everAnswered ) {
			document.getElementById( isFull ? "subtitle" : "cardPop" ).textContent = T( "stale" );
			return;
		}
		document.body.classList.add( "offline" );
		document.getElementById( "offline" ).textContent = T( "waiting" );
	} ).finally( function () {
		clearTimeout( timeout );
		pollPending = false;
	} );
}

//---------------------------------------------------------------- demo playback
function demoState( time ) {
	var t = ((time % DEMO_DURATION) + DEMO_DURATION) % DEMO_DURATION / DEMO_DURATION;
	var seconds = t * 64;
	function sector(start, capture, counter, recapture, owner, attacker) {
		var taken = seconds >= capture && seconds < recapture;
		var returning = seconds >= counter;
		var active = (seconds >= start && seconds < capture) || (seconds >= counter && seconds < recapture);
		var progress = returning ? demoEase(counter, recapture, seconds) : demoEase(start, capture, seconds);
		// A two-second defensive stand at the reservoir, followed by the final push.
		if ( start === 20 && seconds < capture ) progress = seconds < 25
			? .42 * demoEase(20, 23, seconds) : .42 + .58 * demoEase(25, 30, seconds);
		return {owner:taken ? attacker : owner, attacker:returning ? owner : attacker,
			active:active, progress:progress,
			control:demoEase(capture - 1, capture + 2, seconds) * (1 - demoEase(recapture - 1, recapture + 2, seconds)),
			captureAge:seconds >= recapture ? seconds - recapture : seconds >= capture ? seconds - capture : 1000};
	}
	var works = sector(4, 12, 34, 44, "RED", "BLU");
	var reservoir = sector(20, 30, 46, 56, "BLU", "RED");
	// Hide completed rings before returning to the opening frame; ownership is
	// restored by the counterattacks, not by a reset at the loop boundary.
	if ( seconds > 60 ) { works.progress = 1 - demoEase(60, 63, seconds); reservoir.progress = works.progress; }
	var boundaries = [4, 12, 20, 30, 34, 44, 56];
	var phase = boundaries.filter(function(boundary) { return seconds >= boundary; }).length;
	return {phase:phase, progress:t, blu:works.progress, red:reservoir.progress, works:works, reservoir:reservoir};
}

function demoEase(start, end, value) {
	var t = Math.max(0, Math.min(1, (value - start) / (end - start)));
	return t * t * (3 - 2 * t);
}

function demoFrontPath(state) {
	// A single authored front has stable topology and a fixed north-to-south
	// parameterization. Two local bulges follow the captured sectors continuously.
	var points = [];
	for ( var y = 0; y <= VB_H; y += 25 ) {
		var x = 495 + 35 * Math.tanh((y - 215) / 65);
		x -= 170 * state.works.control * Math.exp(-Math.pow((y - 266) / 65, 2) / 2);
		x += 170 * state.reservoir.control * Math.exp(-Math.pow((y - 148) / 55, 2) / 2);
		points.push([x, y]);
	}
	return smoothPath(points);
}

function applyDemoState(state) {
	["works", "reservoir"].forEach(function(id, index) {
		var sector = state[id];
		var node = nodeById(id);
		node.owner = sector.owner;
		node.battles = sector.active ? 1 : 0;
		var front = data.fronts[index];
		front.attacker = sector.attacker;
		front.progress = sector.progress;
		front.active = sector.active;
		front.captureAge = sector.captureAge;
		front.stage = 1; front.stages = 1;
	});
}

function demoTime() {
	if ( reducedMotion.matches ) return DEMO_DURATION * .4;
	return (demoClock.pausedAt === null ? Date.now() : demoClock.pausedAt) - demoClock.offset;
}

function updateDemo() {
	if ( !isDemo || !data ) return;
	var time = demoTime();
	var paused = demoClock.pausedAt !== null;
	if ( time === lastDemoTime && paused === lastPaused && demoPhase !== -1 ) return;
	lastDemoTime = time;
	lastPaused = paused;
	var state = demoState( time );
	applyDemoState(state);
	var uiKey = JSON.stringify([state.phase, state.works.owner, state.reservoir.owner,
		state.works.active, state.reservoir.active, state.works.attacker, state.reservoir.attacker]);
	if ( uiKey !== demoUiKey ) {
		demoUiKey = uiKey;
		fillSidebar();
		demoNodes.forEach(function(view) {
			view.group.setAttribute("aria-label", view.node.name + ", " + view.node.owner);
			view.group.querySelector("title").textContent = view.node.name + " / " + view.node.owner;
			var front = frontForNode(view.node.id);
			view.battle.style.visibility = front && front.active ? "visible" : "hidden";
			var sub = svg.querySelector('[data-status="' + view.node.id + '"]');
			if ( sub && front ) sub.textContent = front.active ? front.attacker + " / " + T("capture") : view.node.owner + " / " + T("holding");
		});
		demoEdges.forEach(function(edge) {
			var contested = edge.a.owner !== edge.b.owner;
			edge.road.setAttribute("stroke", contested ? "#b99a68" : sideColor(edge.a.owner, true));
			edge.road.setAttribute("stroke-dasharray", contested ? "9 8" : "none");
			edge.flow.style.visibility = contested ? "hidden" : "visible";
			edge.flow.setAttribute("stroke", sideColor(edge.a.owner, true));
		});
	}
	demoNodes.forEach(function(view) {
		var sector = state[view.node.id];
		if ( !sector ) return;
		var blu = view.node.id === "works" ? sector.control : 1 - sector.control;
		function color(red, blue) { return "rgb(" + red.map(function(value, i) { return Math.round(value + (blue[i] - value) * blu); }).join(",") + ")"; }
		view.face.setAttribute("fill", color([194,59,44], [74,127,168]));
		view.rim.setAttribute("stroke", color([244,112,90], [124,192,236]));
	});
	updateCaptures();
	if ( demoPhase !== state.phase ) {
		demoPhase = state.phase;
		document.getElementById( "briefingTitle" ).textContent = T( "phase" + state.phase );
		document.getElementById( "briefingText" ).textContent = T( "brief" + state.phase );
		document.getElementById( "subtitle" ).textContent = T( "demoNote" );
		if ( !isFull ) document.getElementById( "cardFront" ).textContent = T( "phase" + state.phase );
	}
	// The playhead is circular: fade it out at the seam rather than snap a full bar to zero.
	var track = document.querySelector( "#demoTrack i" );
	track.style.transform = "scaleX(" + state.progress + ")";
	track.style.opacity = Math.min(1, (1 - state.progress) * 24);
	document.body.classList.toggle( "paused", paused );
	var pause = document.getElementById( "pauseDemo" );
	pause.textContent = T( paused ? "resume" : "pause" );
	pause.setAttribute( "aria-pressed", paused ? "true" : "false" );
	pause.disabled = reducedMotion.matches;
	var path = demoFrontPath(state);
	if ( demoTerritories.length ) {
		demoTerritories[0].setAttribute("d", path + " L0 " + VB_H + " L0 0 Z");
		demoTerritories[1].setAttribute("d", path + " L" + VB_W + " " + VB_H + " L" + VB_W + " 0 Z");
		territoryPaths.forEach(function(node) { node.setAttribute("d", path); });
		territoryPaths[2].style.strokeDashoffset = -(time % 2600) / 100;
	}
	var latest = state.works.captureAge < state.reservoir.captureAge ? "works" : "reservoir";
	var age = state[latest].captureAge;
	var notice = document.getElementById("captureNotice");
	var noticeOpacity = demoEase(0, .3, age) * (1 - demoEase(3, 4, age));
	notice.style.opacity = noticeOpacity;
	notice.style.transform = "translateY(" + (1 - noticeOpacity) * -8 + "px)";
	if ( noticeOpacity > 0 ) {
		notice.style.color = sideColor(state[latest].owner, true);
		var message = T("captured").replace("%a%", state[latest].owner).replace("%n%", nodeById(latest).name);
		if ( notice.textContent !== message ) notice.textContent = message;
	}
}

function readDemoClock() {
	try {
		var clock = JSON.parse( localStorage.getItem("campaign-demo-clock-v1") );
		if ( clock && Number.isFinite(clock.offset) &&
			(clock.pausedAt === null || Number.isFinite(clock.pausedAt)) ) demoClock = clock;
	} catch ( e ) { /* Storage may be disabled in the embedded browser. */ }
}

function startDemo( language ) {
	var deploy = data && data.deploy;
	data = JSON.parse( JSON.stringify(SAMPLE) );
	data.deploy = deploy || "";
	lang = language === "ru" ? "ru" : "en";
	data.lang = lang === "ru" ? "russian" : "english";
	data.name = T( "demoName" );
	if ( lang === "ru" ) {
		var names = { red_hq:"Штаб RED", yard:"Железнодорожный двор", depot:"Лесопилка",
			works:"Литейная 17", reservoir:"Водохранилище", quarry:"Карьер",
			junction:"Железный узел", blu_hq:"Штаб BLU" };
		data.nodes.forEach( function ( node ) { node.name = names[node.id]; } );
	}
	var state = demoState(demoTime());
	applyDemoState(state);
	var link = new URLSearchParams(location.search);
	link.set("view", "full"); link.set("lang", lang);
	document.getElementById("cardOpen").href = "?" + link.toString();
	render();
}

document.getElementById( "deploy" ).addEventListener( "click", function () {
	if ( !selected ) return;
	post( "deploy " + selected );
	// Show it immediately; the next document confirms it.
	if ( data ) { data.deploy = selected; }
	updateSelection();
	fillSidebar();
} );

document.getElementById( "pauseDemo" ).addEventListener( "click", function () {
	if ( demoClock.pausedAt === null ) demoClock.pausedAt = Date.now();
	else { demoClock.offset += Date.now() - demoClock.pausedAt; demoClock.pausedAt = null; }
	try { localStorage.setItem("campaign-demo-clock-v1", JSON.stringify(demoClock)); } catch ( e ) {}
	updateDemo();
} );
window.addEventListener( "storage", function ( event ) {
	if ( event.key === "campaign-demo-clock-v1" ) { readDemoClock(); updateDemo(); }
} );

function closeMap() {
	if ( params.get("embedded") === "1" || everAnswered ) post("close");
	else {
		var query = new URLSearchParams(location.search);
		query.set("view", "card");
		location.search = query.toString();
	}
}
document.getElementById("closeMap").addEventListener("click", closeMap);
document.addEventListener("keydown", function ( event ) {
	if ( isFull && event.key === "Escape" ) { event.preventDefault(); closeMap(); }
} );

if ( isDemo ) {
	readDemoClock();
	startDemo( demoLang || (navigator.language.indexOf("ru") === 0 ? "ru" : "en") );
	// Only ask the game for its language, never mix live queue/population into the fixture.
	if ( !demoLang ) fetch("/v1/campaign", {cache:"no-store"}).then(function ( response ) {
		if ( !response.ok ) throw new Error("No game feed");
		return response.json();
	}).then(function ( doc ) {
		everAnswered = true;
		var language = /^russ/i.test(doc.lang || "") ? "ru" : "en";
		if ( language !== lang ) startDemo(language);
	}).catch(function () {});
	function frame() {
		if ( !document.hidden ) updateDemo();
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
} else {
	poll();
	setInterval( poll, isFull ? 1500 : 2500 );
}
</script>
