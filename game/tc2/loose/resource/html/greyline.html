<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GREYLINE FRONTRESS</title>
<!--
  GREYLINE FRONTRESS — the test menu.

  This is the whole client for the MVP: the war map, DEPLOY, the queue, and the
  jump into a battle. It is deliberately one plain file with no build step and
  no assets, because it exists to test the coordinator, not to be the game's
  real interface. When the real menu is built this can be deleted without
  anything else noticing: everything it does goes through the coordinator's
  public HTTP API.

  It runs in two places:

    in the game   — the main menu web panel. Requests go through the game's
                    "fetch" bridge (SteamHTTP), so there is no CORS to fight,
                    and joining a battle can drive the console directly.
    in a browser  — same page, opened at the coordinator during development.
                    Requests are ordinary fetch(); joining prints the console
                    line to paste.

  Nothing here is authoritative. The war lives in the coordinator; this page
  only asks it questions and presses DEPLOY.
-->
<style>
  :root {
    --bg: #14100e;
    --panel: #1d1815;
    --panel-2: #262019;
    --line: #3a3029;
    --ink: #e8dcc8;
    --dim: #9a8b78;
    --red: #b8383b;
    --blu: #5885a2;
    --neutral: #6b6259;
    --gold: #d8a038;
    --ok: #7ea04d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: baseline; gap: 18px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #241d18, #191411);
  }
  header h1 {
    margin: 0; font-size: 20px; letter-spacing: .18em;
    color: var(--gold); font-weight: 700;
  }
  header .campaign { color: var(--ink); font-size: 14px; }
  header .spacer { flex: 1; }
  header .stat { color: var(--dim); font-size: 13px; }
  header .stat b { color: var(--ink); font-weight: 600; }
  .menu-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .menu-actions button { padding: 5px 9px; font-size: 12px; }

  main { flex: 1; display: flex; min-height: 0; }
  .left { flex: 1.2; padding: 18px; display: flex; flex-direction: column; min-width: 0; }
  .right { width: 430px; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; margin-bottom: 14px;
  }
  .card h2 {
    margin: 0; padding: 9px 14px; font-size: 12px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .card .body { padding: 12px 14px; }

  #map { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  svg { width: 100%; height: 100%; display: block; }
  .link { stroke: #4a3f36; stroke-width: .5; }
  .link.front { stroke: var(--gold); stroke-width: 1.1; stroke-dasharray: 2 1.4; }
  .node circle { stroke: #0d0a08; stroke-width: .7; cursor: pointer; }
  .node text { font-size: 2.6px; fill: var(--ink); text-anchor: middle; pointer-events: none; }
  .node text.sub { font-size: 2.1px; fill: var(--dim); }
  .node.hq circle { stroke: var(--gold); stroke-width: 1; }
  .node.contested circle { stroke: var(--gold); stroke-width: 1.2; }

  .front { border-top: 1px solid var(--line); padding: 11px 14px; }
  .front:first-child { border-top: none; }
  .front .name { font-weight: 600; letter-spacing: .05em; }
  .front .meta { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .front .row { display: flex; align-items: center; gap: 10px; }
  .front .row .grow { flex: 1; min-width: 0; }

  .pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 6px; }
  .pip { width: 16px; height: 5px; background: #3a3029; border-radius: 1px; }
  .pip.done { background: var(--gold); }

  button {
    font: inherit; color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 7px 14px; cursor: pointer; letter-spacing: .08em;
  }
  button:hover:not(:disabled) { background: #33291f; border-color: var(--gold); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    background: var(--gold); color: #1a1206; border-color: var(--gold); font-weight: 700;
  }
  button.primary:hover:not(:disabled) { background: #edb44a; }
  button.big { width: 100%; padding: 13px; font-size: 16px; letter-spacing: .22em; }

  input, select {
    font: inherit; color: var(--ink); background: #120e0c;
    border: 1px solid var(--line); border-radius: 2px; padding: 6px 8px; width: 100%;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin: 0 0 3px; letter-spacing: .1em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .full { grid-column: 1 / -1; }

  .side-RED { color: var(--red); font-weight: 700; }
  .side-BLU { color: var(--blu); font-weight: 700; }
  .side-NONE { color: var(--neutral); }

  #feed { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 80px; }
  #feed .line { padding: 5px 14px; border-bottom: 1px solid #241e19; font-size: 13px; display: flex; gap: 9px; }
  #feed .line time { color: var(--dim); font-variant-numeric: tabular-nums; }
  #feed .line.capture { color: var(--gold); }
  #feed .line.campaign { color: var(--ok); }

  #banner {
    padding: 12px 14px; border: 1px solid var(--gold); background: #2b2113;
    border-radius: 3px; margin-bottom: 14px; display: none;
  }
  #banner.show { display: block; }
  #banner .headline { font-size: 17px; color: var(--gold); font-weight: 700; }

  .status { display: flex; gap: 14px; font-size: 12px; color: var(--dim); padding: 8px 22px; border-top: 1px solid var(--line); background: #100d0b; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6b3030; margin-right: 5px; }
  .dot.on { background: var(--ok); }
  .muted { color: var(--dim); }
  /* Ground held into the next stage of an offensive, or lost out of it. */
  .gained { color: var(--ok); }
  .pushed { color: #d9705c; }
  .mono { font-family: "Consolas", "Menlo", monospace; }
  .err { color: #d9705c; }
  .hidden { display: none !important; }
  .diag { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; font-size: 12px; }
  .diag .key { color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .diag .value { min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    header { align-items: center; flex-wrap: wrap; }
    header .spacer { display: none; }
    main { display: block; }
    .left { min-height: 55vh; }
    .right { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<header>
  <h1>GREYLINE FRONTRESS</h1>
  <span class="campaign" id="campaign">—</span>
  <span class="spacer"></span>
  <span class="stat">theater <b id="theater">—</b></span>
  <span class="stat">online <b id="population">0</b></span>
  <span class="stat">servers <b id="servers">0/0</b></span>
  <span class="stat">rev <b id="revision">0</b></span>
  <nav class="menu-actions">
    <button data-menu-action="resume">RESUME</button>
    <button data-menu-action="loadout">LOADOUT</button>
    <button data-menu-action="armory">ARMORY</button>
    <button data-menu-action="settings">TC2 SETTINGS</button>
    <button data-menu-action="legacy_settings">LEGACY SETTINGS</button>
    <button data-menu-action="servers">SERVERS</button>
    <button data-menu-action="disconnect">DISCONNECT</button>
    <button data-menu-action="quit">QUIT</button>
  </nav>
</header>

<main>
  <div class="left">
    <div id="banner">
      <div class="headline" id="bannerHeadline"></div>
      <div class="muted" id="bannerDetail"></div>
    </div>
    <div id="map">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <g id="links"></g>
        <g id="nodes"></g>
      </svg>
    </div>
  </div>

  <div class="right">
    <div class="card" style="margin: 14px 14px 0;">
      <h2>Deploy</h2>
      <div class="body">
        <button class="primary big" id="deployBtn" disabled>DEPLOY</button>
        <div class="muted" id="deployHint" style="margin-top: 8px; font-size: 13px;">
          not connected to a coordinator
        </div>
      </div>
    </div>

    <div class="card" id="battleCard" style="margin: 14px 14px 0; display: none;">
      <h2>Your battle</h2>
      <div class="body">
        <div id="battleWhat" style="font-weight: 600;"></div>
        <div class="muted" id="battleWhy" style="margin: 4px 0 10px;"></div>
        <div class="mono muted" id="battleWhere" style="font-size: 13px;"></div>
        <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="primary" id="joinBtn" disabled>JOIN BATTLE</button>
          <button id="leaveBtn">LEAVE</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin: 14px 14px 0;">
      <h2>System status</h2>
      <div class="body diag">
        <span class="key">Steam</span><span class="value" id="diagSteam">not checked</span>
        <span class="key">Auth</span><span class="value" id="diagAuth">offline</span>
        <span class="key">Queue</span><span class="value" id="diagQueue">not deployed</span>
        <span class="key">Battle</span><span class="value" id="diagBattle">none</span>
        <span class="key">Game</span><span class="value" id="diagGame">main menu</span>
        <span class="key">P2P host</span><span class="value" id="diagHost">idle</span>
      </div>
    </div>

    <div class="card" id="frontsCard" style="margin: 14px 14px 0;">
      <h2>Active fronts</h2>
      <div id="fronts"></div>
    </div>

    <div class="card" style="margin: 14px 14px 0; flex: 1; display: flex; flex-direction: column; min-height: 120px;">
      <h2>War log</h2>
      <div id="feed"></div>
    </div>

    <div class="card" style="margin: 14px;">
      <h2>Test settings</h2>
      <div class="body">
        <div class="grid">
          <div class="full">
            <label for="gcUrl">Coordinator</label>
            <input id="gcUrl" placeholder="http://127.0.0.1:27100">
          </div>
          <div class="full">
            <label for="steamId">SteamID64 (read from Steam in game)</label>
            <input id="steamId" placeholder="76561198000000000">
          </div>
          <div>
            <label for="playerName">Name</label>
            <input id="playerName" placeholder="mercenary">
          </div>
          <div>
            <label for="sidePick">Allegiance</label>
            <select id="sidePick">
              <option value="RED">RED</option>
              <option value="BLU">BLU</option>
            </select>
          </div>
          <div>
            <label for="p2pUpload">P2P upload kbps (test)</label>
            <input id="p2pUpload" inputmode="numeric" placeholder="10000">
          </div>
          <div>
            <label for="p2pSlots">P2P max players</label>
            <input id="p2pSlots" inputmode="numeric" placeholder="12">
          </div>
          <div class="full" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <button id="connectBtn">CONNECT</button>
            <button id="steamIdBtn">USE STEAM ID</button>
            <label style="text-transform: none; letter-spacing: 0; margin: 0; display: flex; align-items: center; gap: 6px;">
              <input type="checkbox" id="autoJoin" style="width: auto;" checked> auto-join
            </label>
            <label style="text-transform: none; letter-spacing: 0; margin: 0; display: flex; align-items: center; gap: 6px;">
              <input type="checkbox" id="p2pHost" style="width: auto;" checked> allow P2P hosting
            </label>
          </div>
        </div>
        <div id="settingsError" class="err" style="margin-top: 8px; font-size: 13px;"></div>
      </div>
    </div>
  </div>
</main>

<div class="status">
  <span><span class="dot" id="dotGC"></span>coordinator</span>
  <span><span class="dot" id="dotGame"></span>game bridge</span>
  <span class="mono" id="statusText">idle</span>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// The game bridge.
//
// The main menu is a web panel, and the game exposes a small JSON-RPC over a
// websocket on the same origin: {"i":id,"m":method,"p":params} in, {"i":id,
// "r":value} back. Two methods matter here — "cmd" to drive the console, and
// "fetch" to make an HTTP request through Steam, which is what lets this page
// talk to a coordinator on another host without a word about CORS.
//
// The game serves this page itself, so the socket lives at the same origin —
// no second server, no second port to keep in step with the one the panel was
// loaded from.
//
// Outside the game the socket simply never opens and everything falls back to
// the browser, which is how this page is usable during development.
// ---------------------------------------------------------------------------
const Bridge = {
  ws: null,
  ready: false,
  nextId: 1,
  pending: new Map(),

  connect() {
    try {
      // Same origin as the page when the game served it; the loopback
      // default only ever applies to a copy opened straight off disk.
      const host = location.protocol.startsWith("http") ? location.host : "127.0.0.1:58270";
      this.ws = new WebSocket("ws://" + host + "/ws");
    } catch (e) {
      return;
    }
    this.ws.onopen = () => { this.ready = true; UI.setDot("dotGame", true); };
    this.ws.onclose = () => {
      this.ready = false;
      UI.setDot("dotGame", false);
      for (const waiter of this.pending.values()) waiter.reject(new Error("game bridge disconnected"));
      this.pending.clear();
      // The panel outlives a reconnect; keep trying quietly.
      setTimeout(() => this.connect(), 3000);
    };
    this.ws.onerror = () => { this.ready = false; UI.setDot("dotGame", false); };
    this.ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.i === undefined) return;
      const waiter = this.pending.get(msg.i);
      if (!waiter) return;
      this.pending.delete(msg.i);
      waiter.resolve(msg.r === undefined ? "" : msg.r);
    };
  },

  call(method, params) {
    return new Promise((resolve, reject) => {
      if (!this.ready) { reject(new Error("game bridge is not connected")); return; }
      const id = this.nextId++;
      this.pending.set(id, { resolve, reject });
      // A reply that never comes must not leak a pending promise forever.
      setTimeout(() => {
        if (this.pending.has(id)) { this.pending.delete(id); reject(new Error(method + " timed out")); }
      }, 30000);
      this.ws.send(JSON.stringify({ i: id, m: method, p: params === undefined ? "" : String(params) }));
    });
  },

  // The console rejects anything with a semicolon, so commands go one at a time.
  async cmd(line) {
    const raw = await this.call("cmd", line);
    let reply = null;
    try { reply = JSON.parse(raw); } catch (e) { return raw; }
    if (reply && reply.ok === false) throw new Error(line.split(" ")[0] + ": " + (reply.error || "rejected"));
    return raw;
  },

  async waitReady(timeoutMs) {
    const deadline = Date.now() + (timeoutMs || 0);
    while (!this.ready && Date.now() < deadline) {
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    return this.ready;
  },
};

// ---------------------------------------------------------------------------
// Talking to the coordinator
// ---------------------------------------------------------------------------
const GC = {
  base: "",
  token: "",

  async request(method, path, body, useToken, extraHeaders) {
    const url = this.base.replace(/\/+$/, "") + path;
    const headers = { "Content-Type": "application/json" };
    if (useToken && this.token) headers["Authorization"] = "Bearer " + this.token;
    Object.assign(headers, extraHeaders || {});

    if (Bridge.ready) {
      const raw = await Bridge.call("fetch", JSON.stringify({
        url: url, method: method, headers: headers,
        body: body === undefined ? undefined : JSON.stringify(body),
      }));
      // "<status> <body>"
      const sp = raw.indexOf(" ");
      const status = parseInt(sp < 0 ? raw : raw.slice(0, sp), 10) || 0;
      const text = sp < 0 ? "" : raw.slice(sp + 1);
      return this.finish(status, text, path);
    }

    const resp = await fetch(url, {
      method: method, headers: headers,
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    return this.finish(resp.status, await resp.text(), path);
  },

  finish(status, text, path) {
    let parsed = null;
    if (text) { try { parsed = JSON.parse(text); } catch (e) { /* not JSON */ } }
    if (status < 200 || status >= 300) {
      const message = (parsed && parsed.error) || text || ("HTTP " + status);
      const err = new Error(message);
      err.status = status;
      err.path = path;
      throw err;
    }
    return parsed;
  },

  get(path, useToken) { return this.request("GET", path, undefined, useToken); },
  post(path, body, useToken) { return this.request("POST", path, body || {}, useToken); },

  serverHeaders(host) {
    return {
      "Authorization": "Bearer " + host.serverToken,
      "X-Greyline-Server": host.serverId,
    };
  },
  serverGet(host, path) {
    return this.request("GET", path, undefined, false, this.serverHeaders(host));
  },
  serverPost(host, path, body) {
    return this.request("POST", path, body || {}, false, this.serverHeaders(host));
  },
};

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const State = {
  settings: {
    gc: "http://127.0.0.1:27100",
    steamId: "",
    name: "mercenary",
    side: "RED",
    autoJoin: true,
    p2pHost: true,
    p2pUploadKbps: 10000,
    p2pMaxPlayers: 12,
  },
  connected: false,
  seq: 0,
  timelineSeq: 0,
  world: null,
  fronts: [],
  match: null,
  queue: null,
  identity: null,
  authMode: "offline",
  polling: false,

  load() {
    try {
      const raw = localStorage.getItem("greyline.settings");
      if (raw) Object.assign(this.settings, JSON.parse(raw));
    } catch (e) { /* first run */ }
  },
  save() {
    try { localStorage.setItem("greyline.settings", JSON.stringify(this.settings)); } catch (e) {}
  },
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const UI = {
  el(id) { return document.getElementById(id); },

  setDot(id, on) { this.el(id).classList.toggle("on", !!on); },

  status(text, isError) {
    const el = this.el("statusText");
    el.textContent = text;
    el.classList.toggle("err", !!isError);
  },

  sideSpan(side) {
    return '<span class="side-' + (side || "NONE") + '">' + (side || "NONE") + "</span>";
  },

  colourOf(side) {
    if (side === "RED") return "#b8383b";
    if (side === "BLU") return "#5885a2";
    return "#6b6259";
  },

  renderHeader(status) {
    this.el("campaign").textContent =
      status.campaign.name + (status.campaign.status === "ACTIVE" ? "" : " — " + status.campaign.status);
    this.el("theater").textContent = status.theater.name;
    this.el("population").textContent = status.population;
    this.el("servers").textContent = status.servers.free + "/" + status.servers.total;
    this.el("revision").textContent = status.world_revision;
  },

  // The map is drawn straight from the world snapshot: the theater ships x/y
  // for exactly this, so a client needs one document and no layout of its own.
  renderMap(world) {
    const nodes = world.nodes;
    const byId = {};
    nodes.forEach(n => byId[n.id] = n);

    const frontPairs = {};
    (world.fronts || []).forEach(f => {
      frontPairs[f.source_node + "|" + f.target_node] = true;
      frontPairs[f.target_node + "|" + f.source_node] = true;
    });

    let links = "";
    const drawn = {};
    nodes.forEach(n => {
      (n.adjacent || []).forEach(other => {
        const key = [n.id, other].sort().join("|");
        if (drawn[key]) return;
        drawn[key] = true;
        const b = byId[other];
        if (!b) return;
        const isFront = frontPairs[n.id + "|" + other];
        links += '<line class="link' + (isFront ? " front" : "") + '" x1="' + n.x +
                 '" y1="' + n.y + '" x2="' + b.x + '" y2="' + b.y + '"></line>';
      });
    });
    this.el("links").innerHTML = links;

    let markers = "";
    nodes.forEach(n => {
      const classes = ["node"];
      if (n.hq && n.hq !== "NONE") classes.push("hq");
      if (n.contested) classes.push("contested");
      const r = (n.hq && n.hq !== "NONE") ? 4.2 : 3.4;
      markers += '<g class="' + classes.join(" ") + '">' +
        '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" fill="' + this.colourOf(n.owner) + '"></circle>' +
        '<text x="' + n.x + '" y="' + (n.y + r + 3.2) + '">' + this.escape(n.name.toUpperCase()) + '</text>' +
        (n.contested
          ? '<text class="sub" x="' + n.x + '" y="' + (n.y + r + 6) + '">CONTESTED</text>'
          : "") +
        "</g>";
    });
    this.el("nodes").innerHTML = markers;
  },

  renderFronts(fronts, queued) {
    const host = this.el("fronts");
    if (!fronts.length) {
      host.innerHTML = '<div class="front muted">No active front. The war is between offensives.</div>';
      return;
    }
    host.innerHTML = fronts.map(f => {
      const total = (f.plan || []).length;
      let pips = "";
      for (let i = 0; i < total; i++) pips += '<span class="pip' + (i < f.stage ? " done" : "") + '"></span>';
      const stageName = (f.plan && f.plan[Math.min(f.stage, total - 1)]) || "";
      return '<div class="front">' +
        '<div class="row">' +
          '<div class="grow">' +
            '<div class="name">' + this.escape(f.name) + "</div>" +
            '<div class="meta">' + this.sideSpan(f.attacker) + " on the offensive · " +
              this.escape(stageName.toUpperCase()) + " " + (f.stage + 1) + "/" + total +
              '<span class="pips">' + pips + "</span>" + this.groundHeld(f.push) + "</div>" +
            '<div class="meta">' + (f.players_fighting || 0) + " fighting · " +
              (f.queued || 0) + " queued</div>" +
          "</div>" +
          '<button data-front="' + this.escape(f.id) + '"' + (queued ? " disabled" : "") + ">DEPLOY</button>" +
        "</div></div>";
    }).join("");

    host.querySelectorAll("button[data-front]").forEach(btn => {
      btn.onclick = () => Actions.deploy(btn.getAttribute("data-front"));
    });
  },

  // How far into the current stage an offensive has fought. A battle is worth
  // its size, so most battles move a fraction of a stage rather than a whole
  // one — without this the map would sit on the same stage for four battles
  // with nothing to show that anything happened.
  groundHeld(push) {
    const p = Number(push || 0);
    if (!p) return "";
    const pct = Math.round(Math.abs(p) * 100);
    if (!pct) return "";
    return p > 0
      ? ' <span class="gained">+' + pct + "% into the next</span>"
      : ' <span class="pushed">−' + pct + "% pushed back</span>";
  },

  renderQueue(queue) {
    const btn = this.el("deployBtn");
    const hint = this.el("deployHint");
    if (!State.connected) {
      btn.disabled = true;
      btn.textContent = "DEPLOY";
      hint.textContent = "not connected to a coordinator";
      this.el("diagQueue").textContent = "not deployed";
      return;
    }
    btn.disabled = false;
    if (queue && queue.queued) {
      btn.textContent = "CANCEL";
      btn.classList.remove("primary");
      hint.textContent = queue.message + " · " + queue.front_name +
        " · waited " + queue.waited_s + "s";
      this.el("diagQueue").textContent = "#" + (queue.position || "?") + " · needs " +
        (queue.players_needed || 0) + " · " + (queue.players_in_queue || 0) + " queued";
    } else {
      btn.textContent = "DEPLOY";
      btn.classList.add("primary");
      hint.textContent = "the coordinator picks the front that needs you";
      this.el("diagQueue").textContent = "ready to deploy";
    }
  },

  renderMatch(match) {
    const card = this.el("battleCard");
    if (!match) {
      card.style.display = "none";
      this.el("diagBattle").textContent = "none";
      return;
    }
    card.style.display = "";

    this.el("battleWhat").innerHTML =
      this.escape(match.front_name) + " — " +
      this.escape(String(match.stage_kind).toUpperCase()) + " " + match.stage + "/" + match.stage_count +
      " · " + this.escape(match.map);

    let why = match.reason || "";
    if (match.side && match.team && match.side !== match.team) {
      // The thing a player would otherwise think is a bug. Payload and
      // attack/defend maps are built for BLU to attack and cannot be changed,
      // so the attacking side wears BLU in every battle — a rule, not a
      // surprise. The war still counts the result for the side they fight for.
      why += " — you fight for " + match.side + ", in " + match.team +
             " colours: the attacking side always wears " + match.team + ".";
    }
    if (match.contract) why += " (mercenary contract)";
    this.el("battleWhy").innerHTML = this.escape(why);

    const where = match.connect
      ? match.connect + (match.password ? "  password " + match.password : "")
      : "waiting for the battle server…";
    this.el("battleWhere").textContent = where;
    const hostingHere = !!(match.is_host && P2P.host && P2P.host.matchId === match.match_id);
    this.el("joinBtn").disabled = !match.connect && !hostingHere;
    this.el("joinBtn").textContent = hostingHere ? "HOSTING" : "JOIN BATTLE";
    this.el("diagBattle").textContent = match.state + " · " + match.map + " · " +
      match.red_players + " RED / " + match.blu_players + " BLU";
  },

  renderIdentity(identity) {
    const text = identity && identity.available
      ? identity.steam_id + (identity.ticket ? " · ticket ready" : " · no auth ticket")
      : (Bridge.ready ? "Steam is not logged on" : "browser dev mode: manual ID");
    this.el("diagSteam").textContent = text;
  },

  renderGame(state) {
    if (!state) return;
    const level = String(state.level || "").replace(/\\/g, "/").split("/").pop().replace(/\.bsp$/i, "");
    this.el("diagGame").textContent = state.background ? "main menu background" :
      (state.connected ? (level + " · " + (state.players || 0) + " players") : "main menu");
  },

  banner(headline, detail) {
    this.el("bannerHeadline").textContent = headline;
    this.el("bannerDetail").textContent = detail || "";
    this.el("banner").classList.add("show");
  },

  feed(events) {
    const host = this.el("feed");
    events.forEach(ev => {
      const line = document.createElement("div");
      line.className = "line";
      if (ev.kind === "node_captured") line.className += " capture";
      if (ev.kind === "campaign_started" || ev.kind === "campaign_ended") line.className += " campaign";
      const at = (ev.at || "").slice(11, 19);
      line.innerHTML = "<time>" + at + "</time><span>" + this.escape(ev.headline || ev.kind) + "</span>";
      host.appendChild(line);
    });
    while (host.childNodes.length > 200) host.removeChild(host.firstChild);
    host.scrollTop = host.scrollHeight;
  },

  escape(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  },
};

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
const Actions = {
  async useSteamIdentity(showError) {
    if (!Bridge.ready) {
      if (showError) UI.el("settingsError").textContent = "Steam identity is only available inside the game";
      return null;
    }
    try {
      const identity = P2P.parseBridgeJSON(await Bridge.call("greyline_identity", ""));
      State.identity = identity;
      UI.renderIdentity(identity);
      if (!identity.available || !/^\d{17}$/.test(String(identity.steam_id || ""))) {
        throw new Error("Steam is offline or returned no valid SteamID64");
      }
      UI.el("steamId").value = String(identity.steam_id);
      UI.el("steamId").readOnly = true;
      return identity;
    } catch (e) {
      if (showError) UI.el("settingsError").textContent = e.message;
      return null;
    }
  },

  async menuAction(action) {
    if (!Bridge.ready) {
      UI.status("this menu action is only available inside the game", true);
      return;
    }
    try {
      const reply = P2P.parseBridgeJSON(await Bridge.call("greyline_menu_action", action));
      if (reply.ok === false) throw new Error(reply.error || "action rejected");
    } catch (e) {
      UI.status("menu action failed: " + e.message, true);
    }
  },

  async connect() {
    if (Bridge.ready) await this.useSteamIdentity(false);
    const s = State.settings;
    s.gc = UI.el("gcUrl").value.trim() || "http://127.0.0.1:27100";
    s.steamId = UI.el("steamId").value.trim();
    s.name = UI.el("playerName").value.trim() || "mercenary";
    s.side = UI.el("sidePick").value;
    s.autoJoin = UI.el("autoJoin").checked;
    s.p2pHost = UI.el("p2pHost").checked;
    s.p2pUploadKbps = Math.max(0, parseInt(UI.el("p2pUpload").value || "0", 10) || 0);
    s.p2pMaxPlayers = Math.max(2, parseInt(UI.el("p2pSlots").value || "12", 10) || 12);
    State.save();
    UI.el("settingsError").textContent = "";

    if (!/^\d{17}$/.test(s.steamId)) {
      UI.el("settingsError").textContent =
        "SteamID64 must be 17 digits. In game press USE STEAM ID; manual IDs are only for browser dev mode.";
      return;
    }

    GC.base = s.gc;
    try {
      // A P2P host has to be able to drive the local listen server. Give the
      // loopback bridge a moment to connect before saying hello so a saved
      // auto-connect does not accidentally advertise this machine as unable
      // to host just because CEF won a startup race.
      if (s.p2pHost) await Bridge.waitReady(2500);
      const canHost = !!(s.p2pHost && Bridge.ready);
      const cores = Math.max(1, navigator.hardwareConcurrency || 4);
      const memoryMB = Math.max(2048, Math.round((navigator.deviceMemory || 8) * 1024));
      const reply = await GC.post("/api/v1/client/hello", {
        steam_id: s.steamId,
        ticket: State.identity && State.identity.steam_id === s.steamId ? (State.identity.ticket || "") : "",
        name: s.name,
        side: s.side,
        client_version: "greyline-test-ui",
        protocol_version: 2,
        host_capable: canHost,
        upload_kbps: canHost ? s.p2pUploadKbps : 0,
        cpu_score: canHost ? Math.max(40, Math.min(100, cores * 10)) : 0,
        memory_mb: canHost ? memoryMB : 0,
        max_host_slots: canHost ? s.p2pMaxPlayers : 0,
      });
      GC.token = reply.token;
      State.connected = true;
      State.seq = 0;
      State.authMode = reply.auth_mode || "unknown";
      UI.setDot("dotGC", true);
      UI.status("connected as " + s.name + " (" + s.side + ")");
      UI.el("diagAuth").textContent = State.authMode + " · coordinator accepted " + reply.player.steam_id;
      if (reply.mercenary_contract) {
        UI.banner(reply.mercenary_contract.message,
          "Tick DEPLOY and the coordinator may put you on that side for one battle.");
      }
      await Promise.all([Loop.refreshWorld(), Loop.refreshSelf()]);
      Loop.start();
    } catch (e) {
      State.connected = false;
      State.authMode = "offline";
      UI.setDot("dotGC", false);
      UI.el("settingsError").textContent = "could not reach the coordinator: " + e.message;
      UI.status("not connected", true);
    }
    UI.renderQueue(State.queue);
  },

  async deploy(frontId) {
    if (!State.connected) return;
    try {
      if (State.queue && State.queue.queued && !frontId) {
        await GC.post("/api/v1/client/cancel", {}, true);
        State.queue = null;
        UI.renderQueue(null);
        UI.status("deployment cancelled");
        return;
      }
      const reply = await GC.post("/api/v1/client/deploy", {
        front_id: frontId || "",
        accept_contract: true,
      }, true);
      State.queue = reply.queue;
      UI.renderQueue(State.queue);
      UI.status("deployed: " + (reply.queue.front_name || "searching"));
    } catch (e) {
      UI.status(e.message, true);
    }
  },

  // Joining is the one thing that needs the game itself. In a browser there is
  // nothing to drive, so the console line is shown to copy instead.
  joinWatch: null,

  async join() {
    const m = State.match;
    if (!m) return;
    if (m.is_host && P2P.host && P2P.host.matchId === m.match_id) {
      UI.status("you are hosting this P2P battle locally");
      return;
    }
    if (!m.connect) return;
    if (!Bridge.ready) {
      UI.status("no game bridge — run: password " + (m.password || "") + " ; connect " + m.connect);
      return;
    }
    try {
      await this.attemptConnect(m);
      this.watchJoin(m);
    } catch (e) {
      UI.status("could not drive the console: " + e.message, true);
    }
  },

  async attemptConnect(m) {
    if (m.password) await Bridge.cmd("password " + P2P.quote(m.password));
    await Bridge.cmd("connect " + P2P.cleanConsole(m.connect));
    UI.status("joining " + m.connect);
  },

  // A connect that does not take is the failure mode this whole design is
  // most exposed to: over Steam's peer-to-peer transport the handshake can be
  // dropped while the relay is still settling ("did not have the correct
  // challenge"), and nothing about that tells the player anything. One quiet
  // retry costs a few seconds; not retrying costs the battle.
  watchJoin(m) {
    if (this.joinWatch) clearInterval(this.joinWatch);
    let attempts = 1;
    const startedAt = Date.now();
    const deadline = startedAt + Math.max(30000, (m.deadline_s || 60) * 1000);

    this.joinWatch = setInterval(async () => {
      const current = State.match;
      if (!current || current.match_id !== m.match_id || !Bridge.ready) {
        clearInterval(this.joinWatch);
        this.joinWatch = null;
        return;
      }
      let state;
      try {
        state = P2P.parseBridgeJSON(await Bridge.call("greyline_state", ""));
      } catch (e) {
        return; // mid-load the bridge does not answer; that is progress, not failure
      }
      UI.renderGame(state);
      const level = String(state.level || "").replace(/\\/g, "/").split("/").pop().replace(/\.bsp$/i, "");
      if (state.connected && level.toLowerCase() === String(m.map || "").toLowerCase()) {
        clearInterval(this.joinWatch);
        this.joinWatch = null;
        UI.status("in the battle at " + m.connect);
        return;
      }
      if (Date.now() > deadline) {
        clearInterval(this.joinWatch);
        this.joinWatch = null;
        UI.status("could not reach the battle server at " + m.connect +
          " after " + attempts + " attempts — leaving the battle", true);
        // Holding a slot in a battle this client cannot reach helps nobody,
        // and it is what makes DEPLOY come back "already in a battle" for as
        // long as the battle lasts. Give the slot up and go back to the map,
        // and tell the coordinator which of the two it was.
        this.leave("could not reach " + m.connect + " after " + attempts + " attempts");
        return;
      }
      attempts++;
      UI.status("still not in — retrying " + m.connect + " (attempt " + attempts + ")");
      try { await this.attemptConnect(m); } catch (e) { /* reported by the next tick */ }
    }, 8000);
  },

  async leave(reason) {
    if (!State.connected) return;
    const why = reason || "left from the menu";
    if (P2P.host && State.match && P2P.host.matchId === State.match.match_id) {
      // Leaving while hosting ends the battle for everybody on it, so say
      // which of the two happened rather than letting the coordinator guess.
      await P2P.failHost("the host " + why);
    }
    try {
      await GC.post("/api/v1/client/leave", { reason: why }, true);
    } catch (e) { /* nothing to leave */ }
    State.match = null;
    UI.renderMatch(null);
  },
};

// ---------------------------------------------------------------------------
// P2P host lifecycle
// ---------------------------------------------------------------------------
const P2P = {
  host: null,
  heartbeatTimer: null,
  gameWatchTimer: null,
  commandWatch: false,
  watchBusy: false,

  sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); },

  cleanConsole(value) {
    return String(value === undefined || value === null ? "" : value)
      .replace(/[\r\n;]/g, " ");
  },

  quote(value) {
    return '"' + this.cleanConsole(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  },

  parseBridgeJSON(raw) {
    try { return JSON.parse(raw || "{}"); } catch (e) { return {}; }
  },

  async acceptHost(offer) {
    if (!offer || !offer.match_id || this.host) return;
    if (!State.settings.p2pHost || !Bridge.ready) {
      UI.status("P2P host offer ignored: local game bridge is unavailable", true);
      return;
    }

    try {
      UI.status("accepting P2P host for " + offer.map + "…");
      const reg = await GC.post("/api/v1/client/host-register", {
        match_id: offer.match_id,
        name: State.settings.name + " P2P",
        capacity: Math.max(offer.max_players || 0, State.settings.p2pMaxPlayers || 0),
        game_version: "greyline-test-ui",
      }, true);

      this.host = {
        matchId: offer.match_id,
        map: offer.map,
        serverId: reg.server_id,
        serverToken: reg.server_token,
        assignment: null,
        startedAt: Date.now(),
        baselineGameOverSeq: 0,
        resultReported: false,
        ready: false,
      };
      UI.el("diagHost").textContent = "accepted · waiting for assignment";
      this.startHeartbeat();

      // ConfirmHost puts the assignment straight into this one-battle server's
      // command mailbox, so the first poll should return immediately.
      const cmd = await GC.serverGet(this.host, "/api/v1/servers/poll?wait=1");
      if (!cmd || cmd.type !== "assign" || !cmd.assignment) {
        throw new Error("coordinator registered this host but sent no assignment");
      }
      this.host.assignment = cmd.assignment;
      UI.el("diagHost").textContent = "booting " + cmd.assignment.map;
      await this.launch(cmd.assignment);
    } catch (e) {
      UI.status("P2P host failed: " + e.message, true);
      await this.failHost(e.message);
    }
  },

  startHeartbeat() {
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
    const beat = async () => {
      const h = this.host;
      if (!h) return;
      try {
        await GC.serverPost(h, "/api/v1/servers/heartbeat", {
          status: h.ready ? "live" : "booting",
          match_id: h.matchId,
          map: h.map || "",
          players: await this.playerCount(),
        });
      } catch (e) {
        UI.status("P2P heartbeat failed: " + e.message, true);
      }
    };
    beat();
    this.heartbeatTimer = setInterval(beat, 5000);
  },

  // How many people are actually on this server. The war map shows this
  // number, and the roster size — which is what it used to show — is a
  // different thing: a battle four people were sent to is not a battle four
  // people are in, and while everyone is still loading the difference is the
  // only interesting part.
  async playerCount() {
    if (!Bridge.ready) return 0;
    try {
      const state = this.parseBridgeJSON(await Bridge.call("greyline_state", ""));
      UI.renderGame(state);
      return Math.max(0, Number(state.players || 0));
    } catch (e) {
      // Mid map load the bridge does not answer; it will next beat.
      return 0;
    }
  },

  // A battle is not sealed when it starts: the coordinator sends latecomers
  // to it while it runs, and tells this host who they are over the same
  // command channel the assignment arrived on. Without applying those the
  // server would meet a player it has never heard of and put them wherever
  // its own team balance felt like.
  startCommandWatch() {
    if (this.commandWatch) return;
    this.commandWatch = true;
    const loop = async () => {
      while (this.host && this.commandWatch) {
        const h = this.host;
        try {
          const cmd = await GC.serverGet(h, "/api/v1/servers/poll?wait=15");
          if (this.host !== h) break;
          await this.applyCommand(cmd);
        } catch (e) {
          // A dropped poll is not a dropped battle; the heartbeat is what
          // decides whether this host is still there.
          await this.sleep(2000);
        }
      }
      this.commandWatch = false;
    };
    loop();
  },

  async applyCommand(cmd) {
    if (!cmd || !cmd.type || !this.host) return;
    if (cmd.type === "roster") {
      const entries = cmd.roster || [];
      for (const e of entries) {
        await Bridge.cmd("greyline_roster_add " + e.steam_id + " " +
          String(e.team || "").toUpperCase() + " " +
          String(e.side || "").toUpperCase() + " " + (e.contract ? 1 : 0));
      }
      if (entries.length) {
        if (this.host.assignment && this.host.assignment.roster) {
          this.host.assignment.roster.push(...entries);
        }
        UI.status(entries.length + " more " +
          (entries.length === 1 ? "mercenary joined" : "mercenaries joined") + " this battle");
      }
      return;
    }
    if (cmd.type === "abort") {
      UI.status("coordinator ended this battle: " + (cmd.reason || "aborted"), true);
      await this.finishHost(cmd.match_id);
    }
  },

  modeRules(mode) {
    const rules = [
      "mp_windifference 0",
      "mp_winlimit 0",
      "mp_maxrounds 0",
      "mp_timelimit 0",
      "tf_arena_use_queue 0",
    ];
    switch (String(mode || "").toLowerCase()) {
      case "5cp": return rules.concat(["mp_winlimit 3", "mp_timelimit 30"]);
      case "koth": return rules.concat(["mp_winlimit 2", "mp_timelimit 30"]);
      case "arena": return rules.concat(["mp_winlimit 3"]);
      case "payload": case "attack_defend": case "ad":
        return rules.concat(["mp_maxrounds 1"]);
      case "ctf": return rules.concat(["mp_winlimit 3", "mp_timelimit 30"]);
      default: return rules.concat(["mp_winlimit 3", "mp_timelimit 30"]);
    }
  },

  battleCommands(as) {
    const b = as.briefing || {};
    const cmds = [
      "sv_password " + this.quote(as.password || ""),
      "mp_autoteambalance 0",
      "mp_teams_unbalance_limit 0",
      "sv_pausable 0",
      "mp_forcecamera 0",
      "mp_tournament 0",
      "sv_allow_votes 0",
      "sv_allow_server_adverisement_to_master_server 0",
      "mp_chattime 15",
      "nextlevel " + this.cleanConsole(as.map),
      // Turn people away for not being on the roster only when the roster names
      // accounts this server will actually see. Under the coordinator's dev
      // auth a client states whichever SteamID it likes, so the roster can be
      // full of accounts that never turn up and refusing strangers would
      // refuse everybody. The battle password is the gate until then.
      "greyline_roster_gate " + (as.verified_identities ? 1 : 0),
      "greyline_roster_clear",
      "greyline_battle_id " + this.quote(as.match_id),
      "greyline_front_id " + this.quote(b.front_id),
      "greyline_front_name " + this.quote(b.front_name),
      "greyline_node_id " + this.quote(b.node_id),
      "greyline_node_name " + this.quote(b.node_name),
      "greyline_campaign " + this.quote(b.campaign),
      "greyline_attacker " + this.quote(b.attacker),
      "greyline_defender " + this.quote(b.defender),
      "greyline_stage " + (b.stage || 0),
      "greyline_stage_count " + (b.stage_count || 0),
      "greyline_stage_kind " + this.quote(b.stage_kind),
      "greyline_mobilized " + this.quote(b.mobilized || ""),
      // Hold the round until the roster is actually on the server, instead of
      // starting the battle around whoever loaded the map fastest.
      "greyline_min_players " + Math.max(0, parseInt(as.min_players, 10) || 0),
      "greyline_muster_timeout " + Math.max(15, parseInt(as.muster_timeout_s, 10) || 90),
    ];
    (as.roster || []).forEach(entry => {
      cmds.push("greyline_roster_add " + entry.steam_id + " " +
        String(entry.team || "").toUpperCase() + " " +
        String(entry.side || "").toUpperCase() + " " + (entry.contract ? 1 : 0));
    });
    return cmds.concat(this.modeRules(as.mode));
  },

  async launch(as) {
    if (!this.host) return;
    const before = this.parseBridgeJSON(await Bridge.call("greyline_state", ""));
    this.host.baselineGameOverSeq = Number(before.game_over_seq || 0);

    // A listen server does not exist yet, unlike the dedicated agent's srcds.
    // Set the engine-level knobs first, then `map` creates the server. The
    // Greyline server commands are deliberately applied *after* the map is up:
    // on builds that load server.dll lazily those commands do not exist in the
    // main menu yet, and silently typing them before `map` would leave the
    // roster/password unset.
    await Bridge.cmd("sv_lan 0");
    await Bridge.cmd("sv_password " + this.quote(as.password || ""));
    await Bridge.cmd("sv_allow_server_adverisement_to_master_server 0");
    // Who may join this battle is the coordinator's roster and its password,
    // not the host's Steam friend list. Set here rather than assumed: a
    // listen server left on friends-only refuses every mercenary the war sent
    // who does not happen to know the host, and says only "You are not
    // permitted to join this server!" about it.
    await Bridge.cmd("sv_friends_only 0");
    await Bridge.cmd("maxplayers " + Math.max(2, as.max_players || 12));
    await Bridge.cmd("map " + this.cleanConsole(as.map));
    UI.status("starting local P2P server on " + as.map + "…");

    const deadline = Date.now() + Math.max(30000, (as.boot_deadline_s || 90) * 1000);
    let sawIdentityWithoutAddressAt = 0;
    let configured = false;
    while (Date.now() < deadline) {
      if (!this.host) return;
      const state = this.parseBridgeJSON(await Bridge.call("greyline_state", ""));
      const endpoint = this.parseBridgeJSON(await Bridge.call("greyline_host_address", ""));
      const level = String(state.level || "").replace(/\\/g, "/").split("/").pop().replace(/\.bsp$/i, "");
      UI.renderGame(state);
      const onMap = !!state.connected && level.toLowerCase() === String(as.map || "").toLowerCase();

      if (onMap && !configured) {
        for (const cmd of this.battleCommands(as)) await Bridge.cmd(cmd);
        configured = true;
        UI.el("diagHost").textContent = "map loaded · applying roster and policy";
        // The local host is already on the server by the time these commands
        // exist, so explicitly show them the same briefing guests get on join.
        await Bridge.cmd("greyline_announce_briefing");
      }

      if (endpoint.ready && !endpoint.address) {
        if (!sawIdentityWithoutAddressAt) sawIdentityWithoutAddressAt = Date.now();
        if (Date.now() - sawIdentityWithoutAddressAt > 5000) {
          throw new Error("listen server has no Steam FakeIP; launch the game with -enablefakeip");
        }
      }

      if (onMap && configured && endpoint.ready && endpoint.address) {
        await this.drainCommands();
        if (!this.host) return;
        this.startCommandWatch();
        await GC.serverPost(this.host, "/api/v1/servers/address", { connect_address: endpoint.address });
        const players = Math.max(1, Number(state.players || 0));
        await GC.serverPost(this.host, "/api/v1/servers/state", {
          match_id: as.match_id, state: "ready", players: players,
        });
        this.host.ready = true;
        await GC.serverPost(this.host, "/api/v1/servers/state", {
          match_id: as.match_id, state: "live", players: players,
        });
        UI.status("P2P battle live at " + endpoint.address);
        UI.el("diagHost").textContent = "live · " + endpoint.address;
        this.startGameWatch();
        return;
      }
      await this.sleep(500);
    }
    throw new Error("P2P listen server did not become ready before the boot deadline");
  },

  startGameWatch() {
    if (this.gameWatchTimer) clearInterval(this.gameWatchTimer);
    this.gameWatchTimer = setInterval(() => this.watchGameOver(), 750);
  },

  async drainCommands() {
    for (let i = 0; i < 8 && this.host; i++) {
      const cmd = await GC.serverGet(this.host, "/api/v1/servers/poll?wait=1");
      if (!cmd) return;
      await this.applyCommand(cmd);
    }
  },

  async watchGameOver() {
    const h = this.host;
    if (!h || !h.ready || h.resultReported || this.watchBusy || !Bridge.ready) return;
    this.watchBusy = true;
    try {
      const state = this.parseBridgeJSON(await Bridge.call("greyline_state", ""));
      const seq = Number(state.game_over_seq || 0);
      if (seq <= h.baselineGameOverSeq) return;

      // The server publishes the score once a second. Give the final round one
      // publish tick after the game-over event before reading it.
      await this.sleep(1250);
      const red = Math.max(0, parseInt(await Bridge.call("getcvar", "greyline_score_red"), 10) || 0);
      const blu = Math.max(0, parseInt(await Bridge.call("getcvar", "greyline_score_blu"), 10) || 0);
      const outcome = red > blu ? "RED_WIN" : (blu > red ? "BLU_WIN" : "STALEMATE");
      const players = await this.playerCount();
      await GC.serverPost(h, "/api/v1/servers/result", {
        match_id: h.matchId,
        outcome: outcome,
        red_score: red,
        blu_score: blu,
        players: players,
        duration_s: Math.max(1, Math.floor((Date.now() - h.startedAt) / 1000)),
      });
      h.resultReported = true;
      UI.status("P2P result accepted: RED " + red + " — " + blu + " BLU");
      UI.el("diagHost").textContent = "result accepted · waiting for match close";
    } catch (e) {
      UI.status("could not report P2P result: " + e.message, true);
    } finally {
      this.watchBusy = false;
    }
  },

  async finishHost(matchId) {
    const h = this.host;
    if (!h || (matchId && h.matchId !== matchId)) return;
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
    if (this.gameWatchTimer) clearInterval(this.gameWatchTimer);
    this.heartbeatTimer = this.gameWatchTimer = null;
    this.commandWatch = false;
    try { await GC.serverPost(h, "/api/v1/servers/deregister", {}); } catch (e) { /* pool will expire it anyway */ }
    this.host = null;
    UI.el("diagHost").textContent = "idle";
    try { if (Bridge.ready) await Bridge.cmd("disconnect"); } catch (e) { /* already disconnected */ }
  },

  async failHost(reason) {
    const h = this.host;
    if (!h) return;
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
    if (this.gameWatchTimer) clearInterval(this.gameWatchTimer);
    this.heartbeatTimer = this.gameWatchTimer = null;
    this.commandWatch = false;
    try {
      await GC.serverPost(h, "/api/v1/servers/state", {
        match_id: h.matchId, state: "failed", players: 0, reason: reason || "P2P host failed",
      });
    } catch (e) { /* coordinator may already have aborted it */ }
    try { await GC.serverPost(h, "/api/v1/servers/deregister", {}); } catch (e) {}
    this.host = null;
    UI.el("diagHost").textContent = "failed · " + (reason || "unknown error");
    try { if (Bridge.ready) await Bridge.cmd("disconnect"); } catch (e) {}
  },
};

// ---------------------------------------------------------------------------
// The loop: poll the coordinator, refresh the map when it moves
// ---------------------------------------------------------------------------
const Loop = {
  timer: null,
  worldTimer: null,

  start() {
    if (this.timer) return;
    this.timer = setInterval(() => this.poll(), 1500);
    this.worldTimer = setInterval(() => this.refreshWorld(), 5000);
  },

  async refreshWorld() {
    try {
      const [status, fronts, world] = await Promise.all([
        GC.get("/api/v1/status"),
        GC.get("/api/v1/world/fronts"),
        GC.get("/api/v1/world"),
      ]);
      UI.renderHeader(status);
      State.world = world.world;
      State.fronts = fronts.fronts || [];
      UI.renderMap(world.world);
      UI.renderFronts(State.fronts, State.queue && State.queue.queued);
      UI.setDot("dotGC", true);
    } catch (e) {
      UI.setDot("dotGC", false);
      UI.status("coordinator unreachable: " + e.message, true);
    }
  },

  // Everything this player is in the middle of, in one call. The event stream
  // is not replayed on reconnect — a page that reloads mid-battle would
  // otherwise forget it is in one.
  async refreshSelf() {
    const self = await GC.get("/api/v1/client/self", true);
    State.seq = self.seq || State.seq;
    State.queue = self.queue;
    State.match = self.match || null;
    UI.el("diagAuth").textContent = State.authMode + " · " + self.player.steam_id + " · " + self.player.state;
    UI.renderQueue(State.queue);
    UI.renderMatch(State.match);
  },

  async refreshTimeline() {
    try {
      const reply = await GC.get("/api/v1/world/timeline?since=" + State.timelineSeq + "&limit=50");
      const events = reply.events || [];
      if (events.length) {
        State.timelineSeq = events[events.length - 1].seq;
        UI.feed(events);
      }
    } catch (e) { /* the feed is not worth an error banner */ }
  },

  // Everything that happens to this player arrives here: the queue filling, the
  // battle being ready, the result and what it did to the war.
  async poll() {
    if (!State.connected || State.polling) return;
    State.polling = true;
    try {
      const reply = await GC.get("/api/v1/client/poll?since=" + State.seq + "&wait=0", true);
      State.seq = reply.seq || State.seq;
      (reply.events || []).forEach(ev => this.handle(ev));
      await this.refreshTimeline();
    } catch (e) {
      if (e.status === 401) {
        // The coordinator restarted, or the session aged out. Say hello again
        // rather than polling into the void.
        State.connected = false;
        UI.setDot("dotGC", false);
        UI.status("session expired — reconnecting");
        await Actions.connect();
      }
    } finally {
      State.polling = false;
    }
  },

  handle(ev) {
    switch (ev.type) {
      case "queue":
        State.queue = ev.queue;
        UI.renderQueue(ev.queue);
        UI.renderFronts(State.fronts, ev.queue && ev.queue.queued);
        break;

      case "match_state":
        // Having a battle ends the queue; leaving the DEPLOY panel saying
        // "waiting for one more" would be describing a queue that is over.
        State.queue = null;
        State.match = ev.match;
        UI.renderQueue(null);
        UI.renderMatch(ev.match);
        UI.status(ev.message || "battle forming");
        break;

      case "match_ready":
        State.queue = null;
        State.match = ev.match;
        UI.renderQueue(null);
        UI.renderMatch(ev.match);
        UI.status("battle ready at " + ev.match.connect);
        if (State.settings.autoJoin) Actions.join();
        break;

      case "match_over": {
        const finishedMatch = ev.over && ev.over.match_id;
        State.match = null;
        State.queue = null;
        UI.renderMatch(null);
        UI.renderQueue(null);
        if (P2P.host && (!finishedMatch || P2P.host.matchId === finishedMatch)) {
          P2P.finishHost(finishedMatch);
        }
        const over = ev.over || {};
        const update = over.war_update || {};
        const worth = Number(update.weight || 0);
        let line = over.won ? "Your side won it." : "Your side lost it.";
        if (worth > 0 && worth < 1) {
          // A battle counts for what it was: saying so is the difference
          // between "we won and nothing moved" and understanding why.
          line += " A battle that size is worth " + Math.round(worth * 100) +
            "% of a stage — the offensive moves when a stage's worth is fought.";
        }
        UI.banner(update.headline || over.message || "battle over", line);
        this.refreshWorld();
        break;
      }

      case "world":
        this.refreshWorld();
        if (ev.world && ev.world.headline) UI.status(ev.world.headline);
        break;

      case "contract_offer":
        if (ev.contract) UI.banner(ev.contract.message, "Deploy and you may be given that side for one battle.");
        break;

      case "host_offer":
        if (ev.host) P2P.acceptHost(ev.host);
        break;

      case "notice":
        UI.status(ev.message || "");
        break;
    }
  },
};

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async function main() {
  State.load();
  UI.el("gcUrl").value = State.settings.gc;
  UI.el("steamId").value = State.settings.steamId;
  UI.el("playerName").value = State.settings.name;
  UI.el("sidePick").value = State.settings.side;
  UI.el("autoJoin").checked = State.settings.autoJoin !== false;
  UI.el("p2pHost").checked = State.settings.p2pHost !== false;
  UI.el("p2pUpload").value = State.settings.p2pUploadKbps || 10000;
  UI.el("p2pSlots").value = State.settings.p2pMaxPlayers || 12;

  UI.el("connectBtn").onclick = () => Actions.connect();
  UI.el("steamIdBtn").onclick = () => Actions.useSteamIdentity(true);
  UI.el("deployBtn").onclick = () => Actions.deploy("");
  UI.el("joinBtn").onclick = () => Actions.join();
  UI.el("leaveBtn").onclick = () => Actions.leave();
  document.querySelectorAll("[data-menu-action]").forEach(btn => {
    btn.onclick = () => Actions.menuAction(btn.getAttribute("data-menu-action"));
  });

  Bridge.connect();

  if (await Bridge.waitReady(2500)) {
    try {
      const name = await Bridge.call("getcvar", "name");
      if (name && (!State.settings.name || State.settings.name === "mercenary")) UI.el("playerName").value = name;
    } catch (e) { /* not important enough to report */ }
    const identity = await Actions.useSteamIdentity(false);
    if (identity) await Actions.connect();
  } else if (State.settings.steamId) {
    Actions.connect();
  } else {
    UI.renderIdentity(null);
    UI.status("browser dev mode: set a SteamID and press CONNECT");
  }
})();
</script>
