// Team Frontress: a screenshot session on a live battle with bots.
//
//   1. map pl_goldrush            (any map from cfg/mapcycle_quickplay_bots.txt)
//   2. exec frontress_shots       (this file)
//   3. fly around as a spectator, F6 on every angle worth keeping
//   4. node tools/shots/make-shot-cfg.mjs pl_goldrush
//   5. next time: map pl_goldrush, exec frontress_shots, exec shots_pl_goldrush
//      -- every marked angle is revisited and shot again, identically.
//
// Keys (they replace whatever was bound there):
//   F6   mark this angle           F7   freeze / unfreeze the bots
//   F8   slow motion on / off      F9   HUD on / off
//   F11  take a JPEG now           (F5 is the stock TGA screenshot)
//
// Pictures land in tc2/screenshots/. Marks go to cfg/frontress_shots_marks.log.

sv_cheats 1
sv_allow_wait_command 1

// A battle worth photographing: full teams of hard bots, nobody waiting.
mp_waitingforplayers_cancel 1
mp_disable_respawn_times 1
mp_autoteambalance 0
mp_timelimit 0
mp_winlimit 0
tf_bot_difficulty 3
tf_bot_quota_mode fill
tf_bot_quota 18

// The camera: a free-flying spectator, with nothing drawn over the world.
jointeam spectator
// The team change and sv_cheats reach the client a few frames later.
wait 60
// 7 is OBS_MODE_ROAMING in this engine (POI sits before it); spec_goto needs it.
spec_mode 7
cl_drawhud 0
hidepanel specgui
hidepanel specmenu
r_drawviewmodel 0
crosshair 0
net_graph 0
cl_showfps 0
hud_saytext_time 0
voice_enable 0
fov_desired 90
mat_motion_blur_enabled 0
jpeg_quality 100

// On an attack map where RED is the attacker in the war but BLU in the game,
// draw the teams in the war's colours (src/game/shared/greyline):
//   greyline_uniform_swap 1

con_logfile cfg/frontress_shots_marks.log

alias shot_mark "spec_pos; echo FRONTRESS_SHOT_MARK"
alias shot_freeze_on "nb_stop 1; alias shot_freeze shot_freeze_off; echo bots frozen"
alias shot_freeze_off "nb_stop 0; alias shot_freeze shot_freeze_on; echo bots running"
alias shot_freeze "shot_freeze_on"
alias shot_slow_on "host_timescale 0.15; alias shot_slow shot_slow_off; echo slow motion"
alias shot_slow_off "host_timescale 1; alias shot_slow shot_slow_on; echo normal speed"
alias shot_slow "shot_slow_on"
alias shot_hud_on "cl_drawhud 1; alias shot_hud shot_hud_off"
alias shot_hud_off "cl_drawhud 0; hidepanel specgui; alias shot_hud shot_hud_on"
alias shot_hud "shot_hud_on"

bind F6 "shot_mark"
bind F7 "shot_freeze"
bind F8 "shot_slow"
bind F9 "shot_hud"
bind F11 "jpeg"

echo "Frontress shots: F6 mark, F7 freeze bots, F8 slow-mo, F9 HUD, F11 jpeg."
