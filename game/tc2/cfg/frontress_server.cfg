// frontress_server.cfg
//
// Example server.cfg for a dedicated server in the matchmaking pool. Copy it to
// tc2/cfg/server.cfg on the machine and fill in the four values marked CHANGE.
//
// This runs once at server start. Anything that has to be true for every match
// belongs in frontress_match.cfg instead, which the coordinator execs per match.

hostname "Team Frontress"

// CHANGE. The coordinator drives this server over RCON: map changes, the match
// password, the match tag. Without it the server can be reserved but not set
// up, and every match on it will fail to start.
rcon_password "CHANGE-ME"

// CHANGE. A Game Server Login Token for AppID 5147520, from
// https://steamcommunity.com/dev/managegameservers
//
// Without one the server runs but is not Steam-authenticated: players connect
// without their inventories and the server is invisible to the master list.
sv_setsteamaccount "CHANGE-ME"

// CHANGE if the server is not on a LAN. This is the address players are told to
// connect to; the coordinator hands out whatever its config says, so the two
// have to agree.
// ip 0.0.0.0

// SourceTV. It has to be enabled at start -- turning it on later does not take
// effect -- so it lives here rather than in the match config.
//
// Report the resulting address to the coordinator as the server's "stv" field
// and players can spectate a live match with tf_mm_watch.
tv_enable 1
tv_port 27020
tv_name "Frontress TV"
tv_delay 90
tv_maxclients 32
tv_autorecord 0
// CHANGE if you want the relay to be private.
tv_password ""

// Matchmaking servers are not community servers: they are handed out with a
// password and taken back when the match ends.
sv_pure 1
sv_lan 0
sv_region 255

// Leave hibernation off. See the note in frontress_match.cfg.
sv_hibernate_when_empty 0

// Logs. The coordinator does not read them today, but a server agent will, and
// turning this on after something goes wrong is too late.
log on
sv_logecho 1
sv_logfile 1
sv_logbans 1

exec banned_user.cfg
exec banned_ip.cfg
writeid
writeip

echo "[frontress] server config applied"
