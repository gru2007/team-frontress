// frontress_server.cfg
//
// Example server.cfg for a dedicated server in the matchmaking pool. Copy it to
// tc2/cfg/server.cfg on the machine and fill in the values marked CHANGE.
//
// The server takes its matches from the Team Frontress game coordinator: it
// connects to it, reports itself empty, and is handed a match lobby -- which
// map, which players on which team. The stock game does the rest. The game
// execs server_casual.cfg / server_competitive.cfg for the match itself.

hostname "Team Frontress"

// CHANGE. The game coordinator, and the key it gave this server
// (server_keys in its config). In a container, GC_URL and GC_SECRET in the
// environment work instead.
tf_gc_server_url "CHANGE-ME"
tf_gc_server_key "CHANGE-ME"

// CHANGE if players reach this server at an address other than its public IP
// and hostport (NAT, a relay). The game coordinator hands this to players.
// tf_gc_server_connect "203.0.113.10:27015"

// A matchmaking server: the lobby's roster is the door. No password -- the
// stock game turns matchmaking off on a passworded server.
tf_mm_servermode 1
tf_mm_strict 1
tf_mm_trusted 1
sv_password ""

// For administration only. The game coordinator never uses RCON.
rcon_password "CHANGE-ME"

// CHANGE. A Game Server Login Token for the AppID this server runs as -- the
// one in steam_appid.txt next to the binary, 5147520 unless the payload was
// stamped for another app -- from
// https://steamcommunity.com/dev/managegameservers
//
// Without one the server runs but is not Steam-authenticated: players connect
// without their inventories and the server is invisible to the master list.
sv_setsteamaccount "CHANGE-ME"

// CHANGE if the machine has more than one address.
// ip 0.0.0.0

// SourceTV. It has to be enabled at start -- turning it on later does not take
// effect -- so it lives here rather than in the match config.
//
tv_enable 1
tv_port 27020
tv_name "Frontress TV"
tv_delay 90
tv_maxclients 32
tv_autorecord 0
// CHANGE if you want the relay to be private.
tv_password ""

// Matchmaking servers are not community servers: the game coordinator hands
// them out and takes them back when the match ends.
sv_pure 1
sv_lan 0
sv_region 255

// Leave hibernation off. See the note in frontress_match.cfg.
sv_hibernate_when_empty 0

// Logs. Turning this on after something goes wrong is too late.
log on
sv_logecho 1
sv_logfile 1
sv_logbans 1

exec banned_user.cfg
exec banned_ip.cfg
writeid
writeip

echo "[frontress] server config applied"
