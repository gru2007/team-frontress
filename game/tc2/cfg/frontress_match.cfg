// frontress_match.cfg
//
// Settings every match server wants, whatever the match. Exec it from
// server.cfg. It must be idempotent and must not contain anything
// server-specific (that belongs in server.cfg).
//
// Never set sv_password here: a matchmaking server has none, and the stock
// game turns matchmaking mode off on any server that does.

// A server that hibernates does not act on a map change until somebody
// connects, so the first player to arrive lands on the previous map. This is
// the single most common way a matchmade server looks broken.
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 5

// Players arrive through matchmaking; nothing here should advertise the
// server as joinable from the browser.
sv_lan 0
sv_region 255

// Keep the match running rather than ending it under the players.
mp_match_end_at_timelimit 0
mp_bonusroundtime 15

// Frontline fills servers while they run, so the round must not end the moment
// the sides are uneven. Let TF2's own balancing handle the churn.
mp_autoteambalance 1
mp_autoteambalance_delay 60
mp_teams_unbalance_limit 2

// Late arrivals are the normal case, not an exception.
mp_allowspectators 1
mp_forcecamera 1

// Voice and text stay within teams; a matchmade lobby is strangers.
sv_alltalk 0

// No bots filling seats the coordinator is trying to fill with people.
tf_bot_quota 0
tf_bot_quota_mode "normal"

echo "[frontress] match config applied"
