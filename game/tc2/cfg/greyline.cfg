// GREYLINE FRONTRESS — coordinator settings.
//
// Exec'd automatically at startup. Edit this file rather than typing the
// settings into the console every session.

// Where the Game Coordinator lives. Change this to your coordinator's address.
greyline_gc_address "127.0.0.1:27100"

// Connect at all. Turning this off leaves the game a plain TC2 install.
greyline_gc_enable 1

// Offer this machine as a battle host. Set to 0 on a laptop, a metered
// connection, or anything you do not want running a server for nine other
// people. You will still play; you will simply never be the host.
greyline_can_host 1

// Your upload bandwidth in kbps, used for host election. Left at 0 the game
// reports a deliberately conservative estimate, because claiming more than you
// have wins elections your machine cannot honour.
greyline_upload_kbps 0

// Bind DEPLOY somewhere reachable until the world map screen exists.
// bind "F5" "greyline_deploy any"
