// GREYLINE FRONTRESS — client settings.
//
// Exec'd automatically at startup. Edit this file rather than typing the
// settings into the console every session.

// Where the Game Coordinator lives. Change this to your coordinator's address.
greyline_gc_address "127.0.0.1:27100"

// The peer-to-peer coordinator link, where your own machine could be elected to
// host a battle. It is retired: battles now run on the coordinator's pool of
// dedicated servers, so nothing in the client needs to become a server. The
// convars below are kept because the old code still compiles, and are ignored
// while this is 0.
greyline_gc_enable 0
greyline_can_host 0
greyline_upload_kbps 0

// Battle briefings — the chat and HUD lines telling you which offensive the
// battle you are in belongs to — are sent by the game server, not configured
// here. See greyline_briefing_enabled on the server side.
