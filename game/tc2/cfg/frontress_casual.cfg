// frontress_casual.cfg
//
// The ruleset for Casual Frontline. The coordinator execs this on a pooled
// server immediately before the map change of a casual match.
//
// It is the stock casual matchmaking ruleset (server_casual.cfg) minus the
// parts that only make sense with Valve's GC, plus the frontline rules: a
// casual match keeps taking players while it runs, so nothing here may end a
// round because the sides are briefly uneven.
//
// The coordinator sets sv_password, sv_tags and maxplayers itself. Do not set
// them here.

exec frontress_match

// Casual is the open queue. Players arrive mid-match by design, so the match
// must not wait for everybody to press ready.
mp_tournament 0
mp_tournament_readymode 0

mp_forceautoteam 0
mp_forcecamera 1
mp_idledealmethod 2
mp_idlemaxtime 5
mp_idledealduringplay 0

// No class limits and no damage restrictions: this is the fun queue.
mp_sixes 0
tf_weapon_criticals 1
tf_damage_disablespread 0
mp_tournament_whitelist ""

// Round flow. The coordinator decides when a match is over, so no win limit
// ends the server out from under it, but a stalemate should not last forever.
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 30
mp_stalemate_enable 1
mp_stalemate_timelimit 240
mp_bonusroundtime 15
mp_tournament_post_match_period 30

tf_ctf_bonus_time 10
tf_flag_caps_per_round 3

// Uneven sides are the normal state of a match that is still filling.
mp_autoteambalance 1
mp_autoteambalance_delay 60
mp_teams_unbalance_limit 2

// Votes players can actually be trusted with in a queue of strangers.
sv_vote_issue_kick_allowed 1
sv_vote_issue_nextlevel_allowed 0
sv_vote_issue_scramble_teams_allowed 1
sv_vote_issue_restart_game_allowed 0
sv_vote_issue_changelevel_allowed 0
sv_vote_issue_pause_game_allowed 0

sv_namechange_cooldown_seconds 300
tf_allow_player_name_change 0

echo "[frontress] casual ruleset applied"
