// Screenshots of a fight (store page, docs). Developer only: it turns cheats on.
//   ./tc2_osx -windowed -fui_autoexec fui_dev_steam_fight +sv_lan 1 +maxplayers 24 +map cp_granary
// Plays as soldier on the middle control point among 21 bots, takes HUD shots
// (screenshots/steam_hud_*), then spectates from above it (steam_pano_*), and quits.
sv_cheats 1
net_graph 0
mp_waitingforplayers_cancel 1
mp_autoteambalance 0
mp_teams_unbalance_limit 0
mp_respawnwavetime 2
tf_bot_quota_mode normal
// What a war server would set from the coordinator (frontress_conditions.cpp):
// the HUD's war banner, and the battle's conditions in force.
tf_war_battle "3|3|advance|red|2|true|Junction"
tf_war_conditions "quickwaves,nocrits"
exec frontress_cond_nocrits.cfg
fui_after 1 "fui_dev_hide info; jointeam red"
fui_after 3 "joinclass soldier"
fui_after 4 "tf_bot_add 10 red; tf_bot_add 11 blue"
fui_after 100 "fui_dev_goto"
fui_after 109 "jpeg steam_hud_a 95"
fui_after 117 "jpeg steam_hud_b 95"
fui_after 125 "jpeg steam_hud_c 95"
fui_after 127 "fui_hud 0; cl_drawhud 0; crosshair 0; jointeam spectator"
fui_after 130 "fui_dev_hide specgui; fui_dev_cam 0"
fui_after 133 "fui_dev_hide specgui; jpeg steam_pano_1 95"
fui_after 134 "fui_dev_cam 2"
fui_after 137 "fui_dev_hide specgui; jpeg steam_pano_2 95"
fui_after 138 "fui_dev_cam 4"
fui_after 141 "fui_dev_hide specgui; jpeg steam_pano_3 95"
fui_after 142 "fui_dev_cam 6"
fui_after 145 "fui_dev_hide specgui; jpeg steam_pano_4 95"
fui_after 146 "fui_dev_cam 1"
fui_after 149 "fui_dev_hide specgui; jpeg steam_pano_5 95"
fui_after 150 "fui_dev_cam 5"
fui_after 153 "fui_dev_hide specgui; jpeg steam_pano_6 95"
fui_after 154 "fui_hud 1; cl_drawhud 1; crosshair 1; quit"
