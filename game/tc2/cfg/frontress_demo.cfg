// Team Frontress demo: one local battle with bots.
//
// Executed by the client (src/game/client/tf/frontress/tf_frontress_demo.cpp)
// once the battle map has loaded. Right after it come the battle's
// conditions (frontress_mod_<id>.cfg), the player joins their side, and the
// bots are added team by team as the page planned them.
//
// One full round decides the battle; the client returns to the war map
// tf_frontress_demo_return_delay seconds after it.

sv_lan 1

// Bots are added by the client, per team and skill (tf_bot_add ... noquota),
// so the quota manager stays out of it.
tf_bot_quota_mode normal
tf_bot_quota 0
tf_bot_join_after_player 1
tf_bot_auto_vacate 0

// The human stays on the side the campaign chose.
mp_autoteambalance 0
mp_teams_unbalance_limit 0

mp_tournament 0
mp_waitingforplayers_cancel 1
mp_timelimit 0
mp_winlimit 0
mp_maxrounds 0
mp_stalemate_enable 0
mp_bonusroundtime 10

// Undo every battle condition (cfg/frontress_mod_*.cfg); the ones this
// battle has are exec'd right after this file.
tf_bot_keep_class_after_death 0
tf_bot_melee_only 0
mp_respawnwavetime 10
tf_weapon_criticals 1
tf_grapplinghook_enable 0
sv_gravity 800
