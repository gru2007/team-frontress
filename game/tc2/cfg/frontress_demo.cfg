// Team Frontress demo: one local battle with bots.
//
// Executed by the client (src/game/client/tf/frontress/tf_frontress_demo.cpp)
// once the battle map has loaded. Right after it the player is put on the
// side they fight for, and only then is tf_bot_quota raised, so fill mode
// sizes both teams around the human: 8/12/18 -> 4v4 / 6v6 / 9v9.
//
// One full round decides the battle; the client returns to the war map
// tf_frontress_demo_return_delay seconds after it.

sv_lan 1

tf_bot_quota_mode fill
tf_bot_difficulty 1
tf_bot_join_after_player 1
tf_bot_auto_vacate 0

// The human stays on the side the campaign chose.
mp_autoteambalance 0
mp_teams_unbalance_limit 0

mp_tournament 0
mp_waitingforplayers_cancel 1
mp_timelimit 0
mp_winlimit 0
mp_maxrounds 0
mp_stalemate_enable 0
mp_bonusroundtime 10
