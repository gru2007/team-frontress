// The menu's social side against a coordinator on this machine (services/gc
// with support.fake on; cmd/gc-devserver -chatters 4 brings people to talk
// to). Chat, who is online, a clan founded from the game, a test donation,
// and party members in war paints and unusuals (fui_fake_skins).
//   ./tc2_osx -windowed +exec fui_dev_social
// Remove tf_gc_url from cfg/config.cfg afterwards: it is archived.
tf_gc_url "http://127.0.0.1:27100"
fui_fake_party 3
fui_after 90 "fui_screen home"
fui_after 97 "jpeg social_home 95"
fui_after 98 "fui_set social.tab online"
fui_after 102 "jpeg social_online 95"
fui_after 103 "fui_set social.tab global; fui_set ui.chat_draft \"Всем привет из игры!\"; fui_cmd chat_send"
fui_after 107 "jpeg social_chat 95"
fui_after 108 "fui_screen clan"
fui_after 113 "jpeg social_clans 95"
fui_after 114 "fui_set clanform.name Kuznya; fui_set clanform.tag KF; fui_set clanform.color teal; fui_set clanform.emblem soldier; fui_cmd clan_create"
fui_after 120 "jpeg social_clan 95"
fui_after 121 "fui_screen support"
fui_after 127 "jpeg social_support 95"
fui_after 128 "fui_cmd support_buy monthly 0"
fui_after 133 "jpeg social_support_paid 95"
fui_after 134 "fui_screen home; tf_inventory_status"
fui_after 141 "jpeg social_home_after 95"
fui_after 143 "quit"
