// frontress_ranked.cfg
//
// The ruleset for ranked matches. The coordinator execs this on a pooled
// server immediately before the map change of a ranked match.
//
// Ranked is the restricted queue in every sense: the coordinator forms the
// roster once and never adds to it, and the server plays the competitive
// ruleset -- class limits, no random crits, no damage spread, a weapon
// whitelist, and no votes that could change any of it.
//
// The coordinator sets sv_password, sv_tags and maxplayers itself. Do not set
// them here.

exec frontress_match

// Tournament mode with ready-up: a ranked match has a fixed roster, so it can
// afford to wait for it. mp_tournament_readymode_min 0 lets the server start
// once both teams are ready rather than at a hardcoded count.
mp_tournament 1
mp_tournament_readymode 1
mp_tournament_readymode_min 0
mp_tournament_readymode_countdown 10
mp_tournament_post_match_period 90

// 6v6 class limits. This is the game's own restriction, not a plugin's.
mp_sixes 1
mp_tournament_whitelist "cfg/whitelist_competitive.txt"

// Competitive damage rules.
tf_weapon_criticals 0
tf_weapon_criticals_melee 0
tf_damage_disablespread 1
tf_use_fixed_weaponspreads 1
tf_ctf_bonus_time 0

// The roster is fixed, so nothing may move a player between teams: no
// autobalance, no scramble, no team switching after the match starts.
mp_autoteambalance 0
mp_teams_unbalance_limit 0
mp_forceautoteam 0
mp_scrambleteams_auto 0
mp_forcecamera 1

// Round flow. Win conditions belong to the match, not to the server clock.
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 0
mp_windifference 0
mp_match_end_at_timelimit 0
mp_stalemate_enable 0
mp_bonusroundtime 10
mp_respawnwavetime 10

// Idle players lose a ranked match for five other people. Kick them.
mp_idledealmethod 2
mp_idlemaxtime 3
mp_idledealduringplay 1
mp_idleunready 30

// Nothing about a ranked match is up for a vote.
sv_vote_issue_kick_allowed 0
sv_vote_issue_nextlevel_allowed 0
sv_vote_issue_changelevel_allowed 0
sv_vote_issue_extendlevel_allowed 0
sv_vote_issue_scramble_teams_allowed 0
sv_vote_issue_autobalance_allowed 0
sv_vote_issue_classlimits_allowed 0
sv_vote_issue_restart_game_allowed 0
sv_vote_issue_pause_game_allowed 1

// Identity matters when the result is recorded against it.
sv_namechange_cooldown_seconds 600
tf_allow_player_name_change 0
sv_pure 2

echo "[frontress] ranked ruleset applied"
